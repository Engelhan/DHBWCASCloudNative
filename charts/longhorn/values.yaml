# Upstream values (dependency alias).
longhorn:
  # The pre-upgrade hook runs as PreSync under ArgoCD, before its own ServiceAccount exists.
  preUpgradeChecker:
    jobEnabled: false
  persistence:
    defaultClass: true
    # Must be <= node count; 1 keeps disk usage low on the lab VMs.
    defaultClassReplicaCount: 1
  defaultSettings:
    defaultReplicaCount: 1
    # Would be longhorn-system's only internet egress; versions are pinned in Chart.yaml.
    upgradeChecker: false
    replicaAutoBalance: least-effort
    # Migrate the last replica before a drain so node upgrades never block.
    nodeDrainPolicy: block-for-eviction-if-contains-last-replica
    storageOverProvisioningPercentage: 300
    # Resources for the CSI pods Longhorn creates at runtime (measured ~10-20Mi, 1-2m CPU).
    # Changing this restarts them.
    systemManagedCSIComponentsResourceLimits: >-
      {
      "csi-attacher": {"requests": {"cpu": "10m", "memory": "24Mi"}, "limits": {"cpu": "100m", "memory": "64Mi"}},
      "csi-provisioner": {"requests": {"cpu": "10m", "memory": "24Mi"}, "limits": {"cpu": "100m", "memory": "64Mi"}},
      "csi-resizer": {"requests": {"cpu": "10m", "memory": "24Mi"}, "limits": {"cpu": "100m", "memory": "64Mi"}},
      "csi-snapshotter": {"requests": {"cpu": "10m", "memory": "24Mi"}, "limits": {"cpu": "100m", "memory": "64Mi"}},
      "longhorn-csi-plugin": {"requests": {"cpu": "10m", "memory": "32Mi"}, "limits": {"cpu": "200m", "memory": "128Mi"}},
      "node-driver-registrar": {"requests": {"cpu": "5m", "memory": "16Mi"}, "limits": {"cpu": "50m", "memory": "32Mi"}},
      "longhorn-liveness-probe": {"requests": {"cpu": "5m", "memory": "16Mi"}, "limits": {"cpu": "50m", "memory": "32Mi"}}
      }

  # P4: UI hard-spread across regions. CSI sidecars and the driver deployer are not configurable.
  longhornUI:
    replicas: 2
    affinity:
      podAntiAffinity:
        # Drop the upstream soft rule (Helm merges maps).
        preferredDuringSchedulingIgnoredDuringExecution: null
        requiredDuringSchedulingIgnoredDuringExecution:
          - topologyKey: topology.ticketflow/region
            labelSelector:
              matchExpressions:
                - key: app
                  operator: In
                  values:
                    - longhorn-ui
  # Only the manager has a resources field.
  longhornManager:
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi

  # No securityContext/networkPolicy fields: Longhorn needs privileged host access.
