# Zentrale, deployment-weite Werte - werden NICHT hier gepflegt, sondern in
# gitops/env/cluster.yaml (ArgoCD reicht die Datei jedem Chart per Multi-Source "$values"
# durch, siehe gitops/applicationset.yaml). Der leere Default steht hier nur, damit ein
# Rendern ohne diese Datei eine verstaendliche Fehlermeldung statt eines Nil-Pointers liefert.
# Lokal deshalb immer:
#   helm template <name> charts/<name> -f charts/<name>/values.yaml -f gitops/env/cluster.yaml
ticketflow: {}

# ACME-Kontakt, ACME-Server, DNS-Zone und TSIG-Key-Name stehen NICHT mehr hier, sondern zentral
# in gitops/env/cluster.yaml (ticketflow.acmeEmail / .acmeServer / .dnsZone / .rfc2136.*) -
# dieselbe Quelle, aus der sich auch charts/external-dns und alle Ingress-Hostnamen speisen.
#
# Voraussetzung (VOR dem ersten Sync, bewusst NICHT im Repo): das TSIG-Secret. Wird von
# infra/ansible/roles/gitops_secrets aus infra/ansible/secrets.yml angelegt, manuell waere es:
#   kubectl -n cert-manager create secret generic cert-manager-rfc2136-tsig \
#     --from-literal=secret=<TSIG-Wert>

clusterIssuerName: certificate-cluster-issuer
privateKeySecretName: cert-manager-private-key-secret

# dns01 ist die einzige Challenge, die Wildcard-Zertifikate ausstellen kann; http01 braucht
# keine DNS-Zone/TSIG-Key, kann aber kein "*.zone"-Zertifikat ausstellen.
#
# Kurzzeitig auf http01 getestet, weil das erste dns01-Zertifikat (argocd-server-tls) im
# ACME-Order-Status "ready" haengen blieb (Challenge validierte, aber kein Finalize-Call) -
# Ursache war der DHBW-ACME-Server selbst (certificates.dhbw.cloud), der zu dem Zeitpunkt nicht
# erreichbar war, kein cert-manager-/Issuer-Problem. Zurueckgestellt auf dns01.
challenge: dns01 # dns01 | http01

rfc2136:
  # Adresse/Zone/Key-Name kommen aus gitops/env/cluster.yaml (siehe oben). Hier bleiben nur die
  # Werte, die fuer jedes Deployment gleich sind.
  port: 53
  tsigAlgorithm: hmac-sha512
  # Verweist nur auf ein per Ansible/External-Secret angelegtes Secret - der Wert selbst steht
  # bewusst NICHT im Repo (siehe Aktivierungs-Hinweis oben).
  tsigSecretName: cert-manager-rfc2136-tsig

# Traefik serviert dieses Zertifikat fuer jeden HTTPS-Host ohne spezifischeres Zertifikat.
wildcardCertificate:
  enabled: false
  secretName: wildcard-tls
  # k3s buendelt Traefik in kube-system - dort muss das Wildcard-Secret liegen.
  traefikNamespace: kube-system
