# Set via gitops/env/cluster.yaml; empty default only for a readable error.
ticketflow: {}

# ACME/DNS settings come from gitops/env/cluster.yaml. The TSIG secret is created by
# infra/ansible/roles/gitops_secrets.

clusterIssuerName: certificate-cluster-issuer
privateKeySecretName: cert-manager-private-key-secret

# dns01 is required for the wildcard certificate.
challenge: dns01  # dns01 | http01

rfc2136:
  port: 53
  tsigAlgorithm: hmac-sha512
  # Created outside the repo (Ansible).
  tsigSecretName: cert-manager-rfc2136-tsig

wildcardCertificate:
  enabled: false
  secretName: wildcard-tls
  # k3s runs Traefik in kube-system.
  traefikNamespace: kube-system
