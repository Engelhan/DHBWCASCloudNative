{{- if .Values.wildcardCertificate.enabled }}
{{- if ne .Values.challenge "dns01" }}
{{- fail "wildcardCertificate.enabled erfordert challenge: dns01 (Wildcards koennen nicht per http01 validiert werden)" }}
{{- end }}
# Ein Wildcard-Zertifikat fuer *.<ticketflow.dnsZone> statt Zertifikate pro Host.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ .Values.wildcardCertificate.secretName }}
  namespace: {{ .Values.wildcardCertificate.traefikNamespace }}
spec:
  secretName: {{ .Values.wildcardCertificate.secretName }}
  dnsNames:
    - "*.{{ (required "ticketflow.dnsZone fehlt - gitops/env/cluster.yaml mitgeben (-f gitops/env/cluster.yaml)" .Values.ticketflow.dnsZone) }}"
  issuerRef:
    name: {{ .Values.clusterIssuerName }}
    kind: ClusterIssuer
---
# Traefik serviert dieses Zertifikat fuer jeden HTTPS-Host ohne spezifischeres Zertifikat - muss
# "default" heissen und im Traefik-Namespace liegen.
apiVersion: traefik.io/v1alpha1
kind: TLSStore
metadata:
  name: default
  namespace: {{ .Values.wildcardCertificate.traefikNamespace }}
spec:
  defaultCertificate:
    secretName: {{ .Values.wildcardCertificate.secretName }}
{{- end }}
