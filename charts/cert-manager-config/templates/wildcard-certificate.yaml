{{- if .Values.wildcardCertificate.enabled }}
{{- if ne .Values.challenge "dns01" }}
{{- fail "wildcardCertificate.enabled requires challenge: dns01 (wildcards cannot be validated via http01)" }}
{{- end }}
# One wildcard certificate for *.<dnsZone>.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ .Values.wildcardCertificate.secretName }}
  namespace: {{ .Values.wildcardCertificate.traefikNamespace }}
spec:
  secretName: {{ .Values.wildcardCertificate.secretName }}
  dnsNames:
    - "*.{{ (required "ticketflow.dnsZone is missing - pass gitops/env/cluster.yaml (-f gitops/env/cluster.yaml)" .Values.ticketflow.dnsZone) }}"
  issuerRef:
    name: {{ .Values.clusterIssuerName }}
    kind: ClusterIssuer
---
# Traefik's default certificate: must be named "default" in Traefik's namespace.
apiVersion: traefik.io/v1alpha1
kind: TLSStore
metadata:
  name: default
  namespace: {{ .Values.wildcardCertificate.traefikNamespace }}
spec:
  defaultCertificate:
    secretName: {{ .Values.wildcardCertificate.secretName }}
{{- end }}
