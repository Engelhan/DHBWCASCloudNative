apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: {{ .Values.clusterIssuerName }}
spec:
  acme:
    email: {{ (required "ticketflow.acmeEmail is missing - pass gitops/env/cluster.yaml (-f gitops/env/cluster.yaml)" .Values.ticketflow.acmeEmail) | quote }}
    server: {{ (required "ticketflow.acmeServer is missing - pass gitops/env/cluster.yaml (-f gitops/env/cluster.yaml)" .Values.ticketflow.acmeServer) | quote }}
    privateKeySecretRef:
      name: {{ .Values.privateKeySecretName }}
    solvers:
{{- if eq .Values.challenge "dns01" }}
      - dns01:
          rfc2136:
            {{- if contains ":" .Values.ticketflow.rfc2136.server }}
            nameserver: "[{{ .Values.ticketflow.rfc2136.server }}]:{{ .Values.rfc2136.port }}"
            {{- else }}
            nameserver: "{{ .Values.ticketflow.rfc2136.server }}:{{ .Values.rfc2136.port }}"
            {{- end }}
            tsigKeyName: {{ (required "ticketflow.rfc2136.keyName is missing - pass gitops/env/cluster.yaml (-f gitops/env/cluster.yaml)" .Values.ticketflow.rfc2136.keyName) | quote }}
            tsigAlgorithm: {{ .Values.rfc2136.tsigAlgorithm | replace "-" "" | upper }}
            tsigSecretSecretRef:
              name: {{ .Values.rfc2136.tsigSecretName }}
              key: secret
{{- else }}
      - http01:
          ingress:
            class: traefik
{{- end }}
