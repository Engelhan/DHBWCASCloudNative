# HA-Werte. Drei Replicas teilen sich die Partitionen von config.resultTopic per
# Consumer-Group-Rebalancing und geben topologySpreadConstraints (maxSkew: 1) etwas zu verteilen -
# eine simulierte Region kann ausfallen, ohne den Benachrichtigungspfad ganz zu verlieren
# (P4/P5).
replicaCount: 3

podDisruptionBudget:
  minAvailable: 2
