{{- if .Values.podMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: {{ include "notification-worker.fullname" . }}
  labels:
    {{- include "notification-worker.labels" . | nindent 4 }}
    {{- with .Values.podMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  # PodMonitor: no Service, nothing else calls the HTTP endpoints.
  selector:
    matchLabels:
      {{- include "notification-worker.selectorLabels" . | nindent 6 }}
  podMetricsEndpoints:
    - port: http
      path: /metrics
      interval: {{ .Values.podMonitor.interval }}
{{- end }}
