apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "notification-worker.fullname" . }}
  labels:
    {{- include "notification-worker.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "notification-worker.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "notification-worker.labels" . | nindent 8 }}
    spec:
      # Weiche Verteilung ueber die drei simulierten Regionen (P4) - siehe values.yaml-Kommentar
      # bei topologySpreadConstraint. whenUnsatisfiable: ScheduleAnyway statt DoNotSchedule, damit
      # ein Ein-Node-Dev-Setup nicht haengen bleibt - gleiches Muster wie in den anderen
      # Applikations-Charts.
      {{- if .Values.topologySpreadConstraint.enabled }}
      topologySpreadConstraints:
        - maxSkew: {{ .Values.topologySpreadConstraint.maxSkew }}
          topologyKey: topology.ticketflow/region
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "notification-worker.selectorLabels" . | nindent 14 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: notification-worker
          image: {{ include "notification-worker.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "notification-worker.fullname" . }}
            - secretRef:
                name: {{ include "notification-worker.fullname" . }}
          {{- if .Values.config.kafkaSasl.enabled }}
          env:
            - name: KAFKA_SASL_PASSWORD
              valueFrom:
                secretKeyRef:
                  # Vom Strimzi User Operator automatisch angelegtes Secret (siehe
                  # values.yaml-Kommentar bei config.kafkaSasl) - nicht dieser Chart.
                  name: {{ .Values.config.kafkaSasl.secretName }}
                  key: password
          {{- end }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
