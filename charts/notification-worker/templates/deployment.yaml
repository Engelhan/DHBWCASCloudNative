apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "notification-worker.fullname" . }}
  labels:
    {{- include "notification-worker.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "notification-worker.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "notification-worker.labels" . | nindent 8 }}
    spec:
      # Harte Verteilung ueber die drei simulierten Regionen (P4): DoNotSchedule + maxSkew 1 heisst,
      # schon das zweite Replica MUSS in einer anderen Region landen als das erste. Nodes ohne
      # Regions-Label (die Control-Plane) fallen damit automatisch heraus. matchLabelKeys zaehlt
      # nur Pods derselben ReplicaSet-Revision - sonst blockieren beim Rollout die alten Pods die
      # Regionen, in die die neuen sollen.
      {{- if .Values.topologySpreadConstraint.enabled }}
      topologySpreadConstraints:
        - maxSkew: {{ .Values.topologySpreadConstraint.maxSkew }}
          topologyKey: topology.ticketflow/region
          whenUnsatisfiable: DoNotSchedule
          matchLabelKeys:
            - pod-template-hash
          labelSelector:
            matchLabels:
              {{- include "notification-worker.selectorLabels" . | nindent 14 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: notification-worker
          image: {{ include "notification-worker.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "notification-worker.fullname" . }}
            - secretRef:
                # Bewusst NICHT fullname: das waere der Name des vom Strimzi User Operator
                # erzeugten SCRAM-Secrets - siehe _helpers.tpl notification-worker.secretName.
                name: {{ include "notification-worker.secretName" . }}
          {{- if .Values.config.kafkaSasl.enabled }}
          env:
            - name: KAFKA_SASL_PASSWORD
              valueFrom:
                secretKeyRef:
                  # Vom Strimzi User Operator automatisch angelegtes Secret (siehe
                  # values.yaml-Kommentar bei config.kafkaSasl) - nicht dieser Chart.
                  name: {{ .Values.config.kafkaSasl.secretName }}
                  key: password
          {{- end }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
