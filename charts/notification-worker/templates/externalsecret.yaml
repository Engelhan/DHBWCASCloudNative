{{- if .Values.externalSecret.enabled }}
# Root-README ## Bonus B1: ersetzt das vorherige chart-eigene Secret-Template (secret.create war
# vorher true, siehe values.yaml). Zielobjekt bleibt byte-identisch - selber Name/dieselben Keys,
# deployment.yaml aendert sich nicht (liest weiterhin per envFrom.secretRef).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "notification-worker.secretName" . }}
  labels:
    {{- include "notification-worker.labels" . | nindent 4 }}
spec:
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  refreshInterval: 1h
  target:
    name: {{ include "notification-worker.secretName" . }}
  data:
    - secretKey: SMTP_USERNAME
      remoteRef:
        key: notification-worker/smtp
        property: username
    - secretKey: SMTP_PASSWORD
      remoteRef:
        key: notification-worker/smtp
        property: password
    - secretKey: KAFKA_TLS_CA_CERT
      remoteRef:
        key: notification-worker/kafka-tls
        property: ca-cert
    - secretKey: KAFKA_TLS_CLIENT_CERT
      remoteRef:
        key: notification-worker/kafka-tls
        property: client-cert
    - secretKey: KAFKA_TLS_CLIENT_KEY
      remoteRef:
        key: notification-worker/kafka-tls
        property: client-key
{{- end }}
