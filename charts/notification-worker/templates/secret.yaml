{{- if .Values.secret.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "notification-worker.secretName" . }}
  labels:
    {{- include "notification-worker.labels" . | nindent 4 }}
type: Opaque
stringData:
  # Platzhalter-Struktur; echte Werte via --set/--set-file/External Secret zur Deploy-Zeit, nie im
  # Repo committen (siehe values.yaml-Kommentar).
  SMTP_USERNAME: {{ .Values.secret.smtpUsername | quote }}
  SMTP_PASSWORD: {{ .Values.secret.smtpPassword | quote }}
  KAFKA_TLS_CA_CERT: {{ .Values.secret.kafkaTlsCaCert | quote }}
  KAFKA_TLS_CLIENT_CERT: {{ .Values.secret.kafkaTlsClientCert | quote }}
  KAFKA_TLS_CLIENT_KEY: {{ .Values.secret.kafkaTlsClientKey | quote }}
{{- end }}
