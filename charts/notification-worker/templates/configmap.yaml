apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "notification-worker.fullname" . }}
  labels:
    {{- include "notification-worker.labels" . | nindent 4 }}
data:
  KAFKA_BROKERS: {{ .Values.config.kafkaBrokers | quote }}
  RESULT_TOPIC: {{ .Values.config.resultTopic | quote }}
  CONSUMER_GROUP: {{ .Values.config.consumerGroup | quote }}
  DLT_TOPIC: {{ .Values.config.dltTopic | quote }}
  NOTIFY_MAX_RETRIES: {{ .Values.config.notifyMaxRetries | quote }}
  NOTIFY_RETRY_BACKOFF: {{ .Values.config.notifyRetryBackoff | quote }}
  REGISTRY_URL: {{ .Values.config.registryUrl | quote }}
  REGISTRY_GROUP_ID: {{ .Values.config.registryGroupId | quote }}
  LOG_LEVEL: {{ .Values.config.logLevel | quote }}
  HTTP_ADDR: {{ .Values.config.httpAddr | quote }}
  KAFKA_TLS_ENABLED: {{ .Values.config.kafkaTls.enabled | quote }}
  SMTP_ENABLED: {{ .Values.config.smtp.enabled | quote }}
  SMTP_HOST: {{ .Values.config.smtp.host | quote }}
  SMTP_PORT: {{ .Values.config.smtp.port | quote }}
  SMTP_FROM: {{ .Values.config.smtp.from | quote }}
  SMTP_TLS_MODE: {{ .Values.config.smtp.tlsMode | quote }}
