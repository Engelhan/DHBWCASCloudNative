# Kleine Werte fuer Funktionstests auf den Lab-VMs. Ein Replica reicht, um den Consumer-Pfad
# durchzuspielen; das PodDisruptionBudget wird dabei auf minAvailable: 1 gesenkt, weil ein Budget
# von 2 bei einem einzigen Replica jeden Node-Drain blockieren wuerde.
replicaCount: 1

podDisruptionBudget:
  minAvailable: 1
