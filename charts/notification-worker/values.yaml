# Set via gitops/env/cluster.yaml; empty default only for a readable error.
ticketflow: {}

# Empty: registry/tag from gitops/env/cluster.yaml. Never :latest (P3).
image:
  repository: ""
  tag: ""
  pullPolicy: IfNotPresent

# Replicas share the partitions; more replicas than partitions stay idle.
replicaCount: 3

resources:
  requests:
    cpu: 25m
    memory: 32Mi
  limits:
    cpu: 100m
    memory: 64Mi

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

config:
  # Empty = derived (SASL listener 9092).
  kafkaBrokers: ""
  # Must match charts/kafka-cluster kafka.topics.
  resultTopic: "reservation-result"
  consumerGroup: "notification-worker"
  # Empty = no dead-letter publish (offsets are still committed only after a successful send).
  dltTopic: ""
  notifyMaxRetries: 3
  notifyRetryBackoff: "2s"
  # Empty = derived from ticketflow.namespaces.kafka.
  registryUrl: ""
  registryGroupId: "ticketflow"
  logLevel: "info"
  httpAddr: ":8080"

  kafkaTls:
    enabled: false  # optional mTLS; certs from secret.kafkaTls*

  # B2: SCRAM as KafkaUser notification-worker; secret created by Strimzi.
  kafkaSasl:
    enabled: true
    username: notification-worker
    secretName: notification-worker

  smtp:
    enabled: false  # demo-safe default: log only
    host: ""
    port: 587
    from: ""
    tlsMode: "starttls"  # none|starttls|tls

secret:
  # Provided by templates/externalsecret.yaml instead (B1).
  create: false
  # Empty = "<release>-credentials" (avoids the Strimzi secret name).
  name: ""

# B1: from OpenBao. SMTP/mTLS paths are seeded empty; fill them with bao kv put when needed.
externalSecret:
  enabled: true

# Off: no Prometheus in the cluster.
podMonitor:
  enabled: false
  interval: 30s
  labels:
    release: kube-prometheus-stack

podDisruptionBudget:
  enabled: true
  minAvailable: 2

# P4: hard spread across regions.
topologySpreadConstraint:
  enabled: true
  maxSkew: 1
