# Zentrale, deployment-weite Werte - werden NICHT hier gepflegt, sondern in
# gitops/env/cluster.yaml (ArgoCD reicht die Datei jedem Chart per Multi-Source "$values"
# durch, siehe gitops/applicationset.yaml). Der leere Default steht hier nur, damit ein
# Rendern ohne diese Datei eine verstaendliche Fehlermeldung statt eines Nil-Pointers liefert.
# Lokal deshalb immer:
#   helm template <name> charts/<name> -f charts/<name>/values.yaml -f gitops/env/cluster.yaml
ticketflow: {}

# Registry und Tag kommen zentral aus gitops/env/cluster.yaml (ticketflow.imageRegistry /
# .imageTag) - ein Image-Bump beruehrt damit genau eine Stelle im Repo und gilt fuer alle vier
# Services gleichzeitig; .github/workflows/build-images.yml schreibt den Tag dort automatisch
# fort. Die beiden Felder hier sind nur ein bewusster Einzelfall-Override (z.B. ein Test-Build
# aus einer anderen Registry) und bleiben normalerweise leer. Nie :latest (P3) - das verbietet
# auch values.schema.json.
image:
  repository: ""
  tag: ""
  pullPolicy: IfNotPresent

# Mehrere Consumer-Instanzen derselben CONSUMER_GROUP teilen sich die Partitionen von
# config.resultTopic automatisch (Kafka-Consumer-Group-Rebalancing) - die Partitionsanzahl des
# Topics sollte >= replicaCount sein, sonst bleiben ueberzaehlige Replicas ungenutzt. Das Topic
# selbst entsteht erst mit Strimzi/charts/kafka-cluster, ausserhalb des Scopes dieses Charts.
replicaCount: 3

resources:
  requests:
    cpu: 25m
    memory: 32Mi
  limits:
    cpu: 100m
    memory: 64Mi

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

config:
  # Echter Wert: Strimzi-Bootstrap-Service aus charts/kafka-cluster, gleicher Namespace
  # "ticketflow" (dieser Chart ist noch nicht via gitops/apps/*.yaml deployed, siehe
  # CLAUDE.md ## Current implementation status - Wert trotzdem schon real, nicht Platzhalter,
  # damit er sofort zum kafkaSasl-Setup unten passt). Port 9092 = Strimzi's "plain"-Listener -
  # seit B2 SASL_PLAINTEXT (SCRAM-Auth), Transport bleibt unverschluesselt.
  kafkaBrokers: "ticketflow-kafka-kafka-bootstrap.ticketflow.svc:9092"
  # Muss zum echten Topic-Namen aus charts/kafka-cluster/values.yaml kafka.topics passen (war
  # zuvor "reservation-results", ein Platzhalter-Tippfehler - siehe src/*/README.md ## Konfiguration).
  resultTopic: "reservation-result"
  consumerGroup: "notification-worker"
  # Leer = kein Dead-Letter-Publish. Das "Offset nur bei tatsaechlichem Versand committen"-
  # Verhalten bleibt trotzdem bestehen, siehe internal/kafkaconsumer im Anwendungscode.
  dltTopic: ""
  notifyMaxRetries: 3
  notifyRetryBackoff: "2s"
  # Apicurio Registry (charts/apicurio), siehe charts/kafka-cluster/values.yaml schemaRegistry.* fuer
  # denselben Wert - kein Secret, keine Zugangsdaten involviert (siehe charts/apicurio/Chart.yaml).
  registryUrl: "http://apicurio.kafka.svc:8080/apis/registry/v3"
  registryGroupId: "ticketflow"
  logLevel: "info"
  httpAddr: ":8080"

  kafkaTls:
    enabled: false # optionales mTLS zum Kafka-Broker; Zertifikate kommen aus secret.kafkaTls*

  # B2 (Root-README ## Entscheidungen): SASL/SCRAM-SHA-512-Auth gegen die vom Strimzi User
  # Operator verwaltete KafkaUser "notification-worker" (siehe charts/kafka-cluster values.yaml
  # kafka.users) - unabhaengig vom optionalen mTLS oben (unser Listener ist SASL_PLAINTEXT, nicht
  # SASL_SSL). secretName referenziert das vom User Operator AUTOMATISCH angelegte Secret (Keys
  # "password"/"sasl.jaas.config") direkt per secretKeyRef - kein eigenes Secret noetig wie bei
  # Postgres, weil dieser Chart und der Kafka-Cluster denselben Namespace "ticketflow" teilen.
  kafkaSasl:
    enabled: true
    username: notification-worker
    secretName: notification-worker

  smtp:
    enabled: false # Demo-sicherer Default: nur Log-Ausgabe, kein echter Mailversand
    host: ""
    port: 587
    from: ""
    tlsMode: "starttls" # none|starttls|tls

secret:
  create: true # false = ein extern (z.B. External Secret) bereitgestelltes Secret gleichen Namens wird erwartet
  # Platzhalter-Struktur; echte Werte via --set/--set-file/External Secret zur Deploy-Zeit, nie im
  # Repo committen (gleiches Muster wie charts/kafka-cluster/README.md config/secret.yaml).
  smtpUsername: ""
  smtpPassword: ""
  kafkaTlsCaCert: ""
  kafkaTlsClientCert: ""
  kafkaTlsClientKey: ""

# PodMonitor statt ServiceMonitor: es gibt keinen anderen Konsumenten der HTTP-Endpunkte (siehe
# templates/podmonitor.yaml), daher auch keine eigene Service-Ressource in diesem Chart.
podMonitor:
  enabled: true
  interval: 30s
  # Annahme, nicht live verifiziert: charts/kube-prometheus-stack/values.yaml hat keinen
  # expliziten podMonitorSelector-Override, das deutet auf den Chart-Default
  # "release: <helm-release-name>" hin (symmetrisch zum serviceMonitorSelector-Default). Falls
  # falsch: nur dieses Label anpassen, keine Code-/Template-Aenderung noetig.
  labels:
    release: kube-prometheus-stack

networkPolicy:
  enabled: false # Default aus, wie im Repo sonst ueblich (siehe charts/README.md)

podDisruptionBudget:
  enabled: true
  minAvailable: 2 # toleriert einen Node-Drain/Rollout-Schritt bei replicaCount: 3

# Weiche Verteilung ueber die drei simulierten Regionen (P4) - der Consumer ist stateless, ein
# Regionsausfall soll nicht alle Replicas gleichzeitig treffen. Gleiches Muster/gleiche Keys wie
# charts/reservation-worker und charts/ticketflow-app.
topologySpreadConstraint:
  enabled: true
  maxSkew: 1
