# k3s installiert Traefik selbst ueber seinen eigenen helm-controller (HelmChart-CR
# "traefik" im Namespace kube-system, aus dem k3s-Release gebuendelt) - eine HelmChartConfig
# mit demselben Namen/Namespace ist der offiziell dokumentierte Weg, zusaetzliche Werte
# hineinzumergen, OHNE mit k3s' eigener Verwaltung dieses HelmChart zu konkurrieren (ArgoCD
# besitzt/verwaltet nur dieses HelmChartConfig-Objekt, nicht das HelmChart/den Helm-Release
# selbst - kein Ownership-Konflikt). service.annotations ist eine reine Metadata-Aenderung am
# bereits bestehenden Traefik-Service, kein Neuanlegen (VIPs bleiben stabil).
apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: traefik
  namespace: kube-system
spec:
  valuesContent: |-
    resources:
      {{- toYaml .Values.resources | nindent 6 }}
    deployment:
      replicas: {{ .Values.replicas }}
    podDisruptionBudget:
      enabled: true
      minAvailable: 1
    # Harte Verteilung auf zwei simulierte Regionen (P4), siehe values.yaml. Die Control-Plane hat
    # kein Regions-Label und faellt damit heraus, obwohl k3s' Traefik ihren Taint toleriert.
    topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: topology.ticketflow/region
        whenUnsatisfiable: DoNotSchedule
        matchLabelKeys:
          - pod-template-hash
        labelSelector:
          matchLabels:
            app.kubernetes.io/name: traefik
            app.kubernetes.io/instance: traefik-kube-system
    service:
      annotations:
        external-dns.alpha.kubernetes.io/hostname: {{ .Values.traefikHostname | default (printf "traefik.%s" (required "ticketflow.dnsZone fehlt - gitops/env/cluster.yaml mitgeben (-f gitops/env/cluster.yaml)" .Values.ticketflow.dnsZone)) }}
