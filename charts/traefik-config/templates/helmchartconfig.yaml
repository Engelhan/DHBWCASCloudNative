# Merges values into k3s' bundled Traefik HelmChart (the documented way; ArgoCD owns only this
# object).
apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: traefik
  namespace: kube-system
spec:
  valuesContent: |-
    resources:
      {{- toYaml .Values.resources | nindent 6 }}
    deployment:
      replicas: {{ .Values.replicas }}
    podDisruptionBudget:
      enabled: true
      minAvailable: 1
    # P4: hard spread; the control plane has no region label.
    topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: topology.ticketflow/region
        whenUnsatisfiable: DoNotSchedule
        matchLabelKeys:
          - pod-template-hash
        labelSelector:
          matchLabels:
            app.kubernetes.io/name: traefik
            app.kubernetes.io/instance: traefik-kube-system
    service:
      annotations:
        external-dns.alpha.kubernetes.io/hostname: {{ .Values.traefikHostname | default (printf "traefik.%s" (required "ticketflow.dnsZone is missing - pass gitops/env/cluster.yaml (-f gitops/env/cluster.yaml)" .Values.ticketflow.dnsZone)) }}
