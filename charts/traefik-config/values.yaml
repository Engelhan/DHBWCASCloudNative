# Set via gitops/env/cluster.yaml; empty default only for a readable error.
ticketflow: {}

# Traefik's own DNS name, the CNAME target for IngressRoutes. Empty = traefik.<dnsZone>.
traefikHostname: ""

# Traefik is on the flash-sale path: high CPU limit so throttling doesn't set the latency.
resources:
  requests:
    cpu: 100m
    memory: 64Mi
  limits:
    cpu: "1"
    memory: 256Mi

# P4: two pods in two regions; one pod would make a worker outage an outage of all hosts.
replicas: 2
