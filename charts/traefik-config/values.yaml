# Zentrale, deployment-weite Werte - werden NICHT hier gepflegt, sondern in
# gitops/env/cluster.yaml (ArgoCD reicht die Datei jedem Chart per Multi-Source "$values"
# durch, siehe gitops/applicationset.yaml). Der leere Default steht hier nur, damit ein
# Rendern ohne diese Datei eine verstaendliche Fehlermeldung statt eines Nil-Pointers liefert.
# Lokal deshalb immer:
#   helm template <name> charts/<name> -f charts/<name>/values.yaml -f gitops/env/cluster.yaml
ticketflow: {}

# Hostname, unter dem Traefiks LoadBalancer-Service selbst per external-dns veroeffentlicht
# wird - dient als stabiles CNAME-Ziel fuer alles, was per IngressRoute/IngressRouteTCP/-UDP
# routet (external-dns' traefik-proxy-Source kann Targets NICHT selbst aus dem
# Service-Status ableiten, siehe charts/argocd-ingress/values.yaml).
#
# Leer lassen: leitet sich per Default als "traefik.<ticketflow.dnsZone>" aus der zentralen
# Konfiguration ab (gitops/env/cluster.yaml) und liegt damit automatisch innerhalb der
# aktivierten RFC2136-Zone.
traefikHostname: ""
