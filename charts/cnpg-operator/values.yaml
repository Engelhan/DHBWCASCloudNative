# Chart-Defaults bewusst weitgehend uebernommen (kein Tuning noetig, solange
# charts/ticketflow/templates/database/cnpg-cluster.yaml - die eigentliche Cluster-CR mit
# Instanzanzahl/Topology-Spread ueber die simulierten Regionen (P4) - noch nicht existiert):
# crds.create ist bereits Default true, der Operator ist bereits Default cluster-wide (nicht
# auf einen Namespace beschraenkt). Muss unter dem Dependency-Alias "cloudnative-pg"
# verschachtelt sein (siehe Chart.yaml), damit Helm die Werte an das gewrappte Upstream-Chart
# durchreicht.
cloudnative-pg:
  # kube-prometheus-stack ist inzwischen deployt (siehe gitops/apps/kube-prometheus-stack.yaml)
  # - PodMonitor-CRD existiert also.
  monitoring:
    podMonitorEnabled: true

  # podSecurityContext/containerSecurityContext sind bereits Chart-Default gehaertet
  # (runAsNonRoot, readOnlyRootFilesystem, capabilities drop ALL, seccompProfile
  # RuntimeDefault) - kein Override noetig. Kein natives networkPolicy-Feld im Chart
  # vorhanden.
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi
