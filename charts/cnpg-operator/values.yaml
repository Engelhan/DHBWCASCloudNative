# Chart-Defaults bewusst weitgehend uebernommen (kein Tuning noetig, solange
# charts/kafka-cluster/templates/database/cnpg-cluster.yaml - die eigentliche Cluster-CR mit
# Instanzanzahl/Topology-Spread ueber die simulierten Regionen (P4) - noch nicht existiert):
# crds.create ist bereits Default true, der Operator ist bereits Default cluster-wide (nicht
# auf einen Namespace beschraenkt). Muss unter dem Dependency-Alias "cloudnative-pg"
# verschachtelt sein (siehe Chart.yaml), damit Helm die Werte an das gewrappte Upstream-Chart
# durchreicht.
cloudnative-pg:
  # P4 - zwei Replicas je Komponente, hart auf zwei verschiedene simulierte Regionen verteilt
  # (DoNotSchedule + maxSkew 1; matchLabelKeys, damit beim Rollout nur Pods derselben Revision
  # zaehlen). labelSelector = die vom Upstream-Chart tatsaechlich gerenderten Pod-Labels, von Hand
  # eingetragen, weil Helm values.yaml nicht templatet - gegen `helm template` geprueft.
  # Der Operator laeuft mit --leader-elect (fest im Upstream-Template), der eingebaute Webhook-
  # Server antwortet auf beiden Pods.
  replicaCount: 2
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: topology.ticketflow/region
      whenUnsatisfiable: DoNotSchedule
      matchLabelKeys:
        - pod-template-hash
      labelSelector:
        matchLabels:
          app.kubernetes.io/name: cloudnative-pg
          app.kubernetes.io/instance: cnpg-operator
  # Aus: kube-prometheus-stack ist entfernt, die PodMonitor-CRD existiert nicht mehr.
  monitoring:
    podMonitorEnabled: false

  # podSecurityContext/containerSecurityContext sind bereits Chart-Default gehaertet
  # (runAsNonRoot, readOnlyRootFilesystem, capabilities drop ALL, seccompProfile
  # RuntimeDefault) - kein Override noetig. Kein natives networkPolicy-Feld im Chart
  # vorhanden.
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi
