# Upstream values (dependency alias). CRDs and cluster-wide mode are defaults.
cloudnative-pg:
  # P4: two replicas, hard-spread across regions. Runs with --leader-elect; webhooks on both pods.
  replicaCount: 2
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: topology.ticketflow/region
      whenUnsatisfiable: DoNotSchedule
      matchLabelKeys:
        - pod-template-hash
      labelSelector:
        matchLabels:
          app.kubernetes.io/name: cloudnative-pg
          app.kubernetes.io/instance: cnpg-operator
  # No Prometheus in the cluster.
  monitoring:
    podMonitorEnabled: false

  # Security contexts are hardened by default.
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi
