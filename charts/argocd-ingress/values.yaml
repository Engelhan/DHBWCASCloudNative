# Aendern, falls ein anderer Hostname gewuenscht ist - muss innerhalb der aktivierten
# RFC2136-Zone liegen (siehe charts/cert-manager-config/values.yaml rfc2136.zone), sonst kann
# weder cert-manager (dns01) noch external-dns dafuer einen Record/Zertifikat ausstellen.
hostname: "argocd.cas438007-at-cas-dhbw-de.users.dhbw.site"

clusterIssuerName: certificate-cluster-issuer
tlsSecretName: argocd-server-tls

argocdServer:
  namespace: argocd
  serviceName: argocd-server
  servicePort: 443

# Traefik-Entrypoint fuer TLS - k3s' gebuendeltes Traefik-Chart definiert "websecure" (Port 443)
# standardmaessig, siehe traefik-Service in kube-system.
traefikEntryPoint: websecure

# external-dns' traefik-proxy-Source generiert fuer IngressRoute/IngressRouteTCP/-UDP NIE
# automatisch ein Target aus dem Traefik-Service-Status (anders als bei normalen Ingress-
# Objekten) - Targets kommen laut externaldns/source/traefik_proxy.go ausschliesslich aus der
# Annotation external-dns.alpha.kubernetes.io/target. Ohne sie: "No endpoints could be
# generated", kein DNS-Record. Deshalb hier die aktuellen externen VIPs des
# Traefik-LoadBalancer-Service (kube-system/traefik) - nur die IPv6-Adressen, die IPv4-VIPs
# sind ohnehin ueber external-dns' --exclude-target-net=10.0.0.0/8 gefiltert (siehe
# gitops/apps/external-dns.yaml). MUSS manuell nachgezogen werden, falls sich die VIPs aendern
# (z.B. nach einem Cluster-Rebuild) - `kubectl -n kube-system get svc traefik
# -o jsonpath='{.status.loadBalancer.ingress[*].ip}'`.
externalDnsTargets:
  - "2001:7c0:1b20:c913:1::237"
  - "2001:7c0:1b20:c913:1::24c"
  - "2001:7c0:1b20:c913:1::2b1"
  - "2001:7c0:1b20:c913:1::435"
  - "2001:7c0:1b20:c913:1::495"
  - "2001:7c0:1b20:c913:1::4b3"
