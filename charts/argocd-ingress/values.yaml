# Set via gitops/env/cluster.yaml; empty default only for a readable error.
ticketflow: {}

# Empty = argocd.<dnsZone>.
hostname: ""

clusterIssuerName: certificate-cluster-issuer
tlsSecretName: argocd-server-tls

argocdServer:
  namespace: argocd
  serviceName: argocd-server
  servicePort: 443

traefikEntryPoint: websecure

# external-dns can't derive targets for IngressRouteTCP; point at Traefik's own hostname
# (empty = traefik.<dnsZone>), which follows VIP changes.
externalDnsTarget: ""
