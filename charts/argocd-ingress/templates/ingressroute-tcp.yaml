# TLS passthrough: argocd-server terminates TLS itself (avoids gRPC/HTTP2 issues).
apiVersion: traefik.io/v1alpha1
kind: IngressRouteTCP
metadata:
  name: argocd-server
  namespace: {{ .Values.argocdServer.namespace }}
  annotations:
    # external-dns' traefik-proxy source needs an explicit target.
    external-dns.alpha.kubernetes.io/target: {{ include "argocd-ingress.externalDnsTarget" . | quote }}
spec:
  entryPoints:
    - {{ .Values.traefikEntryPoint }}
  routes:
    - match: "HostSNI(`{{ include "argocd-ingress.hostname" . }}`)"
      services:
        - name: {{ .Values.argocdServer.serviceName }}
          port: {{ .Values.argocdServer.servicePort }}
  tls:
    passthrough: true
