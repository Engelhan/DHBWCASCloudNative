# Topics come from values.yaml (Kafka can't reduce partitions).
# min.insync.replicas 2 with RF 3 tolerates one broker down with acks=all.

kafka:
  controller:
    replicas: 3
    storage:
      size: 5Gi
  broker:
    replicas: 3
    storage:
      size: 10Gi
  config:
    offsetsTopicReplicationFactor: 3
    transactionStateLogReplicationFactor: 3
    transactionStateLogMinIsr: 2
    defaultReplicationFactor: 3
    minInsyncReplicas: 2
