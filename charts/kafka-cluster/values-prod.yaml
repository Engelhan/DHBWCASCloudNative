# HA-Werte - siehe README ## values-dev.yaml vs. values-prod.yaml. 3 Controller + 3 Broker,
# verteilt ueber die drei simulierten Regionen (P4), Topic-replicationFactor darauf abgestimmt.
#
# Topics (inkl. Partitionszahl 20) kommen bewusst aus values.yaml, nicht aus einem eigenen Block
# hier: eine kleinere Zahl in prod liesse sich auf einem bestehenden Cluster gar nicht anwenden
# (Kafka reduziert Partitionen nie), und KEDAs maxReplicaCount in charts/reservation-worker ist in
# beiden Profilen gleich.
#
# min.insync.replicas: 2 (Topic- und Cluster-Ebene) bei replicationFactor 3: toleriert den
# Ausfall eines Brokers, ohne dass Produce-Requests mit acks=all fehlschlagen (P5-Begruendung:
# Ticket-Reservierungen sind Geschaeftsdaten).

kafka:
  controller:
    replicas: 3
    storage:
      size: 5Gi
  broker:
    replicas: 3
    storage:
      size: 10Gi
  config:
    offsetsTopicReplicationFactor: 3
    transactionStateLogReplicationFactor: 3
    transactionStateLogMinIsr: 2
    defaultReplicationFactor: 3
    minInsyncReplicas: 2
