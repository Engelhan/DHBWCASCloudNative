# Gemeinsame Basiswerte fuer alle Umgebungen. dev/prod-spezifische Overrides in
# values-dev.yaml/values-prod.yaml (siehe README ## values-dev.yaml vs. values-prod.yaml).
#
# Kafka-/Messaging-Teil + Schema-Registry-Registrierung (P1 fuer Carlos' Scope). catalog-api/
# frontend, reservation-worker, notification-worker, CNPG-Postgres sind bewusst NICHT hier drin
# - eigene, volleigenstaendige Charts (charts/ticketflow-app, charts/reservation-worker,
# charts/notification-worker, charts/postgres-cluster), siehe charts/README.md.
#
# Struktur (getrennte broker-/controller-NodePools statt Combined-Role, metricsConfig,
# kafkaExporter, entityOperator-Resources) orientiert sich an einem realen Strimzi-Setup, das der
# Nutzer als Referenz aus seinem Arbeitsumfeld bereitgestellt hat - siehe die Kommentare in den
# jeweiligen Templates fuer die Stellen, an denen bewusst abgewichen wurde (z.B. kein externer
# Listener/keine Auth, da wir noch keine Client-Identitaeten haben; kein message.max.bytes-Override,
# da unsere JSON-Events klein sind).

# Namespace fuer alle Ressourcen dieses Charts - getrennt vom Strimzi-Operator-Namespace "kafka"
# (siehe charts/strimzi-operator), analog zu cnpg-operator (Namespace cnpg-system) vs. dieser
# App-Namespace. Wird von gitops/apps/kafka-cluster.yaml als destination.namespace gesetzt
# (CreateNamespace=true).
namespace: ticketflow

kafka:
  metadata:
    name: ticketflow-kafka
    namespace: ticketflow

  # Kafka-Version, die der gepinnte Strimzi-Operator (charts/strimzi-operator, Chart-Version
  # 1.1.0, existiert real nicht) unterstuetzt - live gegen den Kafka.status-Fehler geprueft
  # (Operator meldete beim ersten Sync-Versuch "Unsupported Kafka.spec.kafka.version: 4.0.0.
  # Supported versions are: [4.2.0, 4.2.1, 4.3.0]"), 4.3.0 gewaehlt als neueste unterstuetzte.
  # Kein metadataVersion gesetzt - siehe Kommentar in templates/messaging/kafka-cluster.yaml.
  version: "4.3.0"

  # Getrennte Pools statt Combined-Role (anders als unser erster Entwurf) - orientiert an der
  # realen Referenz. Braucht mehr Pods als Combined-Role, aber ist die im Referenz-Setup
  # tatsaechlich genutzte Aufteilung.
  controller:
    replicas: 1
    storage:
      type: persistent-claim
      size: 2Gi
    resources:
      requests:
        memory: 512Mi
      limits:
        memory: 512Mi

  broker:
    replicas: 1
    storage:
      type: persistent-claim
      size: 5Gi
    resources:
      requests:
        memory: 512Mi
      limits:
        memory: 1Gi

  # Von values-dev.yaml/values-prod.yaml passend zur jeweiligen Replica-Zahl ueberschrieben -
  # bei replicas: 1 muss der Replication-Factor ebenfalls 1 sein, sonst bleiben interne Topics
  # dauerhaft under-replicated.
  config:
    offsetsTopicReplicationFactor: 1
    transactionStateLogReplicationFactor: 1
    transactionStateLogMinIsr: 1
    defaultReplicationFactor: 1
    minInsyncReplicas: 1

  entityOperator:
    topicOperator:
      resource:
        memoryLimit: 256Mi
    userOperator:
      resource:
        memoryLimit: 256Mi

  # RESERVATION_TOPIC (catalog-api -> reservation-worker) und RESULT_TOPIC
  # (reservation-worker -> notification-worker), siehe src/*/README.md ## Konfiguration.
  # replicationFactor darf weder controller.replicas noch broker.replicas uebersteigen.
  topics:
    - name: reservation-requested
      partitions: 3
      replicationFactor: 1
      config:
        retention.ms: "604800000"
        cleanup.policy: delete
    - name: reservation-result
      partitions: 3
      replicationFactor: 1
      config:
        retention.ms: "604800000"
        cleanup.policy: delete

  # B2 (Root-README ## Entscheidungen): eine KafkaUser-CR (SCRAM-SHA-512 + engst moegliche ACLs)
  # pro Client-Identitaet statt eines einzigen geteilten Credentials - siehe
  # templates/messaging/kafka-users.yaml. name = KafkaUser-CR-Name = SASL-Username = Name des vom
  # Strimzi User Operator angelegten Secrets (Keys "password"/"sasl.jaas.config"), das
  # verbrauchende Charts direkt per secretKeyRef referenzieren (funktioniert nur, weil
  # catalog-api/reservation-worker/notification-worker denselben Namespace "ticketflow" wie
  # dieser Kafka-Cluster teilen - siehe charts/README.md). operations sind Kafka-ACL-Operationen
  # (Read/Write/Describe/... - siehe `kubectl explain kafkauser.spec.authorization.acls.operations`);
  # DESCRIBE ist bei WRITE/READ auf demselben Topic automatisch mit-erlaubt (Kafka-eigenes
  # implizites Grant), daher hier nicht redundant aufgefuehrt.
  users:
    # catalog-api: darf ReservationRequested nur schreiben, nie lesen (siehe Root-README ## B2).
    - name: catalog-api
      acls:
        - resource: { type: topic, name: reservation-requested, patternType: literal }
          operations: [Write]
    # reservation-worker: konsumiert ReservationRequested (eigene Consumer-Group "reservation-worker",
    # muss zum Config-Wert config.consumerGroup in charts/reservation-worker/values.yaml passen)
    # und publiziert das Ergebnis auf ReservationResult.
    - name: reservation-worker
      acls:
        - resource: { type: topic, name: reservation-requested, patternType: literal }
          operations: [Read]
        - resource: { type: group, name: reservation-worker, patternType: literal }
          operations: [Read]
        - resource: { type: topic, name: reservation-result, patternType: literal }
          operations: [Write]
    # notification-worker: zweite, unabhaengige Consumer-Group auf demselben ReservationResult-Topic
    # (Kafka als Bus mit Fan-out, siehe CLAUDE.md ## Domain model) - muss zu
    # charts/notification-worker/values.yaml config.consumerGroup passen.
    - name: notification-worker
      acls:
        - resource: { type: topic, name: reservation-result, patternType: literal }
          operations: [Read]
        - resource: { type: group, name: notification-worker, patternType: literal }
          operations: [Read]
    # akhq: schreibgeschuetzte Kafka-Ops-UI (siehe Root-README ## B2 "AKHQ schreibgeschuetzt
    # konfiguriert") - braucht Sicht auf ALLE Topics/Consumer-Groups (nicht nur die beiden oben),
    # deshalb Resource-Name "*" (Kafkas eingebauter ACL-Wildcard fuer "jede Resource dieses Typs",
    # kein Praefix-Pattern). Passwort wird NICHT vom User Operator generiert, sondern explizit aus
    # akhqUser.passwordSecretName vorgegeben (siehe kafka-akhq-user-secret.yaml) - AKHQ laeuft im
    # Namespace "kafka", nicht "ticketflow", ein generiertes Secret koennte AKHQs Deployment per
    # secretKeyRef also nicht direkt (Namespace-Grenze) erreichen. Passwort siehe akhqUser unten,
    # muss mit charts/akhq/values.yaml kafkaSasl.password uebereinstimmen.
    - name: akhq
      passwordSecretName: akhq-kafka-user-password
      acls:
        - resource: { type: topic, name: "*", patternType: literal }
          operations: [Describe, DescribeConfigs, Read]
        - resource: { type: group, name: "*", patternType: literal }
          operations: [Describe, Read]
        - resource: { type: cluster }
          operations: [Describe]
    # apicurio: kafkasql-Storage-Backend der Schema-Registry (siehe charts/apicurio) - legt beim
    # ersten Start selbst seine beiden internen Journal-/Snapshot-Topics an (kein
    # auto.create.topics.enable, siehe kafka.config oben), braucht dafuer zusaetzlich zu
    # Read/Write/Describe auch Create auf genau diesen beiden Topic-Namen (Apicurio-3.x-Doku
    # bestaetigt "kafkasql-journal"/"kafkasql-snapshots" als Default-Namen). Die interne
    # Consumer-Group-ID ist pro Pod-Neustart zufaellig ("apicurio-<uuid>", live im Pod-Log
    # beobachtet, siehe die "TimeoutException: Timed out waiting for a node assignment"-
    # Crashloop, die vor dieser SASL/ACL-Ergaenzung auftrat) - deshalb hier "prefixed" statt
    # "literal" auf die Gruppe. Passwort wie bei akhq explizit vorgegeben statt vom User Operator
    # generiert, da Apicurio ebenfalls im Namespace "kafka" laeuft, nicht "ticketflow"
    # (Cross-Namespace-Grenze, siehe akhqUser-Kommentar oben). Muss mit
    # charts/apicurio/values.yaml kafkaSasl.password uebereinstimmen. UNVERIFIZIERT: welche
    # genauen ACL-Operationen Apicurios AdminClient beim Topic-Anlegen wirklich braucht war zum
    # Zeitpunkt dieser Aenderung nicht mehr live nachtestbar (siehe CLAUDE.md) - falls die
    # kafkasql-Storage nach diesem Fix weiterhin nicht startet, zuerst den Pod-Log auf eine
    # "TopicAuthorizationException"/"GroupAuthorizationException" pruefen und die ACL dort gezielt
    # erweitern (z.B. Create/Describe auf `{ type: cluster }`, falls das AdminClient-Verhalten
    # doch einen clusterweiten statt topic-scoped Create-Grant braucht).
    - name: apicurio
      passwordSecretName: apicurio-kafka-user-password
      acls:
        - resource: { type: topic, name: kafkasql-journal, patternType: literal }
          operations: [Create, Write, Read, Describe]
        - resource: { type: topic, name: kafkasql-snapshots, patternType: literal }
          operations: [Create, Write, Read, Describe]
        - resource: { type: group, name: "apicurio-", patternType: prefixed }
          operations: [Read, Describe]

  akhqUser:
    passwordSecretName: akhq-kafka-user-password
    # Lab-Zugangsdaten (2026-09-16, auf expliziten Wunsch direkt hier hinterlegt statt CHANGE_ME/
    # --set, da fuer diesen Kurs kein produktionsartiges Geheimnis) - dasselbe Passwort wie
    # charts/akhq/values.yaml secrets.akhq.security.basic-auth (dort schon so gehandhabt), aus
    # Gruenden der einfachen Handhabung. Muss mit charts/akhq/values.yaml kafkaSasl.password
    # uebereinstimmen.
    password: "ticketflow"

  apicurioUser:
    passwordSecretName: apicurio-kafka-user-password
    # Lab-Zugangsdaten, gleiche Begruendung/Muster wie akhqUser oben. Muss mit
    # charts/apicurio/values.yaml kafkaSasl.password uebereinstimmen.
    password: "ticketflow"

# Apicurio Registry (charts/apicurio, Namespace "kafka"), siehe templates/schema-registry/ und
# charts/README.md ## apicurio. URL ist die vom Apicurio-Chart selbst gerenderte Service-DNS
# (Release-Name "apicurio", siehe gitops/apps/apicurio.yaml metadata.name) - noch nicht live
# gegen einen echten Sync geprueft (kein Cluster verfuegbar).
schemaRegistry:
  url: http://apicurio.kafka.svc:8080/apis/registry/v3
  groupId: ticketflow
