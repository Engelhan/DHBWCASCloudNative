# Kafka, topics, users and schema registration. App charts and Postgres are separate charts.

# Set via gitops/env/cluster.yaml; empty default only for a readable error.
ticketflow: {}

kafka:

  # Newest version supported by the pinned Strimzi operator.
  version: "4.3.0"

  # Separate broker/controller pools, 3 each (one per region, P4/P5):
  # - brokers: RF 3 + min.insync 2 survive one region down
  # - controllers: smallest quorum that survives one loss
  # Memory request == limit (stateful, never overcommit); CPU limit > request for bursts.
  # Total Kafka requests: 3 x 1Gi + 3 x 512Mi = 4.5Gi.
  controller:
    replicas: 3
    storage:
      type: persistent-claim
      # Metadata log only (KBs).
      size: 2Gi
    # Tiny metadata state; rest of 512Mi for metaspace, JMX agent, buffers.
    jvmOptions:
      heap: 256m
    resources:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        cpu: 500m
        memory: 512Mi

  broker:
    replicas: 3
    storage:
      type: persistent-claim
      # ~300-byte events: 1M events x 2 topics = ~600MB at 7 days retention.
      size: 5Gi
    # Half the limit: Kafka uses the page cache, not the heap. Rest: ~300Mi off-heap + page cache.
    jvmOptions:
      heap: 512m
    resources:
      requests:
        # Baseline: replicating ~40 partition replicas per broker.
        cpu: 200m
        memory: 1Gi
      limits:
        cpu: "1"
        memory: 1Gi

  # Must match the broker count. Only applies to internal topics at creation.
  config:
    offsetsTopicReplicationFactor: 3
    transactionStateLogReplicationFactor: 3
    transactionStateLogMinIsr: 2
    defaultReplicationFactor: 3
    minInsyncReplicas: 2

  # Topic/User operator JVMs, measured ~230Mi each at idle.
  entityOperator:
    topicOperator:
      resources:
        requests:
          cpu: 25m
          memory: 384Mi
        limits:
          cpu: 250m
          memory: 384Mi
    userOperator:
      resources:
        requests:
          cpu: 25m
          memory: 384Mi
        limits:
          cpu: 250m
          memory: 384Mi

  # Go binary, ~9Mi.
  kafkaExporter:
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        cpu: 100m
        memory: 64Mi

  # replicationFactor <= broker count.
  # 20 partitions = max parallel consumers (KEDA max 10 pods -> 2 each). Kafka can't reduce
  # partitions, and increasing them remaps keys.
  topics:
    - name: reservation-requested
      partitions: 20
      replicationFactor: 3
      config:
        retention.ms: "604800000"
        cleanup.policy: delete
        min.insync.replicas: "2"
    - name: reservation-result
      partitions: 20
      replicationFactor: 3
      config:
        retention.ms: "604800000"
        cleanup.policy: delete
        min.insync.replicas: "2"

  # B2: one KafkaUser per client; name = SASL user = Strimzi secret name. READ/WRITE imply DESCRIBE.
  users:
    # Write only.
    - name: catalog-api
      acls:
        - resource: { type: topic, name: reservation-requested, patternType: literal }
          operations: [Write]
    # Group must match config.consumerGroup in charts/reservation-worker.
    - name: reservation-worker
      acls:
        - resource: { type: topic, name: reservation-requested, patternType: literal }
          operations: [Read]
        - resource: { type: group, name: reservation-worker, patternType: literal }
          operations: [Read]
        - resource: { type: topic, name: reservation-result, patternType: literal }
          operations: [Write]
    # Second, independent group (fan-out); must match charts/notification-worker.
    - name: notification-worker
      acls:
        - resource: { type: topic, name: reservation-result, patternType: literal }
          operations: [Read]
        - resource: { type: group, name: notification-worker, patternType: literal }
          operations: [Read]
    # Read-only UI over all topics/groups ("*" wildcard). Password reaches AKHQ via OpenBao.
    - name: akhq
      acls:
        - resource: { type: topic, name: "*", patternType: literal }
          operations: [Describe, DescribeConfigs, Read]
        - resource: { type: group, name: "*", patternType: literal }
          operations: [Describe, Read]
        - resource: { type: cluster }
          operations: [Describe]
    # No apicurio user: it uses the anonymous listener (no SASL support).


# Apicurio registry (charts/apicurio).
schemaRegistry:
  # Empty = http://apicurio.<kafka ns>.svc:8080/apis/registry/v3
  url: ""
  groupId: ticketflow
  # Registration job image (alpine + curl/jq).
  job:
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        cpu: 100m
        memory: 64Mi
