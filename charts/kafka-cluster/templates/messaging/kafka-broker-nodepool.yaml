# Broker pool (separate from the controller pool).
apiVersion: kafka.strimzi.io/v1
kind: KafkaNodePool
metadata:
  name: broker
  labels:
    strimzi.io/cluster: {{ include "kafka-cluster.clusterName" . }}
spec:
  replicas: {{ .Values.kafka.broker.replicas }}

  roles:
    - broker

  storage:
    type: jbod
    volumes:
      - id: 0
        type: {{ .Values.kafka.broker.storage.type }}
        size: {{ .Values.kafka.broker.storage.size }}
        deleteClaim: false

  # Sizing rationale in values.yaml.
  resources:
    {{- toYaml .Values.kafka.broker.resources | nindent 4 }}

  # Explicit heap so the memory budget in values.yaml is what actually runs.
  jvmOptions:
    -Xms: {{ .Values.kafka.broker.jvmOptions.heap | quote }}
    -Xmx: {{ .Values.kafka.broker.jvmOptions.heap | quote }}

  template:
    pod:
      affinity:
        podAntiAffinity:
          # Soft: prefer different nodes.
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: strimzi.io/name
                      operator: In
                      values:
                        - {{ include "kafka-cluster.clusterName" . }}-kafka
                topologyKey: kubernetes.io/hostname
      {{- if gt (int .Values.kafka.broker.replicas) 1 }}
      # P4: hard spread, one broker per region. Two replicas in one region would break
      # min.insync.replicas=2 on that region's loss; a Pending broker is better than a silent
      # overlap.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.ticketflow/region
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              strimzi.io/cluster: {{ include "kafka-cluster.clusterName" . }}
              strimzi.io/pool-name: broker
      {{- end }}
