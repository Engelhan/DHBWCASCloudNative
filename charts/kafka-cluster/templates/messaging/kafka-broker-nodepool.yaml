# Broker-Pool, getrennt vom Controller-Pool (kafka-controller-nodepool.yaml) - anders als unser
# erster Entwurf (Combined-Role), orientiert an einer realen Strimzi-Referenz aus dem
# Arbeitsumfeld des Nutzers.
apiVersion: kafka.strimzi.io/v1
kind: KafkaNodePool
metadata:
  name: broker
  labels:
    strimzi.io/cluster: {{ include "kafka-cluster.clusterName" . }}
spec:
  replicas: {{ .Values.kafka.broker.replicas }}

  roles:
    - broker

  storage:
    type: jbod
    volumes:
      - id: 0
        type: {{ .Values.kafka.broker.storage.type }}
        size: {{ .Values.kafka.broker.storage.size }}
        deleteClaim: false

  # Zahlen + Herleitung in values.yaml (kafka.broker.resources/.jvmOptions).
  resources:
    {{- toYaml .Values.kafka.broker.resources | nindent 4 }}

  # Heap explizit statt von Strimzi aus dem Limit abgeleitet - nur so ist die Rechnung
  # "Heap + Off-Heap + Page-Cache <= Limit" in values.yaml tatsaechlich die, die laeuft.
  jvmOptions:
    -Xms: {{ .Values.kafka.broker.jvmOptions.heap | quote }}
    -Xmx: {{ .Values.kafka.broker.jvmOptions.heap | quote }}

  template:
    pod:
      affinity:
        podAntiAffinity:
          # Weich: verteilt Broker-Pods bevorzugt auf verschiedene Nodes (aus der Referenz
          # uebernommen). Fuer die harte P4-Anforderung ("nie auf demselben simulierten
          # Standort") sorgt der topologySpreadConstraint unten zusaetzlich.
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: strimzi.io/name
                      operator: In
                      values:
                        - {{ include "kafka-cluster.clusterName" . }}-kafka
                topologyKey: kubernetes.io/hostname
      {{- if gt (int .Values.kafka.broker.replicas) 1 }}
      # P4: HARTE Verteilung ueber die drei simulierten Regionen (topology.ticketflow/region,
      # von infra/ansible/roles/node_labels gesetzt). Domaenengrund: der Broker-Log IST der
      # Puffer der Flash-Sale-Anfragen - liegen zwei der drei Replicas einer Partition in derselben
      # Region, nimmt deren Ausfall bei min.insync.replicas=2 das Schreiben auf dieses Topic mit,
      # catalog-api kann keine Reservierung mehr annehmen. DoNotSchedule statt ScheduleAnyway:
      # lieber bleibt ein Broker Pending (sichtbar, alarmierbar), als dass er still in eine schon
      # belegte Region rutscht. Guard nur, damit ein bewusst auf 1 Broker reduziertes Setup
      # ueberhaupt rendert - dev UND prod fahren 3 Broker (siehe values-dev.yaml).
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.ticketflow/region
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              strimzi.io/cluster: {{ include "kafka-cluster.clusterName" . }}
              strimzi.io/pool-name: broker
      {{- end }}
