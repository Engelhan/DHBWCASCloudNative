# B1 (Root-README ## Bonus): spiegelt die vom Strimzi User Operator automatisch generierten
# SCRAM-Credentials aller vier KafkaUser (catalog-api/reservation-worker/notification-worker/
# akhq - seit 2026-09-23 einheitlich, vorher hatte akhq als einziger ein vorgegebenes statt ein
# generiertes Passwort) zusaetzlich nach OpenBao. Fuer catalog-api/reservation-worker/
# notification-worker ist das keine Namespace-Ueberbrueckung (Quelle und PushSecret liegen im
# selben App-Namespace) - der Zweck ist die von Root-README ## Bonus B1 versprochene zentrale
# Audit-Flaeche: JEDES Credential in diesem Cluster soll in OpenBao inspizierbar sein
# ("bao kv get"), nicht nur die chart-eigenen/vom Bootstrap-Job erzeugten. Diese drei Consumer
# (secretKeyRef in charts/ticketflow-app/charts/reservation-worker/charts/notification-worker)
# aendern sich nicht - sie lesen weiterhin direkt das Strimzi-generierte Secret, nicht den
# gespiegelten OpenBao-Wert zurueck. **AKHQ ist die eine echte Ausnahme:** sein Pod laeuft im
# Namespace "kafka", kann das hier generierte Secret (im App-Namespace) also nicht per
# secretKeyRef erreichen - fuer AKHQ ist der Rueckweg ueber OpenBao
# (charts/akhq/templates/kafka-sasl-secret.yaml liest von hier) deshalb die tatsaechliche
# Namespace-Ueberbrueckung, nicht nur Audit-Kosmetik.
#
# updatePolicy: IfNotExists - Strimzi generiert das Passwort genau einmal bei der ersten
# KafkaUser-Reconciliation und rotiert es danach nicht von selbst; ein "Replace" wuerde bei jedem
# Sync unnoetig gegen denselben Wert schreiben.
{{- range .Values.kafka.users }}
{{- if not .passwordSecretName }}
---
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: {{ .name }}-to-openbao
  namespace: {{ include "kafka-cluster.appNamespace" $ }}
spec:
  updatePolicy: IfNotExists
  secretStoreRefs:
    - name: openbao
      kind: ClusterSecretStore
  selector:
    secret:
      name: {{ .name }}
  data:
    - match:
        secretKey: password
        remoteRef:
          remoteKey: kafka/{{ .name }}
          property: password
    - match:
        secretKey: sasl.jaas.config
        remoteRef:
          remoteKey: kafka/{{ .name }}
          property: sasl.jaas.config
{{- end }}
{{- end }}
