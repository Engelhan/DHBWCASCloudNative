# B1: mirrors the Strimzi-generated credentials to OpenBao (audit copy). AKHQ reads its own back
# from there, since its pod runs in another namespace. Replace keeps the copy current; ESO skips
# identical writes.
{{- range .Values.kafka.users }}
{{- if not .passwordSecretName }}
---
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: {{ .name }}-to-openbao
  namespace: {{ include "kafka-cluster.appNamespace" $ }}
spec:
  updatePolicy: Replace
  secretStoreRefs:
    - name: openbao
      kind: ClusterSecretStore
  selector:
    secret:
      name: {{ .name }}
  data:
    - match:
        secretKey: password
        remoteRef:
          remoteKey: kafka/{{ .name }}
          property: password
    - match:
        secretKey: sasl.jaas.config
        remoteRef:
          remoteKey: kafka/{{ .name }}
          property: sasl.jaas.config
{{- end }}
{{- end }}
