# Vorgegebenes SCRAM-Passwort fuer die "apicurio"-KafkaUser (kafka-users.yaml) - Apicurio laeuft
# im Namespace "kafka" (charts/apicurio), nicht "ticketflow" wie dieser Kafka-Cluster, kann also
# kein vom Strimzi User Operator generiertes Secret per secretKeyRef referenzieren
# (Namespace-Grenze) - gleiches Muster wie kafka-akhq-user-secret.yaml. Wert
# (kafka.apicurioUser.password) ist bewusst direkt im Repo hinterlegt statt CHANGE_ME/--set -
# siehe dessen Kommentar in values.yaml. Muss mit charts/apicurio/values.yaml kafkaSasl.password
# uebereinstimmen.
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.kafka.apicurioUser.passwordSecretName }}
  namespace: {{ .Values.kafka.metadata.namespace }}
type: Opaque
stringData:
  password: {{ .Values.kafka.apicurioUser.password | quote }}
