# Vorgegebenes SCRAM-Passwort fuer die "akhq"-KafkaUser (kafka-users.yaml) - AKHQ laeuft im
# Namespace "kafka" (charts/akhq), nicht "ticketflow" wie dieser Kafka-Cluster, kann also kein
# vom Strimzi User Operator generiertes Secret per secretKeyRef referenzieren (Namespace-Grenze).
# Wert (kafka.akhqUser.password) ist bewusst direkt im Repo hinterlegt statt CHANGE_ME/--set -
# siehe dessen Kommentar in values.yaml. Muss mit charts/akhq/values.yaml kafkaSasl.password
# uebereinstimmen.
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.kafka.akhqUser.passwordSecretName }}
  # Muss im selben Namespace liegen wie die KafkaUser-CR, die es referenziert (der
  # User Operator liest secretKeyRef aus deren Namespace) - also im App-Namespace.
  namespace: {{ include "kafka-cluster.appNamespace" . }}
type: Opaque
stringData:
  password: {{ .Values.kafka.akhqUser.password | quote }}
