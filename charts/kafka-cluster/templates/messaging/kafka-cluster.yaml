# KRaft Kafka; replicas and storage come from the KafkaNodePools. metadataVersion is left to
# Strimzi's default for the version.
apiVersion: kafka.strimzi.io/v1
kind: Kafka
metadata:
  name: {{ include "kafka-cluster.clusterName" . }}
  annotations:
    strimzi.io/kraft: enabled
    strimzi.io/node-pools: enabled
spec:
  kafka:
    version: {{ .Values.kafka.version | quote }}

    listeners:
      # Internal, no TLS, SCRAM-SHA-512 (SASL_PLAINTEXT). The name doesn't affect the bootstrap DNS.
      - name: plain
        port: 9092
        type: internal
        tls: false
        authentication:
          type: scram-sha-512
      # Unauthenticated internal listener for Apicurio only: its kafkasql storage supports no
      # SCRAM/PLAIN
      # (OAuth only). Clients connect as User:ANONYMOUS (see superUsers).
      - name: unauth
        port: 9093
        type: internal
        tls: false

    config:
      offsets.topic.replication.factor: {{ .Values.kafka.config.offsetsTopicReplicationFactor }}
      transaction.state.log.replication.factor: {{ .Values.kafka.config.transactionStateLogReplicationFactor }}
      transaction.state.log.min.isr: {{ .Values.kafka.config.transactionStateLogMinIsr }}
      default.replication.factor: {{ .Values.kafka.config.defaultReplicationFactor }}
      min.insync.replicas: {{ .Values.kafka.config.minInsyncReplicas }}
      # Only the two managed topics may exist.
      auto.create.topics.enable: false
      delete.topic.enable: true

    template:
      # P5: at most one broker unavailable at a time.
      podDisruptionBudget:
        maxUnavailable: 1

    # JMX exporter, rules in kafka-metrics-configmap.yaml.
    metricsConfig:
      type: jmxPrometheusExporter
      valueFrom:
        configMapKeyRef:
          name: kafka-metrics
          key: kafka-metrics-config.yml

    # B2: default-deny, per-client ACLs (kafka-users.yaml). Must sit under spec.kafka.
    authorization:
      type: simple
      # Lets the anonymous Apicurio listener through. Name without "User:" - Strimzi adds the
      # prefix.
      superUsers:
        - ANONYMOUS

  # Consumer-lag metrics (KEDA queries Kafka directly).
  kafkaExporter:
    topicRegex: ".*"
    groupRegex: ".*"
    resources:
      {{- toYaml .Values.kafka.kafkaExporter.resources | nindent 6 }}

  # Required to reconcile KafkaTopic CRs.
  entityOperator:
    topicOperator:
      resources:
        {{- toYaml .Values.kafka.entityOperator.topicOperator.resources | nindent 8 }}
    userOperator:
      # KafkaUsers live in the app namespace (see _helpers.tpl). Only works together with
      # STRIMZI_ENTITY_OPERATOR_WATCHED_NAMESPACE_ENABLED in charts/strimzi-operator.
      watchedNamespace: {{ include "kafka-cluster.appNamespace" . }}
      resources:
        {{- toYaml .Values.kafka.entityOperator.userOperator.resources | nindent 8 }}
