# Topics from .Values.kafka.topics.
{{- range .Values.kafka.topics }}
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: {{ .name }}
  labels:
    strimzi.io/cluster: {{ include "kafka-cluster.clusterName" $ }}
spec:
  partitions: {{ .partitions }}
  replicas: {{ .replicationFactor }}
  {{- if .config }}
  config:
    # Config values must be strings in values.yaml: Helm turns numbers into float64 (6.048e+08),
    # which Kafka rejects.
    {{- range $key, $value := .config }}
    {{ $key }}: {{ $value | quote }}
    {{- end }}
  {{- end }}
{{- end }}
