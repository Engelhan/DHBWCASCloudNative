# Controller-Pool, getrennt vom Broker-Pool (kafka-broker-nodepool.yaml) - siehe dortigen
# Kommentar zur Begruendung.
apiVersion: kafka.strimzi.io/v1
kind: KafkaNodePool
metadata:
  name: controller
  labels:
    strimzi.io/cluster: {{ include "kafka-cluster.clusterName" . }}
spec:
  replicas: {{ .Values.kafka.controller.replicas }}

  roles:
    - controller

  storage:
    type: jbod
    volumes:
      - id: 0
        type: {{ .Values.kafka.controller.storage.type }}
        size: {{ .Values.kafka.controller.storage.size }}
        deleteClaim: false

  # Zahlen + Herleitung in values.yaml (kafka.controller.resources/.jvmOptions).
  resources:
    {{- toYaml .Values.kafka.controller.resources | nindent 4 }}

  # Heap explizit statt von Strimzi aus dem Limit abgeleitet - nur so ist die Rechnung
  # "Heap + Off-Heap + Page-Cache <= Limit" in values.yaml tatsaechlich die, die laeuft.
  jvmOptions:
    -Xms: {{ .Values.kafka.controller.jvmOptions.heap | quote }}
    -Xmx: {{ .Values.kafka.controller.jvmOptions.heap | quote }}

  template:
    pod:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: strimzi.io/name
                      operator: In
                      values:
                        - {{ include "kafka-cluster.clusterName" . }}-kafka
                topologyKey: kubernetes.io/hostname
      {{- if gt (int .Values.kafka.controller.replicas) 1 }}
      # P4, siehe kafka-broker-nodepool.yaml - fuer den Controller-Quorum genauso relevant
      # (Verlust einer Region darf nicht die Mehrheit des Controller-Quorums mitreissen).
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.ticketflow/region
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              strimzi.io/cluster: {{ include "kafka-cluster.clusterName" . }}
              strimzi.io/pool-name: controller
      {{- end }}
