# KRaft controller pool.
apiVersion: kafka.strimzi.io/v1
kind: KafkaNodePool
metadata:
  name: controller
  labels:
    strimzi.io/cluster: {{ include "kafka-cluster.clusterName" . }}
spec:
  replicas: {{ .Values.kafka.controller.replicas }}

  roles:
    - controller

  storage:
    type: jbod
    volumes:
      - id: 0
        type: {{ .Values.kafka.controller.storage.type }}
        size: {{ .Values.kafka.controller.storage.size }}
        deleteClaim: false

  # Sizing rationale in values.yaml.
  resources:
    {{- toYaml .Values.kafka.controller.resources | nindent 4 }}

  # Explicit heap so the memory budget in values.yaml is what actually runs.
  jvmOptions:
    -Xms: {{ .Values.kafka.controller.jvmOptions.heap | quote }}
    -Xmx: {{ .Values.kafka.controller.jvmOptions.heap | quote }}

  template:
    pod:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: strimzi.io/name
                      operator: In
                      values:
                        - {{ include "kafka-cluster.clusterName" . }}-kafka
                topologyKey: kubernetes.io/hostname
      {{- if gt (int .Values.kafka.controller.replicas) 1 }}
      # P4: losing one region must not take the quorum majority.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.ticketflow/region
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              strimzi.io/cluster: {{ include "kafka-cluster.clusterName" . }}
              strimzi.io/pool-name: controller
      {{- end }}
