# One KafkaUser per client (SCRAM-SHA-512, least-privilege ACLs, B2).
{{- range .Values.kafka.users }}
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaUser
metadata:
  name: {{ .name }}
  # App namespace, see _helpers.tpl.
  namespace: {{ include "kafka-cluster.appNamespace" $ }}
  labels:
    strimzi.io/cluster: {{ include "kafka-cluster.clusterName" $ }}
spec:
  authentication:
    type: scram-sha-512
    {{- if .passwordSecretName }}
    # Optional pre-supplied password (currently unused).
    password:
      valueFrom:
        secretKeyRef:
          name: {{ .passwordSecretName }}
          key: password
    {{- end }}
  authorization:
    type: simple
    acls:
      {{- range .acls }}
      - resource:
          {{- toYaml .resource | nindent 10 }}
        operations:
          {{- toYaml .operations | nindent 10 }}
      {{- end }}
{{- end }}
