# Muss unter dem Dependency-Alias "tempo" verschachtelt sein (siehe Chart.yaml), damit Helm die
# Werte an das gewrappte Upstream-Chart durchreicht - der Chart hat selbst nochmal einen
# verschachtelten "tempo:"-Block fuer Image/Container-Einstellungen (z.B. resources, storage),
# waehrend persistence/serviceMonitor auf oberster Ebene des Upstream-Charts liegen.
tempo:
  fullnameOverride: tempo

  tempo:
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi
    # Lokales Storage-Backend (Chart-Default) statt S3/GCS/Azure - reicht fuer die kleine
    # Lab-Groesse, persistiert ueber die persistence-PVC unten (Longhorn).
    storage:
      trace:
        backend: local
        local:
          path: /var/tempo/traces
        wal:
          path: /var/tempo/wal
    # Container-Level-SecurityContext (tempo.tempo.securityContext, nicht zu verwechseln mit
    # dem Pod-Level tempo.securityContext weiter unten - siehe templates/statefulset.yaml:
    # .Values.tempo.securityContext landet im Container, .Values.securityContext im Pod).
    # readOnlyRootFilesystem bewusst NICHT gesetzt - der Chart warnt im eigenen
    # values.yaml-Kommentar explizit "fails if true, do not enable".
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL

  persistence:
    enabled: true
    storageClassName: longhorn
    size: 10Gi

  # Fuettert Tempo-eigene Metriken in Prometheus (kube-prometheus-stack, ServiceMonitor-CRD
  # muss existieren - gleicher Namespace, gleicher Sync-Batch ueber app-of-apps).
  serviceMonitor:
    enabled: true

  # Pod-Level tempo.securityContext (runAsNonRoot/runAsUser/runAsGroup/fsGroup) ist bereits
  # Chart-Default gesetzt - kein Override noetig, siehe Kommentar bei tempo.tempo.securityContext
  # oben fuer die Container-Level-Ergaenzung.

  # Chart-eigene NetworkPolicy - Default erlaubt Ingress von ueberall auf den Tempo-Port
  # (allowExternal: true), nicht auf konkrete Pod-/Namespace-Selektoren verengt, siehe
  # cert-manager/values.yaml fuer die Begruendung.
  networkPolicy:
    enabled: true
