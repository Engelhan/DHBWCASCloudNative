# Zone values for the upstream args: values files aren't templated, so they go through this
# ConfigMap and $(VAR) expansion in args.
apiVersion: v1
kind: ConfigMap
metadata:
  name: external-dns-zone
  labels:
    app.kubernetes.io/name: external-dns
    app.kubernetes.io/managed-by: {{ .Release.Service }}
data:
  DNS_ZONE: {{ required "ticketflow.dnsZone is missing - pass gitops/env/cluster.yaml (-f gitops/env/cluster.yaml)" .Values.ticketflow.dnsZone | quote }}
  RFC2136_SERVER: {{ required "ticketflow.rfc2136.server is missing - pass gitops/env/cluster.yaml (-f gitops/env/cluster.yaml)" .Values.ticketflow.rfc2136.server | quote }}
  RFC2136_KEYNAME: {{ required "ticketflow.rfc2136.keyName is missing - pass gitops/env/cluster.yaml (-f gitops/env/cluster.yaml)" .Values.ticketflow.rfc2136.keyName | quote }}
