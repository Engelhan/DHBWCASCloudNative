# Zentrale, deployment-weite Werte - werden NICHT hier gepflegt, sondern in
# gitops/env/cluster.yaml (ArgoCD reicht die Datei jedem Chart per Multi-Source "$values"
# durch, siehe gitops/applicationset.yaml). Der leere Default steht hier nur, damit ein
# Rendern ohne diese Datei eine verstaendliche Fehlermeldung statt eines Nil-Pointers liefert.
# Lokal deshalb immer:
#   helm template <name> charts/<name> -f charts/<name>/values.yaml -f gitops/env/cluster.yaml
ticketflow: {}

# Nutzt die echte DHBW-DNS-Zone aus gitops/env/cluster.yaml (ticketflow.dnsZone/.rfc2136.*) -
# dieselbe Quelle, aus der sich auch ../cert-manager-config speist. Da Helm Values-Dateien nicht
# templatet, kommen die Werte NICHT direkt hier hinein, sondern per "$(VAR)" aus der ConfigMap
# external-dns-zone (siehe templates/zone-configmap.yaml). Alles unter dem Dependency-Alias
# "external-dns" wird an das gewrappte Upstream-Chart durchgereicht (siehe Chart.yaml).
#
# Voraussetzung (VOR dem ersten Sync, bewusst nicht im Repo): das TSIG-Secret. Wird von
# infra/ansible/roles/gitops_secrets angelegt, manuell waere es:
#   kubectl create namespace external-dns
#   kubectl -n external-dns create secret generic external-dns-rfc2136-tsig \
#     --from-literal=secret=<TSIG-Wert>
external-dns:
  image:
    tag: v0.21.0
  logLevel: debug
  # podSecurityContext/securityContext sind bereits Chart-Default gehaertet (runAsNonRoot,
  # readOnlyRootFilesystem, capabilities drop ALL, seccompProfile RuntimeDefault) - kein
  # Override noetig. Kein natives networkPolicy-Feld im Chart vorhanden.
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi
  provider:
    name: rfc2136
  sources:
    - service
    - ingress
    - traefik-proxy
  policy: sync
  registry: txt
  # Projekteindeutig (nicht der generische Upstream-Default), damit sich mehrere Cluster in
  # derselben Zone nicht um dieselben TXT-Records streiten.
  txtOwnerId: ticketflow-dns
  txtPrefix: ticketflow-dns-
  managedRecordTypes:
    - A
    - AAAA
    - CNAME
  # Wird vom Chart als --domain-filter=<Wert> gerendert; Kubernetes expandiert $(DNS_ZONE)
  # daraus aus dem Container-Env (siehe env: unten).
  domainFilters:
    - $(DNS_ZONE)
  env:
    - name: RFC2136_TSIG_SECRET
      valueFrom:
        secretKeyRef:
          name: external-dns-rfc2136-tsig
          key: secret
    # Aus templates/zone-configmap.yaml, gespeist aus gitops/env/cluster.yaml.
    - name: DNS_ZONE
      valueFrom:
        configMapKeyRef:
          name: external-dns-zone
          key: DNS_ZONE
    - name: RFC2136_SERVER
      valueFrom:
        configMapKeyRef:
          name: external-dns-zone
          key: RFC2136_SERVER
    - name: RFC2136_KEYNAME
      valueFrom:
        configMapKeyRef:
          name: external-dns-zone
          key: RFC2136_KEYNAME
  extraArgs:
    # Ziel-Netze, die External DNS NIE veroeffentlicht (private/NAT-Adressen aus
    # Node-/Ingress-Status).
    - --exclude-target-net=10.0.0.0/8 # RFC1918
    - --exclude-target-net=172.16.0.0/12 # RFC1918
    - --exclude-target-net=192.168.0.0/16 # RFC1918
    - --exclude-target-net=100.64.0.0/10 # CGNAT (RFC6598)
    - --exclude-target-net=169.254.0.0/16 # IPv4 Link-Local
    - --exclude-target-net=fc00::/7 # IPv6 ULA
    - --exclude-target-net=fe80::/10 # IPv6 Link-Local
    # DHBW-Dynamic-DNS-Server (self-service.dhbw.cloud); auch Nameserver fuer den
    # cert-manager-dns01-Solver, siehe ../cert-manager-config/values.yaml. Adresse/Zone/Key-Name
    # kommen aus gitops/env/cluster.yaml ueber die ConfigMap external-dns-zone.
    - --rfc2136-host=$(RFC2136_SERVER)
    - --rfc2136-port=53
    - --rfc2136-zone=$(DNS_ZONE)
    # $(VAR) wird von Kubernetes aus dem Container-Env aufgeloest (siehe env: oben) - das
    # eigentliche Secret steht NICHT hier im Repo, sondern in einem vorab angelegten K8s-Secret
    # (external-dns-rfc2136-tsig).
    - --rfc2136-tsig-secret=$(RFC2136_TSIG_SECRET)
    - --rfc2136-tsig-secret-alg=hmac-sha512
    - --rfc2136-tsig-keyname=$(RFC2136_KEYNAME)
    - --rfc2136-tsig-axfr
  # Kein rbac.additionalPermissions noetig: der Chart fuegt die traefik.io-RBAC-Regeln
  # (ingressroutes/-tcps/-udps) automatisch hinzu, sobald "traefik-proxy" in sources steht.
