# Set via gitops/env/cluster.yaml; empty default only for a readable error.
ticketflow: {}

# Upstream values (dependency alias). Zone settings come in as $(VAR) from the external-dns-zone
# ConfigMap. The TSIG secret is created by infra/ansible/roles/gitops_secrets.
external-dns:
  image:
    tag: v0.21.0
  logLevel: debug
  # Security contexts are hardened by default.
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi
  provider:
    name: rfc2136
  sources:
    - service
    - ingress
    - traefik-proxy
  policy: sync
  registry: txt
  # Unique owner ID so several clusters can share the zone.
  txtOwnerId: ticketflow-dns
  txtPrefix: ticketflow-dns-
  managedRecordTypes:
    - A
    - AAAA
    - CNAME
  # Expanded by Kubernetes from the container env.
  domainFilters:
    - $(DNS_ZONE)
  env:
    - name: RFC2136_TSIG_SECRET
      valueFrom:
        secretKeyRef:
          name: external-dns-rfc2136-tsig
          key: secret
    # From templates/zone-configmap.yaml.
    - name: DNS_ZONE
      valueFrom:
        configMapKeyRef:
          name: external-dns-zone
          key: DNS_ZONE
    - name: RFC2136_SERVER
      valueFrom:
        configMapKeyRef:
          name: external-dns-zone
          key: RFC2136_SERVER
    - name: RFC2136_KEYNAME
      valueFrom:
        configMapKeyRef:
          name: external-dns-zone
          key: RFC2136_KEYNAME
  extraArgs:
    # Never publish private/NAT addresses.
    - --exclude-target-net=10.0.0.0/8 # RFC1918
    - --exclude-target-net=172.16.0.0/12 # RFC1918
    - --exclude-target-net=192.168.0.0/16 # RFC1918
    - --exclude-target-net=100.64.0.0/10 # CGNAT (RFC6598)
    - --exclude-target-net=169.254.0.0/16 # IPv4 Link-Local
    - --exclude-target-net=fc00::/7 # IPv6 ULA
    - --exclude-target-net=fe80::/10 # IPv6 Link-Local
    # DHBW dynamic DNS server, zone and key name via the external-dns-zone ConfigMap.
    - --rfc2136-host=$(RFC2136_SERVER)
    - --rfc2136-port=53
    - --rfc2136-zone=$(DNS_ZONE)
    # Expanded from the pre-created external-dns-rfc2136-tsig secret.
    - --rfc2136-tsig-secret=$(RFC2136_TSIG_SECRET)
    - --rfc2136-tsig-secret-alg=hmac-sha512
    - --rfc2136-tsig-keyname=$(RFC2136_KEYNAME)
    - --rfc2136-tsig-axfr
  # The chart adds the traefik.io RBAC rules for the traefik-proxy source itself.
