# Zentrale, deployment-weite Werte - siehe gitops/env/cluster.yaml. Leerer Default nur, damit ein
# Rendern ohne diese Datei eine verstaendliche Fehlermeldung statt eines Nil-Pointers liefert.
ticketflow: {}

# Muss unter dem Dependency-Alias "external-secrets" verschachtelt sein (siehe Chart.yaml), damit
# Helm die Werte an den gewrappten Upstream-Chart durchreicht.
external-secrets:
  # P4 - zwei Replicas je Komponente, hart auf zwei verschiedene simulierte Regionen verteilt
  # (DoNotSchedule + maxSkew 1; matchLabelKeys, damit beim Rollout nur Pods derselben Revision
  # zaehlen). labelSelector = die vom Upstream-Chart tatsaechlich gerenderten Pod-Labels, von Hand
  # eingetragen, weil Helm values.yaml nicht templatet - gegen `helm template` geprueft.
  # leaderElect ist upstream AUS - ohne ihn wuerden zwei Controller-Pods dieselben
  # ExternalSecrets/PushSecrets parallel reconcilen. Gilt auch fuer den cert-controller.
  leaderElect: true
  replicaCount: 2
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: topology.ticketflow/region
      whenUnsatisfiable: DoNotSchedule
      matchLabelKeys:
        - pod-template-hash
      labelSelector:
        matchLabels:
          app.kubernetes.io/name: external-secrets
          app.kubernetes.io/instance: external-secrets-operator
  installCRDs: true # kein anderer Chart bringt die ExternalSecret/(Cluster)SecretStore-CRDs mit

  image:
    tag: "v2.11.0" # = Chart.AppVersion, explizit statt implizitem Default (kein :latest, siehe P3)

  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

  webhook:
    replicaCount: 2
    podDisruptionBudget:
      enabled: true
      minAvailable: 1
    topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: topology.ticketflow/region
        whenUnsatisfiable: DoNotSchedule
        matchLabelKeys:
          - pod-template-hash
        labelSelector:
          matchLabels:
            app.kubernetes.io/name: external-secrets-webhook
            app.kubernetes.io/instance: external-secrets-operator
    resources:
      requests:
        cpu: 25m
        memory: 32Mi
      limits:
        cpu: 100m
        memory: 64Mi

  certController:
    replicaCount: 2
    podDisruptionBudget:
      enabled: true
      minAvailable: 1
    topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: topology.ticketflow/region
        whenUnsatisfiable: DoNotSchedule
        matchLabelKeys:
          - pod-template-hash
        labelSelector:
          matchLabels:
            app.kubernetes.io/name: external-secrets-cert-controller
            app.kubernetes.io/instance: external-secrets-operator
    resources:
      requests:
        cpu: 25m
        memory: 32Mi
      limits:
        cpu: 100m
        memory: 64Mi

  serviceAccount:
    create: true
    # Name, den charts/openbao-secretstore's ClusterSecretStore UND der Bootstrap-Job in
    # charts/openbao (Kubernetes-Auth-Role "external-secrets") referenzieren.
    name: external-secrets

  # Aus: kube-prometheus-stack ist entfernt, die ServiceMonitor-CRD existiert nicht mehr.
  serviceMonitor:
    enabled: false

  # Aus - alle NetworkPolicies kommen zentral aus charts/network-policies (B1).
  networkPolicy:
    enabled: false
