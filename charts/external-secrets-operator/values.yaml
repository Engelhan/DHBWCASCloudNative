# Set via gitops/env/cluster.yaml; empty default only for a readable error.
ticketflow: {}

# Upstream values (dependency alias).
external-secrets:
  # P4: two replicas per component, hard-spread across regions (labels = upstream pod labels).
  # leaderElect is off upstream; required with more than one controller.
  leaderElect: true
  replicaCount: 2
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: topology.ticketflow/region
      whenUnsatisfiable: DoNotSchedule
      matchLabelKeys:
        - pod-template-hash
      labelSelector:
        matchLabels:
          app.kubernetes.io/name: external-secrets
          app.kubernetes.io/instance: external-secrets-operator
  installCRDs: true

  image:
    tag: "v2.11.0"

  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

  webhook:
    replicaCount: 2
    podDisruptionBudget:
      enabled: true
      minAvailable: 1
    topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: topology.ticketflow/region
        whenUnsatisfiable: DoNotSchedule
        matchLabelKeys:
          - pod-template-hash
        labelSelector:
          matchLabels:
            app.kubernetes.io/name: external-secrets-webhook
            app.kubernetes.io/instance: external-secrets-operator
    resources:
      requests:
        cpu: 25m
        memory: 32Mi
      limits:
        cpu: 100m
        memory: 64Mi

  certController:
    replicaCount: 2
    podDisruptionBudget:
      enabled: true
      minAvailable: 1
    topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: topology.ticketflow/region
        whenUnsatisfiable: DoNotSchedule
        matchLabelKeys:
          - pod-template-hash
        labelSelector:
          matchLabels:
            app.kubernetes.io/name: external-secrets-cert-controller
            app.kubernetes.io/instance: external-secrets-operator
    resources:
      requests:
        cpu: 25m
        memory: 32Mi
      limits:
        cpu: 100m
        memory: 64Mi

  serviceAccount:
    create: true
    # Referenced by the ClusterSecretStore and OpenBao's kubernetes auth role.
    name: external-secrets

  # No Prometheus in the cluster.
  serviceMonitor:
    enabled: false

  # NetworkPolicies come from charts/network-policies.
  networkPolicy:
    enabled: false
