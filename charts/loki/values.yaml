# SingleBinary-Deployment-Modus statt SimpleScalable/Distributed - fuer die kleine Lab-Groesse
# reicht eine Instanz, keine getrennten Read-/Write-/Backend-Komponenten. Struktur folgt
# 1:1 dem offiziellen single-binary-values.yaml-Referenzbeispiel des Upstream-Charts (inkl.
# "Zero out replica counts of other deployment modes"), nur Ressourcengroessen fuer die
# kleinen Lab-VMs reduziert. Muss unter dem Dependency-Alias "loki" verschachtelt sein (siehe
# Chart.yaml), damit Helm die Werte an das gewrappte Upstream-Chart durchreicht.
# loki.podSecurityContext/containerSecurityContext (globaler Block weiter unten) sind bereits
# Chart-Default gehaertet (runAsNonRoot, readOnlyRootFilesystem, capabilities drop ALL) und
# gelten fuer alle Loki-eigenen Pods (singleBinary/gateway) - kein Override noetig.
loki:
  fullnameOverride: loki

  # BEWUSST deaktiviert (anders als bei den anderen Charts): der Chart legt bei
  # networkPolicy.enabled=true ungefragt zusaetzlich eine "<release>-namespace-only"-Policy mit
  # LEEREM podSelector an (templates/networkpolicy.yaml) - die gilt dann fuer ALLE Pods im
  # Namespace "monitoring", nicht nur fuer Loki selbst, und erlaubt nur noch Traffic innerhalb
  # der Namespace-Grenze. Live beobachtet: das hat den Grafana-Sidecars (im selben Namespace,
  # siehe charts/kube-prometheus-stack) den Egress zum Kubernetes-API-Server gekappt
  # ("connection refused" auf die Service-ClusterIP) - CrashLoopBackOff. Kein
  # Chart-eigenes Sub-Flag, um nur diese eine Policy abzuschalten, deshalb hier komplett aus.
  # Tempos networkPolicy hat dasselbe Problem NICHT (dort korrekt auf die eigenen Pods
  # ueber podSelector.matchLabels beschraenkt, siehe charts/tempo/values.yaml).
  networkPolicy:
    enabled: false

  deploymentMode: SingleBinary
  singleBinary:
    replicas: 1
    persistence:
      enabled: true
      storageClass: longhorn
      size: 10Gi
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        cpu: 1
        memory: 1Gi

  loki:
    commonConfig:
      replication_factor: 1
    schemaConfig:
      configs:
        - from: "2024-04-01"
          store: tsdb
          object_store: s3
          schema: v13
          index:
            prefix: loki_index_
            period: 24h
    # Kein externer S3-Bucket vorhanden - das eingebaute minio (unten) dient als
    # S3-kompatibler Objektspeicher, auf einer Longhorn-PVC persistiert.
    storage:
      type: s3

  # Eingebautes MinIO als S3-kompatibler Objektspeicher fuer Chunks/Ruler/Admin-API -
  # offiziell empfohlener Weg fuer SingleBinary ohne echtes Cloud-Object-Storage, siehe
  # Upstream-Chart-Referenz single-binary-values.yaml. containerSecurityContext.
  # readOnlyRootFilesystem bleibt bewusst false (Chart-Default, minio schreibt Laufzeitdaten
  # ausserhalb des deklarierten Volumes) - restliche Haertung trotzdem ergaenzt.
  minio:
    enabled: true
    persistence:
      storageClass: longhorn
      size: 10Gi
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi
    containerSecurityContext:
      readOnlyRootFilesystem: false
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL

  # Chart-Default aktiviert zusaetzlich zwei eigene Memcached-StatefulSets (chunks-cache,
  # results-cache) mit happigen Default-Anforderungen (chunksCache.allocatedMemory: 8192 = 8Gi!,
  # resultsCache.allocatedMemory: 1024 = 1Gi) - eine reine Latenz-Optimierung fuer echtes
  # Produktions-Log-Volumen, fuer die kleine Lab-Groesse unnoetig. Deaktiviert statt
  # runterzutunen, spart zwei zusaetzliche Pods komplett.
  chunksCache:
    enabled: false
  resultsCache:
    enabled: false

  # Gateway (nginx) ist der dokumentierte Standard-Entrypoint, auch im SingleBinary-Modus -
  # Grafana-Datasource (charts/kube-prometheus-stack/values.yaml) zeigt darauf.
  # podSecurityContext/containerSecurityContext sind bereits Chart-Default gehaertet - kein
  # Override noetig.
  gateway:
    enabled: true
    resources:
      requests:
        cpu: 25m
        memory: 32Mi
      limits:
        cpu: 100m
        memory: 64Mi

  # Fuettert Loki-eigene Metriken in Prometheus (kube-prometheus-stack, ServiceMonitor-CRD
  # muss existieren - gleicher Namespace, gleicher Sync-Batch ueber app-of-apps).
  monitoring:
    serviceMonitor:
      enabled: true

  # Zero out der Replica-Counts anderer Deployment-Modi - siehe Upstream-Referenz
  # single-binary-values.yaml.
  backend:
    replicas: 0
  read:
    replicas: 0
  write:
    replicas: 0
  ingester:
    replicas: 0
  querier:
    replicas: 0
  queryFrontend:
    replicas: 0
  queryScheduler:
    replicas: 0
  distributor:
    replicas: 0
  compactor:
    replicas: 0
  indexGateway:
    replicas: 0
  bloomCompactor:
    replicas: 0
  bloomGateway:
    replicas: 0
