{{- $ctx := dict "root" $ "component" "frontend" }}
{{- if .Values.frontend.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "ticketflow-app.componentName" $ctx }}
  labels:
    {{- include "ticketflow-app.componentLabels" $ctx | nindent 4 }}
spec:
  # Niemals leer lassen - siehe charts/README.md (Loki-Vorfall).
  podSelector:
    matchLabels:
      {{- include "ticketflow-app.componentSelectorLabels" $ctx | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    # Nur Traefik (Ingress) aus kube-system. Das Frontend hat keine /metrics, wird also nicht
    # gescrapt.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - port: http
          protocol: TCP
{{- end }}
