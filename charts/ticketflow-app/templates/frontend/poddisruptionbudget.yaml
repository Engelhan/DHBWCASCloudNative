{{- $ctx := dict "root" $ "component" "frontend" }}
{{- if .Values.frontend.podDisruptionBudget.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "ticketflow-app.componentName" $ctx }}
  labels:
    {{- include "ticketflow-app.componentLabels" $ctx | nindent 4 }}
spec:
  minAvailable: {{ .Values.frontend.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      {{- include "ticketflow-app.componentSelectorLabels" $ctx | nindent 6 }}
{{- end }}
