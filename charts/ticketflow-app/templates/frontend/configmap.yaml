{{- $ctx := dict "root" $ "component" "frontend" }}
# Empty API_BASE_URL makes the frontend call the API same-origin (routed by the Ingress).
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ticketflow-app.componentName" $ctx }}
  labels:
    {{- include "ticketflow-app.componentLabels" $ctx | nindent 4 }}
data:
  config.js: |
    window.API_BASE_URL = "";
