{{- $ctx := dict "root" $ "component" "frontend" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ticketflow-app.componentName" $ctx }}
  labels:
    {{- include "ticketflow-app.componentLabels" $ctx | nindent 4 }}
spec:
  replicas: {{ .Values.frontend.replicaCount }}
  selector:
    matchLabels:
      {{- include "ticketflow-app.componentSelectorLabels" $ctx | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "ticketflow-app.componentLabels" $ctx | nindent 8 }}
    spec:
      # Harte Verteilung ueber die drei simulierten Regionen (P4): DoNotSchedule + maxSkew 1 heisst,
      # schon das zweite Replica MUSS in einer anderen Region landen als das erste. Nodes ohne
      # Regions-Label (die Control-Plane) fallen damit automatisch heraus. matchLabelKeys zaehlt
      # nur Pods derselben ReplicaSet-Revision - sonst blockieren beim Rollout die alten Pods die
      # Regionen, in die die neuen sollen.
      {{- if .Values.frontend.topologySpreadConstraint.enabled }}
      topologySpreadConstraints:
        - maxSkew: {{ .Values.frontend.topologySpreadConstraint.maxSkew }}
          topologyKey: topology.ticketflow/region
          whenUnsatisfiable: DoNotSchedule
          matchLabelKeys:
            - pod-template-hash
          labelSelector:
            matchLabels:
              {{- include "ticketflow-app.componentSelectorLabels" $ctx | nindent 14 }}
      {{- end }}
      {{- with .Values.frontend.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: frontend
          image: {{ include "ticketflow-app.componentImage" (merge (dict "image" .Values.frontend.image) $ctx) | quote }}
          imagePullPolicy: {{ .Values.frontend.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.frontend.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          volumeMounts:
            - name: config
              mountPath: /usr/share/nginx/html/config.js
              subPath: config.js
          readinessProbe:
            httpGet:
              path: /
              port: http
          livenessProbe:
            httpGet:
              path: /
              port: http
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
      volumes:
        - name: config
          configMap:
            name: {{ include "ticketflow-app.componentName" $ctx }}
