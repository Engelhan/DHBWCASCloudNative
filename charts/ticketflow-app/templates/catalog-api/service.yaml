{{- $ctx := dict "root" $ "component" "catalog-api" }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ticketflow-app.componentName" $ctx }}
  labels:
    {{- include "ticketflow-app.componentLabels" $ctx | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "ticketflow-app.componentSelectorLabels" $ctx | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.catalogApi.service.port }}
      targetPort: http
      protocol: TCP
