{{- $ctx := dict "root" $ "component" "catalog-api" }}
{{- if .Values.catalogApi.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "ticketflow-app.componentName" $ctx }}
  labels:
    {{- include "ticketflow-app.componentLabels" $ctx | nindent 4 }}
spec:
  # podSelector bewusst auf die eigenen Pod-Labels beschraenkt, niemals leer - siehe
  # charts/README.md fuer den dokumentierten Loki-Vorfall (leerer podSelector traf alle Pods im
  # geteilten Namespace).
  podSelector:
    matchLabels:
      {{- include "ticketflow-app.componentSelectorLabels" $ctx | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    # Prometheus-Scraping aus dem monitoring-Namespace.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - port: http
          protocol: TCP
    # Traefik (Ingress) aus kube-system und das Frontend im eigenen Namespace.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
        - podSelector:
            matchLabels:
              {{- include "ticketflow-app.componentSelectorLabels" (dict "root" $ "component" "frontend") | nindent 14 }}
      ports:
        - port: http
          protocol: TCP
{{- end }}
