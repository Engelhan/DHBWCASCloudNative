{{- if .Values.catalogApi.databaseSecret.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.catalogApi.database.credentialsSecretName }}
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: catalog-api
    app.kubernetes.io/part-of: ticketflow
type: Opaque
stringData:
  username: {{ .Values.catalogApi.databaseSecret.username | quote }}
  password: {{ .Values.catalogApi.databaseSecret.password | quote }}
{{- end }}
