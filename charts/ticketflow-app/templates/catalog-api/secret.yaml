{{- $ctx := dict "root" $ "component" "catalog-api" }}
{{- if .Values.catalogApi.databaseSecret.create }}
# Eigenes Secret statt einer Referenz auf das von charts/postgres-cluster angelegte: dessen Secret
# liegt im Namespace "application", dieser Chart im Namespace "ticketflow", und secretKeyRef kann
# Namespace-Grenzen nicht ueberschreiten. Gleiches Muster wie charts/reservation-worker. Die Werte
# muessen deshalb mit charts/postgres-cluster values.yaml database.owner/.password uebereinstimmen.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ticketflow-app.componentName" $ctx }}-db-credentials
  labels:
    {{- include "ticketflow-app.componentLabels" $ctx | nindent 4 }}
type: Opaque
stringData:
  username: {{ .Values.catalogApi.databaseSecret.username | quote }}
  password: {{ .Values.catalogApi.databaseSecret.password | quote }}
{{- end }}
