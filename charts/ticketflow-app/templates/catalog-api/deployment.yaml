apiVersion: apps/v1
kind: Deployment
metadata:
  name: ticketflow-catalog-api
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: catalog-api
    app.kubernetes.io/part-of: ticketflow
spec:
  replicas: {{ .Values.catalogApi.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: catalog-api
      app.kubernetes.io/part-of: ticketflow
  template:
    metadata:
      labels:
        app.kubernetes.io/name: catalog-api
        app.kubernetes.io/part-of: ticketflow
    spec:
      # Weiche Verteilung ueber die drei simulierten Regionen (P4) - siehe values.yaml-Kommentar
      # bei catalogApi.topologySpreadConstraint.
      {{- if .Values.catalogApi.topologySpreadConstraint.enabled }}
      topologySpreadConstraints:
        - maxSkew: {{ .Values.catalogApi.topologySpreadConstraint.maxSkew }}
          topologyKey: topology.ticketflow/region
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: catalog-api
              app.kubernetes.io/part-of: ticketflow
      {{- end }}
      # runAsUser/runAsGroup explizit als Zahl noetig: das Image (distroless/static-debian12:
      # nonroot) setzt den Container-User nur als NAMEN ("nonroot"), Kubernetes kann Namen aber
      # nicht auflösen und verweigert mit runAsNonRoot: true sonst den Start ("cannot verify
      # user is non-root"). 65532 ist Distroless' Standard-nonroot-UID/GID, siehe
      # src/catalog-api/Dockerfile.
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
      containers:
        - name: catalog-api
          image: "{{ .Values.catalogApi.image.repository }}:{{ .Values.catalogApi.image.tag }}"
          imagePullPolicy: {{ .Values.catalogApi.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: ticketflow-catalog-api
          env:
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.catalogApi.database.credentialsSecretName }}
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.catalogApi.database.credentialsSecretName }}
                  key: password
            {{- if .Values.catalogApi.kafkaSasl.enabled }}
            - name: KAFKA_SASL_PASSWORD
              valueFrom:
                secretKeyRef:
                  # Vom Strimzi User Operator automatisch angelegtes Secret (siehe
                  # values.yaml-Kommentar bei catalogApi.kafkaSasl) - nicht dieser Chart.
                  name: {{ .Values.catalogApi.kafkaSasl.secretName }}
                  key: password
            {{- end }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
          resources:
            {{- toYaml .Values.catalogApi.resources | nindent 12 }}
