{{- $ctx := dict "root" $ "component" "catalog-api" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ticketflow-app.componentName" $ctx }}
  labels:
    {{- include "ticketflow-app.componentLabels" $ctx | nindent 4 }}
spec:
  replicas: {{ .Values.catalogApi.replicaCount }}
  selector:
    matchLabels:
      {{- include "ticketflow-app.componentSelectorLabels" $ctx | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "ticketflow-app.componentLabels" $ctx | nindent 8 }}
    spec:
      # P4: hard spread across regions; matchLabelKeys ignores old pods during rollouts.
      {{- if .Values.catalogApi.topologySpreadConstraint.enabled }}
      topologySpreadConstraints:
        - maxSkew: {{ .Values.catalogApi.topologySpreadConstraint.maxSkew }}
          topologyKey: topology.ticketflow/region
          whenUnsatisfiable: DoNotSchedule
          matchLabelKeys:
            - pod-template-hash
          labelSelector:
            matchLabels:
              {{- include "ticketflow-app.componentSelectorLabels" $ctx | nindent 14 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.catalogApi.podSecurityContext | nindent 8 }}
      containers:
        - name: catalog-api
          image: {{ include "ticketflow-app.componentImage" (merge (dict "image" .Values.catalogApi.image) $ctx) | quote }}
          imagePullPolicy: {{ .Values.catalogApi.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.catalogApi.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "ticketflow-app.componentName" $ctx }}
          env:
            # From the CNPG secret (same namespace).
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "ticketflow-app.databaseSecretName" $ }}
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "ticketflow-app.databaseSecretName" $ }}
                  key: password
            {{- if .Values.catalogApi.config.kafkaSasl.enabled }}
            - name: KAFKA_SASL_PASSWORD
              valueFrom:
                secretKeyRef:
                  # Created by the Strimzi User Operator.
                  name: {{ .Values.catalogApi.config.kafkaSasl.secretName }}
                  key: password
            {{- end }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
          resources:
            {{- toYaml .Values.catalogApi.resources | nindent 12 }}
