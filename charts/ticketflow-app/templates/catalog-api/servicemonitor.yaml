{{- $ctx := dict "root" $ "component" "catalog-api" }}
{{- if .Values.catalogApi.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "ticketflow-app.componentName" $ctx }}
  labels:
    {{- include "ticketflow-app.componentLabels" $ctx | nindent 4 }}
    {{- with .Values.catalogApi.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "ticketflow-app.componentSelectorLabels" $ctx | nindent 6 }}
  endpoints:
    - port: http
      path: /metrics
      interval: {{ .Values.catalogApi.serviceMonitor.interval }}
{{- end }}
