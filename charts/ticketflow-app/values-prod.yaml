# HA-Werte - siehe README ## values-dev.yaml vs. values-prod.yaml. 3 Replicas je Service, damit
# topologySpreadConstraints (maxSkew: 1) tatsaechlich etwas zu verteilen hat - eine simulierte
# Region kann komplett ausfallen, ohne dass catalog-api/frontend komplett weg sind
# (P4/P5-Begruendung).

catalogApi:
  replicaCount: 3
  podDisruptionBudget:
    minAvailable: 2

frontend:
  replicaCount: 3
  podDisruptionBudget:
    minAvailable: 2
