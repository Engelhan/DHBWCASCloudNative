# Gemeinsame Basiswerte fuer alle Umgebungen. dev/prod-spezifische Overrides in
# values-dev.yaml/values-prod.yaml.
#
# catalog-api + frontend (Philipps Scope) - bewusst eigener Chart, getrennt von
# charts/kafka-cluster (Kafka + Schema-Registry, Carlos' Scope), siehe Chart.yaml-Beschreibung und
# charts/README.md.

# Namespace fuer alle Ressourcen dieses Charts - derselbe Namespace wie charts/kafka-cluster
# (Kafka), damit catalog-api den Kafka-Bootstrap-Service per kurzem In-Namespace-DNS-Namen
# erreicht (siehe catalogApi.env.kafkaBrokers unten). Zwei Helm-Releases im selben Kubernetes-
# Namespace sind unproblematisch. Wird von gitops/apps/ticketflow-app.yaml als
# destination.namespace gesetzt (CreateNamespace=true).
namespace: ticketflow

# Apicurio Registry (charts/apicurio, Namespace "kafka", ueber charts/kafka-cluster/templates/
# schema-registry/ mit den kanonischen Schemas befuellt). URL ist die vom Apicurio-Chart selbst
# gerenderte Service-DNS (Release-Name "apicurio", siehe gitops/apps/apicurio.yaml
# metadata.name) - noch nicht live gegen einen echten Sync geprueft (kein Cluster verfuegbar).
schemaRegistry:
  url: http://apicurio.kafka.svc:8080/apis/registry/v3
  groupId: ticketflow

catalogApi:
  replicas: 2

  image:
    repository: ghcr.io/engelhan/ticketflow-catalog-api
    # Git-Short-SHA, wird beim Deploy gesetzt (--set catalogApi.image.tag=<sha>), siehe P3 -
    # kein :latest im Repo.
    tag: "latest"
    pullPolicy: IfNotPresent

  service:
    port: 8080

  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 300m
      memory: 128Mi

  # -> ConfigMap (templates/catalog-api/configmap.yaml), siehe src/catalog-api/README.md
  # ## Konfiguration fuer die Bedeutung jeder Variable.
  env:
    logLevel: info
    port: "8080"
    reservationTopic: reservation-requested
    # Bootstrap-Service des Kafka-Clusters aus charts/kafka-cluster (kafka.metadata.name dort),
    # Port 9092 ist Strimzi's "plain"-Listener - seit B2 SASL_PLAINTEXT (SCRAM-Auth, siehe
    # kafkaSasl unten), Transport bleibt unverschluesselt.
    kafkaBrokers: "ticketflow-kafka-kafka-bootstrap.ticketflow.svc:9092"
    # Nur fuer Requests ausserhalb des Ingress-Pfads relevant (z.B. direkter Aufruf durch
    # load-generator) - das Frontend selbst braucht dank Same-Origin-Ingress (siehe
    # templates/frontend/ingress.yaml) kein CORS.
    corsAllowedOrigin: ""

  # B2 (Root-README ## Entscheidungen): SASL/SCRAM-SHA-512-Auth gegen die vom Strimzi User
  # Operator verwaltete KafkaUser "catalog-api" (siehe charts/kafka-cluster values.yaml
  # kafka.users) statt eines anonymen/geteilten Kafka-Zugriffs. secretName referenziert das vom
  # User Operator AUTOMATISCH angelegte Secret (Keys "password"/"sasl.jaas.config") direkt per
  # secretKeyRef - kein eigenes Secret noetig wie bei Postgres, weil catalog-api und der
  # Kafka-Cluster denselben Namespace "ticketflow" teilen (siehe values.yaml-Kommentar oben).
  kafkaSasl:
    enabled: true
    username: catalog-api
    secretName: catalog-api

  # Team-Entscheidung: die Anwendung baut sich den Connection-String selbst aus Einzelteilen
  # zusammen (siehe src/catalog-api/main.go buildDatabaseURL), statt ein fertiges DATABASE_URL-
  # Secret zu erwarten - charts/postgres-cluster liefert ohnehin nur username/password getrennt.
  # credentialsSecretName referenziert ein Secret mit den Keys "username"/"password" IM
  # NAMESPACE DIESES CHARTS (Kubernetes erlaubt kein secretKeyRef ueber Namespace-Grenzen) -
  # charts/postgres-cluster legt sein Secret aber in Namespace "application" an. Deshalb legt
  # dieser Chart selbst ein Secret an (siehe databaseSecret unten), analog zu
  # charts/notification-worker/templates/secret.yaml, statt es per Skript nachtraeglich zu
  # kopieren.
  database:
    host: "postgres-postgres-cluster-rw.application.svc.cluster.local"
    port: "5432"
    name: "postgres"
    sslMode: "require"
    credentialsSecretName: ticketflow-postgres-credentials

  # Lab-Zugangsdaten (2026-09-16, auf expliziten Wunsch direkt hier hinterlegt statt CHANGE_ME/
  # --set, da fuer diesen Kurs kein produktionsartiges Geheimnis) - muss mit
  # charts/postgres-cluster values.yaml database.owner/.password uebereinstimmen (dort ebenfalls
  # hardcoded, siehe dessen Kommentar).
  databaseSecret:
    create: true
    username: "postgres"
    password: "ticketflow"

  podDisruptionBudget:
    enabled: true
    minAvailable: 1

  serviceMonitor:
    enabled: true
    interval: 30s
    # Gleiche Annahme wie charts/notification-worker/values.yaml (nicht live verifiziert):
    # kube-prometheus-stack hat keinen expliziten serviceMonitorSelector-Override im values.yaml
    # dieses Repos -> Chart-Default "release: <helm-release-name>" (Release-Name = ArgoCD
    # Application-Name "kube-prometheus-stack"). Falls falsch: nur dieses Label anpassen.
    labels:
      release: kube-prometheus-stack

  # Weiche Verteilung ueber die drei simulierten Regionen (P4) - catalog-api ist stateless und
  # horizontal skaliert, damit ein Ausfall einer Region waehrend eines Flash Sales nicht alle
  # Replicas gleichzeitig verliert. whenUnsatisfiable: ScheduleAnyway statt DoNotSchedule, weil
  # values-dev.yaml mit replicas: 1 sonst auf einem Ein-Node-Dev-Setup haengen bleiben wuerde.
  topologySpreadConstraint:
    enabled: true
    maxSkew: 1

frontend:
  replicas: 2

  image:
    repository: ghcr.io/engelhan/ticketflow-frontend
    tag: "latest"
    pullPolicy: IfNotPresent

  service:
    port: 80

  resources:
    requests:
      cpu: 10m
      memory: 16Mi
    limits:
      cpu: 100m
      memory: 64Mi

  ingress:
    enabled: true
    # Muss innerhalb der aktivierten RFC2136-Zone liegen, siehe
    # charts/cert-manager-config/values.yaml rfc2136.zone.
    host: "ticketflow.cas438007-at-cas-dhbw-de.users.dhbw.site"
    clusterIssuerName: certificate-cluster-issuer
    tlsSecretName: ticketflow-frontend-tls

  podDisruptionBudget:
    enabled: true
    minAvailable: 1

  topologySpreadConstraint:
    enabled: true
    maxSkew: 1
