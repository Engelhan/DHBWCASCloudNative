# Zentrale, deployment-weite Werte - werden NICHT hier gepflegt, sondern in
# gitops/env/cluster.yaml (ArgoCD reicht die Datei jedem Chart per Multi-Source "$values"
# durch, siehe gitops/applicationset.yaml). Der leere Default steht hier nur, damit ein
# Rendern ohne diese Datei eine verstaendliche Fehlermeldung statt eines Nil-Pointers liefert.
# Lokal deshalb immer:
#   helm template <name> charts/<name> -f charts/<name>/values.yaml -f gitops/env/cluster.yaml
ticketflow: {}

# Gemeinsame Basiswerte fuer alle Umgebungen. dev/prod-spezifische Overrides in
# values-dev.yaml/values-prod.yaml.
#
# catalog-api + frontend (Philipps Scope) - bewusst eigener Chart, getrennt von
# charts/kafka-cluster (Kafka + Schema-Registry, Carlos' Scope), siehe Chart.yaml-Beschreibung und
# charts/README.md.
#
# Beide Komponenten folgen derselben Key-Reihenfolge wie charts/reservation-worker und
# charts/notification-worker (image, replicaCount, resources, podSecurityContext, securityContext,
# config, database/secret, service, ingress, serviceMonitor, networkPolicy, podDisruptionBudget,
# topologySpreadConstraint) - siehe charts/README.md ## Muster fuer Applikations-Charts.
#
# Der Namespace steht bewusst nicht mehr hier: ihn bestimmt die ArgoCD-Application
# (destination.namespace in gitops/applicationset.yaml), wie bei allen anderen Charts im Repo.
# Es bleibt derselbe Namespace wie charts/kafka-cluster, damit catalog-api den Kafka-Bootstrap-
# Service per kurzem In-Namespace-DNS-Namen erreicht (siehe catalogApi.config.kafkaBrokers).

catalogApi:
  # Registry und Tag kommen zentral aus gitops/env/cluster.yaml (ticketflow.imageRegistry /
  # .imageTag; das Repository wird daraus als "<registry>/ticketflow-catalog-api" gebildet).
  # Die Felder hier sind nur ein bewusster Einzelfall-Override und bleiben normalerweise leer.
  # Nie :latest (P3) - das verbietet auch values.schema.json.
  image:
    repository: ""
    tag: ""
    pullPolicy: IfNotPresent

  replicaCount: 2

  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 300m
      memory: 128Mi

  # runAsUser/runAsGroup explizit als Zahl noetig: das Image (distroless/static-debian12:nonroot)
  # setzt den Container-User nur als NAMEN ("nonroot"), Kubernetes kann Namen aber nicht aufloesen
  # und verweigert mit runAsNonRoot: true sonst den Start ("cannot verify user is non-root").
  # 65532 ist Distroless' Standard-nonroot-UID/GID, siehe src/catalog-api/Dockerfile. Identisch zu
  # charts/reservation-worker/values.yaml - fsGroup/seccompProfile fehlten hier frueher.
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    fsGroup: 65532
    seccompProfile:
      type: RuntimeDefault

  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: ["ALL"]

  # -> ConfigMap (templates/catalog-api/configmap.yaml), siehe src/catalog-api/README.md
  # ## Konfiguration fuer die Bedeutung jeder Variable.
  config:
    logLevel: info
    port: "8080"
    reservationTopic: reservation-requested
    # Bootstrap-Service des Kafka-Clusters aus charts/kafka-cluster (kafka.metadata.name dort),
    # Port 9092 ist Strimzi's "plain"-Listener - seit B2 SASL_PLAINTEXT (SCRAM-Auth, siehe
    # kafkaSasl unten), Transport bleibt unverschluesselt.
    # Leer lassen: wird aus ticketflow.kafka.clusterName + ticketflow.namespaces.kafka
    # abgeleitet - Kafka laeuft in einem eigenen Namespace (siehe gitops/env/cluster.yaml).
    kafkaBrokers: ""
    # Nur fuer Requests ausserhalb des Ingress-Pfads relevant (z.B. direkter Aufruf durch
    # load-generator) - das Frontend selbst braucht dank Same-Origin-Ingress (siehe
    # templates/frontend/ingress.yaml) kein CORS.
    corsAllowedOrigin: ""
    # Apicurio Registry (charts/apicurio, Namespace "kafka", ueber
    # charts/kafka-cluster/templates/schema-registry/ mit den kanonischen Schemas befuellt).
    # Gleiche Schluesselnamen wie in charts/reservation-worker/values.yaml config.registry*.
    # Leer lassen: wird aus ticketflow.namespaces.kafka abgeleitet.
    registryUrl: ""
    registryGroupId: "ticketflow"
    # B2 (Root-README ## Entscheidungen): SASL/SCRAM-SHA-512-Auth gegen die vom Strimzi User
    # Operator verwaltete KafkaUser "catalog-api" (siehe charts/kafka-cluster values.yaml
    # kafka.users) statt eines anonymen/geteilten Kafka-Zugriffs. secretName referenziert das vom
    # User Operator AUTOMATISCH angelegte Secret (Keys "password"/"sasl.jaas.config") direkt per
    # secretKeyRef - kein eigenes Secret noetig wie bei Postgres, weil catalog-api und der
    # Kafka-Cluster denselben Namespace teilen.
    kafkaSasl:
      enabled: true
      username: catalog-api
      secretName: catalog-api

  # Team-Entscheidung: die Anwendung baut sich den Connection-String selbst aus Einzelteilen
  # zusammen (siehe src/catalog-api/main.go buildDatabaseURL), statt ein fertiges DATABASE_URL-
  # Secret zu erwarten - charts/postgres-cluster liefert ohnehin nur username/password getrennt.
  # Die Anwendung baut ihren Connection-String selbst aus diesen Einzelteilen + dem Secret
  # zusammen (Team-Entscheidung, siehe src/*/README.md ## Konfiguration). host/name leer lassen:
  # beide werden aus ticketflow.postgres.databaseName abgeleitet, weil die Datenbank im selben
  # Namespace laeuft (gitops/env/cluster.yaml -> ticketflow.namespaces.app).
  # credentialsSecretName zeigt per Default auf das von charts/postgres-cluster erzeugte Secret
  # "<databaseName>-postgres-user" (Keys username/password) - kein chart-eigenes Duplikat mehr.
  # Die Anwendung baut ihren Connection-String selbst aus diesen Einzelteilen + dem Secret
  # zusammen (Team-Entscheidung, siehe src/*/README.md ## Konfiguration). host/name leer lassen:
  # beide werden aus ticketflow.postgres.databaseName abgeleitet, weil die Datenbank im selben
  # Namespace laeuft (gitops/env/cluster.yaml -> ticketflow.namespaces.app).
  # credentialsSecretName zeigt per Default auf das von charts/postgres-cluster erzeugte Secret
  # "<databaseName>-postgres-user" (Keys username/password) - kein chart-eigenes Duplikat mehr.
  database:
    host: ""
    port: "5432"
    name: ""
    sslMode: "require"
    credentialsSecretName: ""

  service:
    port: 8080

  serviceMonitor:
    enabled: true
    interval: 30s
    # Gleiche Annahme wie charts/notification-worker/values.yaml (nicht live verifiziert):
    # kube-prometheus-stack hat keinen expliziten serviceMonitorSelector-Override im values.yaml
    # dieses Repos -> Chart-Default "release: <helm-release-name>" (Release-Name = ArgoCD
    # Application-Name "kube-prometheus-stack"). Falls falsch: nur dieses Label anpassen.
    labels:
      release: kube-prometheus-stack

  # Default aus, wie im Repo sonst ueblich (siehe charts/README.md). Vor dem Aktivieren die
  # gerenderte Policy pruefen - ein leerer podSelector wuerde alle Pods im geteilten Namespace
  # treffen (dokumentierter Loki-Vorfall).
  networkPolicy:
    enabled: false

  podDisruptionBudget:
    enabled: true
    minAvailable: 1

  # Weiche Verteilung ueber die drei simulierten Regionen (P4) - catalog-api ist stateless und
  # horizontal skaliert, damit ein Ausfall einer Region waehrend eines Flash Sales nicht alle
  # Replicas gleichzeitig verliert. whenUnsatisfiable: ScheduleAnyway statt DoNotSchedule, weil
  # values-dev.yaml mit replicaCount: 1 sonst auf einem Ein-Node-Dev-Setup haengen bleiben wuerde.
  topologySpreadConstraint:
    enabled: true
    maxSkew: 1

frontend:
  # Siehe catalogApi.image - Registry/Tag kommen zentral, Repository wird als
  # "<registry>/ticketflow-frontend" gebildet.
  image:
    repository: ""
    tag: ""
    pullPolicy: IfNotPresent

  replicaCount: 2

  resources:
    requests:
      cpu: 10m
      memory: 16Mi
    limits:
      cpu: 100m
      memory: 64Mi

  # Bewusst leer: nginx:1.27-alpine startet als root (bindet Port 80, schreibt PID-File) und
  # delegiert die Worker-Prozesse intern an den nginx-User. runAsNonRoot waere hier also nicht
  # erfuellbar - dieselbe Art dokumentierter, begruendeter Ausnahme wie Longhorn, siehe
  # charts/README.md ## Resource-Limits, Security-Context, NetworkPolicy.
  podSecurityContext: {}

  # Aus demselben Grund kein readOnlyRootFilesystem/capabilities-drop - nginx schreibt zur
  # Laufzeit in /var/cache/nginx und /var/run.
  securityContext:
    allowPrivilegeEscalation: false

  service:
    port: 80

  ingress:
    enabled: true
    # Leer lassen: der Host wird als "ticketflow.<ticketflow.dnsZone>" aus gitops/env/cluster.yaml
    # abgeleitet und liegt damit automatisch innerhalb der aktivierten RFC2136-Zone.
    host: ""
    className: traefik
    clusterIssuerName: certificate-cluster-issuer
    tlsSecretName: ticketflow-frontend-tls

  networkPolicy:
    enabled: false

  podDisruptionBudget:
    enabled: true
    minAvailable: 1

  topologySpreadConstraint:
    enabled: true
    maxSkew: 1
