# Set via gitops/env/cluster.yaml; empty default only for a readable error.
ticketflow: {}

# catalog-api + frontend; separate from charts/kafka-cluster on purpose.

catalogApi:
  # Empty: <registry>/ticketflow-catalog-api with the central tag. Never :latest (P3).
  image:
    repository: ""
    tag: ""
    pullPolicy: IfNotPresent

  replicaCount: 2

  # I/O-bound Go binary; the limit leaves headroom for schema validation during bursts.
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 300m
      memory: 128Mi

  # Numeric UID needed: distroless sets the user by name, which runAsNonRoot can't verify.
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    fsGroup: 65532
    seccompProfile:
      type: RuntimeDefault

  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: ["ALL"]

  # ConfigMap, see src/catalog-api/README.md.
  config:
    logLevel: info
    port: "8080"
    reservationTopic: reservation-requested
    # Empty = derived (SASL listener 9092).
    kafkaBrokers: ""
    # Only for calls outside the same-origin Ingress (e.g. load generator).
    corsAllowedOrigin: ""
    # Empty = derived from ticketflow.namespaces.kafka.
    registryUrl: ""
    registryGroupId: "ticketflow"
    # B2: SCRAM as KafkaUser catalog-api; secret created by Strimzi.
    kafkaSasl:
      enabled: true
      username: catalog-api
      secretName: catalog-api

  # The app builds its DSN from these parts + the secret. Empty host/name/secret = derived from
  # ticketflow.postgres.databaseName (CNPG's <db>-postgres-cluster-app, not via OpenBao).
  database:
    host: ""
    port: "5432"
    name: ""
    sslMode: "require"
    credentialsSecretName: ""

  service:
    port: 8080

  # Off: no Prometheus in the cluster.
  serviceMonitor:
    enabled: false
    interval: 30s
    labels:
      release: kube-prometheus-stack

  podDisruptionBudget:
    enabled: true
    minAvailable: 1

  # P4: hard spread across regions (needs >= 2 labeled nodes).
  topologySpreadConstraint:
    enabled: true
    maxSkew: 1

frontend:
  # Empty: <registry>/ticketflow-frontend with the central tag.
  image:
    repository: ""
    tag: ""
    pullPolicy: IfNotPresent

  replicaCount: 2

  # Static files only; the limit covers many parallel page loads at sale start.
  resources:
    requests:
      cpu: 10m
      memory: 16Mi
    limits:
      cpu: 100m
      memory: 64Mi

  # Empty: nginx starts as root (port 80, PID file), so runAsNonRoot is impossible.
  podSecurityContext: {}

  # nginx writes to /var/cache/nginx and /var/run.
  securityContext:
    allowPrivilegeEscalation: false

  service:
    port: 80

  ingress:
    enabled: true
    # Empty = ticketflow.<dnsZone>.
    host: ""
    className: traefik
    clusterIssuerName: certificate-cluster-issuer
    tlsSecretName: ticketflow-frontend-tls

  podDisruptionBudget:
    enabled: true
    minAvailable: 1

  topologySpreadConstraint:
    enabled: true
    maxSkew: 1
