# Init/unseal/configure/seed OpenBao on every sync (idempotent: reuses an existing
# openbao-unseal-keys secret). Reaches each pod via the headless service; pod list from
# .Values.openbao.server.ha.replicas.
apiVersion: batch/v1
kind: Job
metadata:
  name: openbao-bootstrap
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        app: openbao-bootstrap
    spec:
      restartPolicy: Never
      serviceAccountName: openbao-bootstrap
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: bootstrap
          image: {{ .Values.bootstrapJob.image | quote }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            {{- toYaml .Values.bootstrapJob.resources | nindent 12 }}
          env:
            - name: EXTERNAL_SECRETS_NAMESPACE
              value: {{ .Values.externalSecretsNamespace | quote }}
          command:
            - /bin/sh
            - -c
            - |
              set -eu

              # BusyBox wget instead of curl: apk can't install packages here. wget only does
              # GET/POST, which
              # is enough (the secret is only created, never updated).
              export SSL_CERT_FILE=/var/run/secrets/kubernetes.io/serviceaccount/ca.crt

              NAMESPACE="$(cat /var/run/secrets/kubernetes.io/serviceaccount/namespace)"
              TOKEN="$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)"
              APISERVER=https://kubernetes.default.svc

              # Logs every step, never key/token values.
              echo "Start: NAMESPACE=$NAMESPACE"

              # Errors go to stderr (pod log), the response to stdout.
              kubeapi_get() {
                wget -qO- --header "Authorization: Bearer $TOKEN" "$APISERVER$1"
              }
              kubeapi_post() {
                wget -qO- --header "Authorization: Bearer $TOKEN" \
                  --header "Content-Type: application/json" --post-data "$2" \
                  "$APISERVER$1"
              }

              HEADLESS="openbao-internal"
              {{ $replicas := .Values.openbao.server.ha.replicas | int }}
              # Pod list from .Values.openbao.server.ha.replicas; a scale change re-runs this hook.
              PODS="{{ range $i := until $replicas }}openbao-{{ $i }} {{ end }}"
              echo "pod list: PODS=[$PODS] (from .Values.openbao.server.ha.replicas={{ $replicas }})"

              # bao status: 0 = unsealed, 2 = sealed (reachable), 1 = error. Only 1 means wait.
              # "|| rc=$?" keeps set -e from aborting.
              wait_for_pod() {
                pod="$1"
                while true; do
                  BAO_ADDR="http://$pod.$HEADLESS.$NAMESPACE.svc:8200" bao status >/dev/null 2>&1 && rc=0 || rc=$?
                  [ "$rc" -ne 1 ] && break
                  echo "waiting for $pod (bao status exit=$rc)..."
                  sleep 3
                done
                echo "$pod reachable (bao status exit=$rc)"
              }
              for p in $PODS; do wait_for_pod "$p"; done

              export BAO_ADDR="http://openbao-0.$HEADLESS.$NAMESPACE.svc:8200"

              # JSON has spaces after colons - patterns allow [[:space:]]*.
              EXISTING="$(kubeapi_get "/api/v1/namespaces/$NAMESPACE/secrets/openbao-unseal-keys" || true)"
              echo "read existing secret: $(printf '%s' "$EXISTING" | wc -c) bytes"
              UNSEAL_KEY="$(echo "$EXISTING" | grep -o '"key1"[[:space:]]*:[[:space:]]*"[^"]*"' | grep -o '"[^"]*"' | tail -1 | tr -d '"' | { base64 -d 2>/dev/null || true; })"
              ROOT_TOKEN="$(echo "$EXISTING" | grep -o '"root_token"[[:space:]]*:[[:space:]]*"[^"]*"' | grep -o '"[^"]*"' | tail -1 | tr -d '"' | { base64 -d 2>/dev/null || true; })"
              echo "extracted: UNSEAL_KEY ${#UNSEAL_KEY} chars, ROOT_TOKEN ${#ROOT_TOKEN} chars (0 = not found/empty)"

              STATUS_RAW="$(bao status -format=json 2>&1 || true)"
              INITIALIZED="$(echo "$STATUS_RAW" | grep -o '"initialized"[[:space:]]*:[[:space:]]*[a-z]*' | grep -o '[a-z]*$' || echo false)"
              # Contains no key material.
              echo "bao status before bootstrap: $(printf '%s' "$STATUS_RAW" | tr '\n' ' ')"
              echo "parsed: INITIALIZED=$INITIALIZED"

              if [ "$INITIALIZED" != "true" ]; then
                echo "initializing OpenBao (Shamir 1-of-1, deliberate lab simplification)..."
                if INIT_OUTPUT="$(bao operator init -key-shares=1 -key-threshold=1 -format=json 2>&1)"; then
                  echo "bao operator init succeeded, response: $(printf '%s' "$INIT_OUTPUT" | wc -c) bytes"
                else
                  echo "ERROR: bao operator init failed - output: $INIT_OUTPUT" >&2
                  INIT_OUTPUT=""
                fi
                # init output is multi-line JSON; join lines before matching.
                INIT_OUTPUT_FLAT="$(printf '%s' "$INIT_OUTPUT" | tr '\n' ' ')"
                UNSEAL_KEY="$(echo "$INIT_OUTPUT_FLAT" | grep -o '"unseal_keys_b64"[[:space:]]*:[[:space:]]*\[[^]]*\]' | grep -o '"[^"]*"' | tail -1 | tr -d '"')"
                ROOT_TOKEN="$(echo "$INIT_OUTPUT_FLAT" | grep -o '"root_token"[[:space:]]*:[[:space:]]*"[^"]*"' | grep -o '"[^"]*"' | tail -1 | tr -d '"')"
                echo "extracted from init response: UNSEAL_KEY ${#UNSEAL_KEY} chars, ROOT_TOKEN ${#ROOT_TOKEN} chars"

                UNSEAL_KEY_B64="$(printf '%s' "$UNSEAL_KEY" | base64 | tr -d '\n')"
                ROOT_TOKEN_B64="$(printf '%s' "$ROOT_TOKEN" | base64 | tr -d '\n')"
                SECRET_JSON="{\"apiVersion\":\"v1\",\"kind\":\"Secret\",\"metadata\":{\"name\":\"openbao-unseal-keys\"},\"data\":{\"key1\":\"$UNSEAL_KEY_B64\",\"root_token\":\"$ROOT_TOKEN_B64\"}}"
                # Create only (wget can't PATCH). Retries: right after a sync RBAC may not be ready
                # yet, and a
                # lost write means a lost unseal key.
                write_ok=0
                write_attempt=0
                for _ in 1 2 3 4 5; do
                  write_attempt=$((write_attempt + 1))
                  if WRITE_RESPONSE="$(kubeapi_post "/api/v1/namespaces/$NAMESPACE/secrets" "$SECRET_JSON" 2>&1)"; then
                    write_ok=1
                    echo "created secret openbao-unseal-keys (attempt $write_attempt)"
                    break
                  fi
                  echo "attempt $write_attempt to create secret openbao-unseal-keys failed: $WRITE_RESPONSE" >&2
                  sleep 3
                done
                [ "$write_ok" -eq 1 ] \
                  || echo "WARNING: could not create secret openbao-unseal-keys after $write_attempt attempts - the auto-unseal sidecar will have no key after a pod restart" >&2
              fi

              if [ -z "$UNSEAL_KEY" ]; then
                echo "ERROR: no unseal key known (neither initialized nor found in the secret) - manual intervention needed" >&2
                exit 1
              fi

              echo "unsealing all instances..."
              for p in $PODS; do
                if UNSEAL_RESULT="$(BAO_ADDR="http://$p.$HEADLESS.$NAMESPACE.svc:8200" bao operator unseal "$UNSEAL_KEY" 2>&1)"; then
                  echo "$p unsealed"
                else
                  echo "unsealing $p failed: $UNSEAL_RESULT" >&2
                fi
              done

              if [ -z "$ROOT_TOKEN" ]; then
                echo "no root token known (secret probably edited by hand) - skipping KV/auth/policy setup" >&2
                exit 0
              fi

              export BAO_TOKEN="$ROOT_TOKEN"

              echo "enabling KV v2 engine..."
              bao secrets enable -path=secret kv-v2 2>&1 | grep -v "already in use" || true
              echo "enabling Kubernetes auth method..."
              bao auth enable kubernetes 2>&1 | grep -v "already enabled" || true
              bao write auth/kubernetes/config kubernetes_host="https://kubernetes.default.svc:443" >/dev/null

              # No heredoc (block-scalar indentation breaks the terminator).
              # PushSecret needs create/read/update on data and metadata.
              printf 'path "secret/data/*" {\n  capabilities = ["create", "read", "update"]\n}\npath "secret/metadata/*" {\n  capabilities = ["create", "read", "update", "list"]\n}\n' > /tmp/external-secrets-policy.hcl
              bao policy write external-secrets /tmp/external-secrets-policy.hcl >/dev/null

              bao write auth/kubernetes/role/external-secrets \
                bound_service_account_names=external-secrets \
                bound_service_account_namespaces="$EXTERNAL_SECRETS_NAMESPACE" \
                policies=external-secrets \
                ttl=1h >/dev/null

              genpass() { head -c 32 /dev/urandom | base64 | tr -dc 'A-Za-z0-9' | head -c 32; }

              seed_if_missing() {
                path="$1"; shift
                if ! bao kv get "$path" >/dev/null 2>&1; then
                  echo "seeding $path..."
                  bao kv put "$path" "$@" >/dev/null
                fi
              }

              # Credentials no operator generates. Kafka/Postgres credentials are pushed in by
              # PushSecrets.
              seed_if_missing secret/akhq/basic-auth password="$(genpass)"
              # Shared AKHQ JWT key; 64 chars > 256 bits required for HS256.
              seed_if_missing secret/akhq/jwt secret="$(genpass)$(genpass)"
              seed_if_missing secret/notification-worker/smtp username="" password=""
              seed_if_missing secret/notification-worker/kafka-tls ca-cert="" client-cert="" client-key=""

              echo "OpenBao bootstrap complete"
