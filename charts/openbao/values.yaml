# Set via gitops/env/cluster.yaml; empty default only for a readable error.
ticketflow: {}

# Must match ticketflow.namespaces.openbao (values files aren't templated).
openbaoNamespace: openbao

# Must match ticketflow.namespaces.externalSecrets.
externalSecretsNamespace: external-secrets

# Upstream values (dependency alias).
openbao:
  injector:
    # ESO is the only secret delivery mechanism.
    enabled: false

  csi:
    enabled: false

  server:
    image:
      # Without registry prefix (set separately).
      repository: openbao/openbao
      # No "v" prefix: the quay.io tags differ from Chart.AppVersion.
      tag: "2.6.2"

    resources:
      requests:
        cpu: 250m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi

    # State lives in PostgreSQL, no PVCs.
    dataStorage:
      enabled: false

    ha:
      enabled: true
      replicas: 3
      raft:
        # PostgreSQL storage (HA-capable), reusing CNPG instead of a third storage system.
        enabled: false
      # connection_url comes from BAO_PG_CONNECTION_URL (no password in this file).
      config: |
        ui = true

        listener "tcp" {
          tls_disable = 1
          address = "[::]:8200"
          cluster_address = "[::]:8201"
        }

        storage "postgresql" {
          table      = "openbao_kv_store"
          ha_enabled = "true"
          ha_table   = "openbao_ha_locks"
        }

        # Labels the active pod for the openbao-active service.
        service_registration "kubernetes" {}

    # CNPG-generated secret of charts/openbao-postgres (literal: values aren't templated).
    extraSecretEnvironmentVars:
      - envName: BAO_PG_CONNECTION_URL
        secretName: openbao-vault-postgres-cluster-app
        secretKey: uri

    # P4: one replica per region.
    topologySpreadConstraints: |
      - maxSkew: 1
        topologyKey: topology.ticketflow/region
        whenUnsatisfiable: DoNotSchedule
        labelSelector:
          matchLabels:
            app.kubernetes.io/name: openbao
            app.kubernetes.io/instance: openbao
            component: server

    # Auto-unseal sidecar: unseals a restarted pod with the key from the mounted secret.
    extraContainers:
      - name: auto-unseal
        image: "quay.io/openbao/openbao:2.6.2"
        command: ["/bin/sh", "-c"]
        args:
          - |
            set -eu
            export BAO_ADDR="http://127.0.0.1:8200"
            while true; do
              STATUS=$(bao status -format=json 2>/dev/null || true)
              # Status JSON has a space after the colon.
              SEALED=$(echo "$STATUS" | grep -o '"sealed": *[a-z]*' | tr -d ' ' | cut -d: -f2)
              if [ "$SEALED" = "true" ] && [ -f /openbao/unseal-keys/key1 ]; then
                bao operator unseal "$(cat /openbao/unseal-keys/key1)" || true
              fi
              sleep 10
            done
        volumeMounts:
          - name: unseal-keys
            mountPath: /openbao/unseal-keys
            readOnly: true
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            cpu: 50m
            memory: 32Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]

    volumes:
      - name: unseal-keys
        secret:
          # Optional: created by the bootstrap job after the first run.
          secretName: openbao-unseal-keys
          optional: true

    serviceAccount:
      # Needed for service_registration.
      create: true

    # HTTP health with sealed/uninit = 200: a sealed pod must turn Ready, or ArgoCD never runs the
    # unseal hook. Routing uses the openbao-active label, not readiness.
    readinessProbe:
      path: "/v1/sys/health?standbyok=true&sealedcode=200&uninitcode=200"

    # NetworkPolicies come from charts/network-policies.
    networkPolicy:
      enabled: false

# Own Ingress; host is always openbao.<dnsZone>.
ingress:
  className: traefik
  clusterIssuerName: certificate-cluster-issuer
  tlsSecretName: openbao-tls

# Bootstrap job (our template, outside the upstream alias).
bootstrapJob:
  image: "quay.io/openbao/openbao:2.6.2"
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 128Mi
