# Muss unter dem Dependency-Alias "kube-prometheus-stack" verschachtelt sein (siehe Chart.yaml),
# damit Helm die Werte an das gewrappte Upstream-Chart durchreicht. Persistenz ueberall via
# Longhorn (bereits Default-StorageClass, siehe charts/longhorn/values.yaml
# persistence.defaultClass) - storageClassName trotzdem explizit gesetzt statt implizit auf den
# Default zu vertrauen. Werte-Groessen bewusst klein gehalten fuer die kleinen Lab-VMs, nicht
# fuer echtes Produktions-Metrikvolumen.
kube-prometheus-stack:
  prometheus:
    prometheusSpec:
      retention: 7d
      storageSpec:
        volumeClaimTemplate:
          spec:
            storageClassName: longhorn
            accessModes: ["ReadWriteOnce"]
            resources:
              requests:
                storage: 20Gi
      # securityContext/containerSecurityContext (alertmanagerSpec/prometheusSpec-Ebene) sind
      # bereits Chart-Default gehaertet (runAsNonRoot, readOnlyRootFilesystem, capabilities
      # drop ALL, seccompProfile RuntimeDefault) - kein Override noetig.
      resources:
        requests:
          cpu: 250m
          memory: 512Mi
        limits:
          cpu: 1000m
          memory: 1Gi
    # Chart-eigene NetworkPolicy mit sinnvollen Default-Regeln - nicht auf konkrete
    # Pod-/Namespace-Selektoren verengt, siehe cert-manager/values.yaml fuer die Begruendung
    # (charts/kafka-cluster existiert noch nicht, genaue Cross-Namespace-Scrape-Ziele stehen noch
    # nicht fest).
    networkPolicy:
      enabled: true

  alertmanager:
    alertmanagerSpec:
      storage:
        volumeClaimTemplate:
          spec:
            storageClassName: longhorn
            accessModes: ["ReadWriteOnce"]
            resources:
              requests:
                storage: 2Gi
      resources:
        requests:
          cpu: 25m
          memory: 64Mi
        limits:
          cpu: 100m
          memory: 128Mi
    networkPolicy:
      enabled: true

  grafana:
    persistence:
      enabled: true
      storageClassName: longhorn
      size: 5Gi
    # Chart-Default (RollingUpdate) deadlockt mit einer einzelnen ReadWriteOnce-PVC bei jeder
    # Aenderung am Pod-Template (z.B. den resources/networkPolicy-Werten hier): der neue Pod
    # kann die PVC nicht attachen, solange der alte sie noch haelt ("Multi-Attach error"), aber
    # Kubernetes killt den alten Pod erst, wenn der neue Ready ist - klassischer Deadlock, live
    # beobachtet nach einem harmlosen resources-Update. Recreate terminiert den alten Pod zuerst
    # (kurzer Grafana-Downtime beim Rollout, hier unkritisch) statt beide gleichzeitig um dieselbe
    # Volume-Exklusivitaet konkurrieren zu lassen.
    deploymentStrategy:
      type: Recreate
    # securityContext/containerSecurityContext sind bereits Chart-Default gehaertet - kein
    # Override noetig.
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 250m
        memory: 256Mi
    networkPolicy:
      enabled: true
    # Loki/Tempo als zusaetzliche Datasources neben dem vom Chart selbst angelegten
    # Prometheus/Alertmanager-Datasource (siehe grafana.sidecar.datasources, Chart-Default) -
    # zusammen ergibt das den vollen LGTM-Stack (Logs/Grafana/Tempo/Metrics) in EINEM Grafana.
    # Service-Namen ergeben sich aus fullnameOverride in charts/loki bzw. charts/tempo.
    additionalDataSources:
      - name: Loki
        type: loki
        uid: loki
        access: proxy
        url: http://loki-gateway.monitoring.svc.cluster.local
        isDefault: false
      - name: Tempo
        type: tempo
        uid: tempo
        access: proxy
        url: http://tempo.monitoring.svc.cluster.local:3200
        isDefault: false
        jsonData:
          # Traces->Logs-Verknuepfung im Grafana-UI (Tempo-Trace-View kann direkt zu
          # passenden Loki-Log-Zeilen springen).
          tracesToLogsV2:
            datasourceUid: loki
          # Service-Graph aus Tempo-Spans gegen Prometheus-Metriken.
          serviceMap:
            datasourceUid: prometheus

  prometheusOperator:
    # securityContext/containerSecurityContext sind bereits Chart-Default gehaertet - kein
    # Override noetig.
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 250m
        memory: 256Mi
    networkPolicy:
      enabled: true

  # node-exporter braucht zwangslaeufig hostNetwork/hostPID/hostPath (liest /proc, /sys vom
  # Host fuer Node-Metriken) - kein weiteres Haerten darueber hinaus moeglich/sinnvoll.
  # securityContext/containerSecurityContext sind trotzdem bereits Chart-Default gehaertet
  # (runAsNonRoot, readOnlyRootFilesystem). Kein natives networkPolicy-Feld im Chart.
  prometheus-node-exporter:
    resources:
      requests:
        cpu: 25m
        memory: 32Mi
      limits:
        cpu: 100m
        memory: 64Mi

  # securityContext ist bereits Chart-Default gehaertet - kein Override noetig. Kein natives
  # networkPolicy-Feld im Chart.
  kube-state-metrics:
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        cpu: 100m
        memory: 128Mi
