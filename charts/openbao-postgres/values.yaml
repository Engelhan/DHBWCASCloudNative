# Set via gitops/env/cluster.yaml; empty default only for a readable error.
ticketflow: {}

instances: 2
# Namespace comes from the ArgoCD Application.

image:
  # Container image repository used by CloudNativePG.
  repository: ghcr.io/cloudnative-pg/postgresql
  pullPolicy: IfNotPresent
  pullSecret: ""
  # PostgreSQL image tag.
  tag: "18.4-202608030910-standard-trixie@sha256:f0cc49632b5cc1e51f65ba03658c89bd31d64ea2672b14843a808a8d281417e1"

database:
  # App user role; CNPG generates the password.
  owner: openbao
  primaryUpdateMethod: switchover
  primaryUpdateStrategy: supervised
  postgresql:
    parameters:
      # Small: only OpenBao's KV data and HA lock.
      shared_buffers: 256MB
      effective_cache_size: 512MB
      work_mem: 4MB
      max_connections: "50"
    extraParameters:
      # Caps WAL held by a lost replica's slot; otherwise OpenBao's HA-lock writes fill the volume.
      max_slot_wal_keep_size: 1GB
    pg_hba: [ ]

# Optional backup configuration (off).
backup:
  enabled: false
  restoreFromBackup: false
  restoreBackupFolderName: postgres-backup-restore-source
  timestampToRestoreFrom: "2023-08-11 11:14:21.00000+02"
  s3:
    destinationPath: s3://example-backup-bucket/openbao-postgres
    endpointURL: https://s3.example.com/
    backupFolderName: openbao-postgres-backup
    accessKey: CHANGE_ME
    secretKey: CHANGE_ME
  retentionPolicy: 7d
  schedule: "0 0 3 * * *"

# Optional import configuration. Enable it to bootstrap from an existing database.
import:
  enabled: false
  server: postgres.example.svc.cluster.local
  user: postgres
  databaseToImport: postgres
  password: CHANGE_ME

affinity:
  podAntiAffinityType: required
  # P4: primary and replica in different regions.
  topologyKey: topology.ticketflow/region

storage:
  storageClass: longhorn
  # Room for wal_keep_size + max_slot_wal_keep_size; Longhorn supports expansion.
  size: 8Gi

resources:
  requests:
    memory: 512Mi
  limits:
    memory: 512Mi
    cpu: "1"

# Off: no Prometheus in the cluster.
monitoring: false

podMonitor:
  labels:
    release: kube-prometheus-stack
