{{- if eq .Values.monitoring true }}
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: "{{ include "openbao-postgres.clusterName" . }}"
  # Required by the Prometheus podMonitorSelector.
  labels:
    {{- toYaml .Values.podMonitor.labels | nindent 4 }}
spec:
  podMetricsEndpoints:
    - port: metrics
  selector:
    matchLabels:
      cnpg.io/cluster: "{{ include "openbao-postgres.clusterName" . }}"
{{- end }}
