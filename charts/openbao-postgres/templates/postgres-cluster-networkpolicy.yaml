# this Policy allows the apiserver proxy to talk to the database
# is required to use the kubectl-cnpg plugin status command
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: "allow-apiserver-to-{{ include "openbao-postgres.clusterName" . }}"
spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: {{ include "openbao-postgres.clusterName" . }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cnpg-system
      ports:
        - port: 8000
          protocol: TCP
    - from:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - port: 8000
          protocol: TCP
    # allows postgres traffic (streaming replication, client connections) between
    # the cluster's own pods (primary, replicas, join pods)
    - from:
        - podSelector:
            matchLabels:
              cnpg.io/cluster: {{ include "openbao-postgres.clusterName" . }}
      ports:
        - port: 5432
          protocol: TCP
    # Analog zu charts/postgres-cluster's gleichnamiger Regel, aber fuer den Namespace "openbao"
    # statt "ticketflow" - hier ist OpenBao selbst der einzige echte Client (liest sein Storage-
    # Backend-Credential aus dem CNPG-generierten "<clusterName>-app"-Secret, siehe _helpers.tpl).
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ include "openbao-postgres.namespace" . }}
      ports:
        - port: 5432
          protocol: TCP
