# this Policy allows the apiserver proxy to talk to the database
# is required to use the kubectl-cnpg plugin status command
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: "allow-apiserver-to-{{ include "postgres-cluster.clusterName" . }}"
spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: {{ include "postgres-cluster.clusterName" . }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cnpg-system
      ports:
        - port: 8000
          protocol: TCP
    - from:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - port: 8000
          protocol: TCP
    # allows postgres traffic (streaming replication, client connections) between
    # the cluster's own pods (primary, replicas, join pods)
    - from:
        - podSelector:
            matchLabels:
              cnpg.io/cluster: {{ include "postgres-cluster.clusterName" . }}
      ports:
        - port: 5432
          protocol: TCP
    # This policy is CNPG's own reference example (see comment at the top of this file) for
    # letting `kubectl-cnpg status` reach the instance manager's API (port 8000) plus internal
    # replication (port 5432 between the cluster's own pods) - it was never meant to be the ONLY
    # policy governing Postgres access. Once any NetworkPolicy selects a pod, Kubernetes denies
    # all ingress not explicitly allowed, so without this rule every real client
    # (catalog-api/reservation-worker/notification-worker in namespace "ticketflow") got a bare
    # TCP "connection refused" on 5432 - confirmed live: even a debug pod in the SAME namespace
    # as this Postgres cluster, on the SAME node, was refused, while a shell inside the CNPG pod
    # itself (which carries the cnpg.io/cluster label above) could connect fine. Symptom was
    # catalog-api/reservation-worker crashlooping on "database migration failed ... dial tcp
    # ...: connect: connection refused" against the real, healthy postgres-postgres-cluster-rw
    # service.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ticketflow
      ports:
        - port: 5432
          protocol: TCP