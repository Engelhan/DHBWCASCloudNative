# B1 (Root-README ## Bonus): spiegelt das von CNPG selbst generierte App-User-Credential
# (postgres-cluster.appSecretName, siehe postgres-cluster.yaml - bootstrap.initdb hat bewusst
# kein eigenes secret-Feld mehr) nach OpenBao. templates/postgres-user-secret.yaml synct es von
# dort unter dem konventionellen Namen zurueck - catalog-api/reservation-worker aendern sich
# dadurch nicht. Zweck ist NICHT das Ueberbruecken einer Namespace-Grenze (Quelle und Ziel liegen
# im selben Namespace), sondern die von Root-README ## Bonus B1 versprochene zentrale
# Audit-Flaeche: auch operator-generierte Credentials sollen in OpenBao inspizierbar sein.
#
# updatePolicy: IfNotExists - CNPG generiert dieses Credential genau einmal beim allerersten
# Cluster-Bootstrap und rotiert es danach nicht von selbst.
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: "{{ include "postgres-cluster.databaseName" . }}-postgres-user-to-openbao"
spec:
  updatePolicy: IfNotExists
  secretStoreRefs:
    - name: openbao
      kind: ClusterSecretStore
  selector:
    secret:
      name: "{{ include "postgres-cluster.appSecretName" . }}"
  data:
    - match:
        secretKey: username
        remoteRef:
          remoteKey: postgres/app-user
          property: username
    - match:
        secretKey: password
        remoteRef:
          remoteKey: postgres/app-user
          property: password
