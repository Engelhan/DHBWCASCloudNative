# B1: audit copy of the CNPG credential in OpenBao. Nothing reads it back. Replace keeps it
# current after a rebuild.
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: "{{ include "postgres-cluster.databaseName" . }}-postgres-user-to-openbao"
spec:
  updatePolicy: Replace
  secretStoreRefs:
    - name: openbao
      kind: ClusterSecretStore
  selector:
    secret:
      name: "{{ include "postgres-cluster.appSecretName" . }}"
  data:
    - match:
        secretKey: username
        remoteRef:
          remoteKey: postgres/app-user
          property: username
    - match:
        secretKey: password
        remoteRef:
          remoteKey: postgres/app-user
          property: password
