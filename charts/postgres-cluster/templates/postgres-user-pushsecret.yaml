# B1 (Root-README ## Bonus): spiegelt das von CNPG selbst generierte App-User-Credential
# (postgres-cluster.appSecretName, siehe postgres-cluster.yaml - bootstrap.initdb hat bewusst
# kein eigenes secret-Feld) nach OpenBao. Reine Audit-Kopie - die von Root-README ## Bonus B1
# versprochene zentrale Audit-Flaeche: auch operator-generierte Credentials sollen in OpenBao
# inspizierbar sein. Niemand liest von dort zurueck: catalog-api/reservation-worker nehmen das
# CNPG-Secret direkt (selber Namespace), damit ihre Datenbank-Zugangsdaten nicht von einem
# entsiegelten OpenBao abhaengen.
#
# updatePolicy: Replace - die Kopie folgt dem echten Wert. Mit IfNotExists behielte OpenBao nach
# einem Neuaufbau des CNPG-Clusters (neues generiertes Passwort) still das alte.
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: "{{ include "postgres-cluster.databaseName" . }}-postgres-user-to-openbao"
spec:
  updatePolicy: Replace
  secretStoreRefs:
    - name: openbao
      kind: ClusterSecretStore
  selector:
    secret:
      name: "{{ include "postgres-cluster.appSecretName" . }}"
  data:
    - match:
        secretKey: username
        remoteRef:
          remoteKey: postgres/app-user
          property: username
    - match:
        secretKey: password
        remoteRef:
          remoteKey: postgres/app-user
          property: password
