{{- $backup := .Values.backup | default dict -}}
{{- if eq $backup.enabled true }}
apiVersion: v1
kind: Secret
metadata:
  name: "s3-{{ $.Values.database.name }}-backup-creds"
  namespace: {{ $.Values.namespace | default $.Release.Namespace }}
type: Opaque
stringData:
  ACCESS_KEY: {{ $backup.s3.accessKey | quote }}
  SECRET_KEY: {{ $backup.s3.secretKey | quote }}
{{- end }}
