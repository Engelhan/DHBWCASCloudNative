{{- $import := .Values.import | default dict -}}
{{- if eq $import.enabled true }}
apiVersion: v1
kind: Secret
metadata:
  name: "{{ $.Values.database.name }}-import-password"
  namespace: {{ $.Values.namespace | default $.Release.Namespace }}
type: kubernetes.io/basic-auth
stringData:
  password: {{ $import.password | quote }}
{{- end }}