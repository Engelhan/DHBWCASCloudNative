# Vorher ein chart-eigenes Secret mit hardcodiertem Klartext-Passwort aus values.yaml - jetzt ein
# ExternalSecret, das denselben Namen/dieselben Keys aus OpenBao synct (Root-README ## Bonus B1).
# Zielobjekt bleibt byte-identisch zu vorher: catalog-api/reservation-worker (secretKeyRef)
# aendern sich nicht. KV-Pfad "postgres/app-user" wird seit 2026-09-23 NICHT mehr vom
# Bootstrap-Job zufaellig generiert, sondern von templates/postgres-user-pushsecret.yaml aus dem
# von CNPG selbst erzeugten Credential gespiegelt (postgres-cluster.yaml laesst
# bootstrap.initdb.secret bewusst weg) - dieses Secret hier ist der Rueckweg aus OpenBao unter
# dem konventionellen Namen.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: "{{ include "postgres-cluster.userSecretName" . }}"
spec:
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  refreshInterval: 1h
  target:
    name: "{{ include "postgres-cluster.userSecretName" . }}"
    template:
      type: kubernetes.io/basic-auth
  data:
    - secretKey: username
      remoteRef:
        key: postgres/app-user
        property: username
    - secretKey: password
      remoteRef:
        key: postgres/app-user
        property: password
