{{- if eq .Values.monitoring true }}
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: "{{ .Values.database.name }}-postgres-cluster"
  namespace: {{ .Values.namespace | default .Release.Namespace }}
  # Ohne dieses Label greift der podMonitorSelector von kube-prometheus-stack nicht (Chart-Default
  # "release: <helm-release-name>") und die CNPG-Metriken werden schlicht nie gescrapt - alle
  # anderen Monitore im Repo tragen es bereits.
  labels:
    {{- toYaml .Values.podMonitor.labels | nindent 4 }}
spec:
  podMetricsEndpoints:
    - port: metrics
  selector:
    matchLabels:
      cnpg.io/cluster: "{{ .Values.database.name }}-postgres-cluster"
{{- end }}
