# Set via gitops/env/cluster.yaml; empty default only for a readable error.
ticketflow: {}

# Schema registry. Two replicas (P4); each reads the kafkasql journal into its own H2.
replicaCount: 2

image:
  repository: quay.io/apicurio/apicurio-registry
  tag: "3.3.3"
  pullPolicy: IfNotPresent

# kafkasql storage (Kafka topic + in-memory H2), no own database. Uses the unauthenticated
# listener: Apicurio 3.3.3 supports only OAuth for Kafka SASL.
config:
  storageKind: kafkasql
  # Empty = derived from ticketflow.kafka.clusterName/namespaces.kafka.
  kafkaBootstrapServers: ""

service:
  port: 8080

# Quarkus/JVM app.
resources:
  requests:
    cpu: 200m
    memory: 600Mi
  limits:
    cpu: 1000m
    memory: 1300Mi

# 185 = default UID of Quarkus images. readOnlyRootFilesystem unverified, left off.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 185
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop: ["ALL"]

nameOverride: ""
fullnameOverride: ""

# P4: hard spread across regions.
topologySpreadConstraint:
  enabled: true
  maxSkew: 1

podDisruptionBudget:
  enabled: true
  minAvailable: 1
