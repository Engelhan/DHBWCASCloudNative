# Apicurio Registry (https://www.apicur.io) - JSON-Schema-Registry fuer die Kafka-Event-Contracts
# (ReservationRequested/ReservationResult), Carlos' Scope (Kafka Cluster/Schema Registry/AKHQ/
# reservation-worker), siehe CLAUDE.md ## Team. Volleigener Chart statt Upstream-Wrapper - siehe
# Chart.yaml fuer die Begruendung (community Upstream-Chart nicht mehr pullbar).
replicaCount: 1

image:
  repository: quay.io/apicurio/apicurio-registry
  tag: "3.3.3" # kein :latest, siehe P3; echte, aktuelle 3.x-Version (verifiziert auf quay.io)
  pullPolicy: IfNotPresent

# kafkasql-Storage: Schemas landen in einem Kafka-Topic + In-Memory-H2 statt einer eigenen
# Postgres-Instanz - vermeidet bewusst dieselbe Cross-Namespace-Secret-Problematik, die andere
# Services (z.B. reservation-worker/Postgres) loesen mussten (siehe deren values.yaml-Kommentare).
# Zeigt auf den bereits deployten Strimzi-Bootstrap-Service in Namespace "ticketflow", Port 9093 =
# der "unauth"-Listener (charts/kafka-cluster kafka-cluster.yaml), nicht der SASL-Listener auf
# 9092. Grund: Apicurios kafkasql-Storage unterstuetzt in Version 3.3.3 kein SCRAM/PLAIN-SASL mit
# Username/Passwort - der Quellcode (KafkaSqlConfiguration.java, gegen den echten 3.3.3-Tag auf
# GitHub geprueft) baut sasl.jaas.config nur programmatisch fuer einen OAuth-Client-Credentials-
# Flow; ein GitHub-Issue (Apicurio/apicurio-registry#4893) bestaetigt, dass SASL/PLAIN am selben,
# hart auf OAuth verdrahteten Callback-Handler scheitert. Ein erster Versuch mit SCRAM-SHA-512 +
# JAAS-Secret (siehe git-Historie) scheiterte deshalb live mit
# "No serviceName defined in either JAAS or Kafka config" (der Client fiel mangels
# sasl.mechanism-Unterstuetzung auf GSSAPI/Kerberos zurueck). Einen echten OAuth/OIDC-Server nur
# fuer dieses eine Client-Login aufzusetzen war fuer dieses Uni-Projekt nicht verhaeltnismaessig,
# daher der pragmatische unauthentifizierte Zweit-Listener statt SASL (kein externer
# Zugriffspunkt, type: internal). Zugangsdaten deshalb komplett entfallen, kein Secret noetig.
config:
  storageKind: kafkasql
  kafkaBootstrapServers: ticketflow-kafka-kafka-bootstrap.ticketflow.svc:9093

service:
  port: 8080

# Groessenordnung an den (fuer 2.x geschriebenen) Vorschlagswerten des urspruenglich geplanten
# Upstream-Charts orientiert - Apicurio ist eine Quarkus/JVM-Anwendung, braucht spuerbar mehr
# Memory als z.B. AKHQ.
resources:
  requests:
    cpu: 200m
    memory: 600Mi
  limits:
    cpu: 1000m
    memory: 1300Mi

# runAsUser: 185 ist keine Vermutung, sondern die von Red-Hat/Quarkus-basierten Images (inkl.
# frueherer Apicurio-Versionen) verwendete Standard-UID. readOnlyRootFilesystem bewusst NICHT
# gesetzt - unklar, ob/wohin die Anwendung zur Laufzeit schreibt (kein Hinweis in der 3.x-Doku
# gefunden); vor einem echten Deploy per laufendem Pod verifizieren, dann erst aktivieren (siehe
# charts/README.md ## Resource-Limits... zum selben Vorgehen bei AKHQ/Tempo).
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 185
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop: ["ALL"]

nameOverride: ""
fullnameOverride: ""

# Weiche Verteilung ueber die drei simulierten Regionen (P4) - gleiches Muster wie
# charts/ticketflow-app catalogApi.topologySpreadConstraint. Bei replicaCount: 1 wirkungslos,
# schadet aber nicht (ScheduleAnyway) und ist korrekt vorbereitet, falls replicaCount je erhoeht wird.
topologySpreadConstraint:
  enabled: true
  maxSkew: 1
