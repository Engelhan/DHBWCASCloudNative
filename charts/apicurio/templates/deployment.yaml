apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "apicurio.fullname" . }}
  labels:
    {{- include "apicurio.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "apicurio.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "apicurio.labels" . | nindent 8 }}
    spec:
      # Harte Verteilung ueber die drei simulierten Regionen (P4): DoNotSchedule + maxSkew 1 heisst,
      # schon das zweite Replica MUSS in einer anderen Region landen als das erste. Nodes ohne
      # Regions-Label (die Control-Plane) fallen damit automatisch heraus. matchLabelKeys zaehlt
      # nur Pods derselben ReplicaSet-Revision - sonst blockieren beim Rollout die alten Pods die
      # Regionen, in die die neuen sollen.
      {{- if .Values.topologySpreadConstraint.enabled }}
      topologySpreadConstraints:
        - maxSkew: {{ .Values.topologySpreadConstraint.maxSkew }}
          topologyKey: topology.ticketflow/region
          whenUnsatisfiable: DoNotSchedule
          matchLabelKeys:
            - pod-template-hash
          labelSelector:
            matchLabels:
              {{- include "apicurio.selectorLabels" . | nindent 14 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: apicurio-registry
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "apicurio.fullname" . }}
          # Kein dediziertes Health-Endpoint in der 3.x-Doku bestaetigt (moeglicherweise auf
          # einem separaten Management-Port statt 8080, siehe charts/README.md). Nutzt
          # stattdessen die echte, immer erreichbare REST-API selbst als Probe - dieselbe
          # Begruendung wie der Wartelogik im schema-registrar-Job in charts/kafka-cluster.
          livenessProbe:
            httpGet:
              path: /apis/registry/v3/groups
              port: http
            initialDelaySeconds: 20
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /apis/registry/v3/groups
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
