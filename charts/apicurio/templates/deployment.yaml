apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "apicurio.fullname" . }}
  labels:
    {{- include "apicurio.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "apicurio.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "apicurio.labels" . | nindent 8 }}
    spec:
      # P4: hard spread across regions; matchLabelKeys ignores old pods during rollouts.
      {{- if .Values.topologySpreadConstraint.enabled }}
      topologySpreadConstraints:
        - maxSkew: {{ .Values.topologySpreadConstraint.maxSkew }}
          topologyKey: topology.ticketflow/region
          whenUnsatisfiable: DoNotSchedule
          matchLabelKeys:
            - pod-template-hash
          labelSelector:
            matchLabels:
              {{- include "apicurio.selectorLabels" . | nindent 14 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: apicurio-registry
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "apicurio.fullname" . }}
          # Probes use the REST API itself (no documented health endpoint in 3.x).
          livenessProbe:
            httpGet:
              path: /apis/registry/v3/groups
              port: http
            initialDelaySeconds: 20
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /apis/registry/v3/groups
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
