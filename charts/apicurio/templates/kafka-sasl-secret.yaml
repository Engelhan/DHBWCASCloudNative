# SCRAM-Credentials fuer die "apicurio"-KafkaUser (charts/kafka-cluster values.yaml kafka.users)
# als fertiger JAAS-Config-String - gleiches Muster wie charts/akhq/templates/kafka-sasl-secret.yaml,
# siehe Kommentar bei .Values.kafkaSasl. Eigenes Secret statt Referenz auf das von
# charts/kafka-cluster erzeugte, da Apicurio im Namespace "kafka" laeuft, dieses Secret aber im
# Kafka-Cluster-Namespace "ticketflow" - Kubernetes' secretKeyRef ist auf denselben Namespace
# beschraenkt.
{{- if .Values.kafkaSasl.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "apicurio.fullname" . }}-kafka-sasl
  labels:
    {{- include "apicurio.labels" . | nindent 4 }}
type: Opaque
stringData:
  sasl.jaas.config: >-
    org.apache.kafka.common.security.scram.ScramLoginModule required
    username="{{ .Values.kafkaSasl.username }}" password="{{ .Values.kafkaSasl.password }}";
{{- end }}
