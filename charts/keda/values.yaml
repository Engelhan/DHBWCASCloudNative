# P6: KEDA operator only; the ScaledObject lives in charts/reservation-worker.
# Upstream values (dependency alias).
keda:
  # P4: two replicas per component, hard-spread across regions (labels = upstream pod labels).
  # Only one metrics server serves at a time; the second one shortens failover.
  operator:
    replicaCount: 2
  metricsServer:
    replicaCount: 2
  webhooks:
    replicaCount: 2
  podDisruptionBudget:
    operator:
      minAvailable: 1
    metricServer:
      minAvailable: 1
    webhooks:
      minAvailable: 1
  topologySpreadConstraints:
    operator:
      - maxSkew: 1
        topologyKey: topology.ticketflow/region
        whenUnsatisfiable: DoNotSchedule
        matchLabelKeys:
          - pod-template-hash
        labelSelector:
          matchLabels:
            app: keda-operator
    metricsServer:
      - maxSkew: 1
        topologyKey: topology.ticketflow/region
        whenUnsatisfiable: DoNotSchedule
        matchLabelKeys:
          - pod-template-hash
        labelSelector:
          matchLabels:
            app: keda-operator-metrics-apiserver
    webhooks:
      - maxSkew: 1
        topologyKey: topology.ticketflow/region
        whenUnsatisfiable: DoNotSchedule
        matchLabelKeys:
          - pod-template-hash
        labelSelector:
          matchLabels:
            app: keda-admission-webhooks
  # Default: watches all namespaces.

  image:
    keda:
      tag: "2.20.2"
    metricsApiServer:
      tag: "2.20.2"
    webhooks:
      tag: "2.20.2"

  # Security contexts are hardened by default.

  resources:
    operator:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 250m
        memory: 256Mi
    metricServer:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 250m
        memory: 256Mi
    webhooks:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        cpu: 100m
        memory: 128Mi

  # NetworkPolicies come from charts/network-policies (the chart's own blocked API-server egress on
  # k3s).
  networkPolicy:
    enabled: false
    flavor: kubernetes

  # No Prometheus in the cluster.
  prometheus:
    operator:
      enabled: true
      serviceMonitor:
        enabled: false
        additionalLabels:
          release: kube-prometheus-stack
