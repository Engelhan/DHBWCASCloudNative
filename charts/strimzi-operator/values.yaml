# Upstream values (dependency alias).
strimzi-kafka-operator:
  # P4: two replicas, hard-spread across regions (labels = upstream pod labels); leader election is
  # on upstream.
  replicas: 2
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: topology.ticketflow/region
      whenUnsatisfiable: DoNotSchedule
      matchLabelKeys:
        - pod-template-hash
      labelSelector:
        matchLabels:
          name: strimzi-cluster-operator
          strimzi.io/kind: cluster-operator
  # Watch all namespaces (default: own namespace only).
  watchAnyNamespace: true

  # Required for userOperator.watchedNamespace (charts/kafka-cluster); without it the operator
  # deletes the entity operator again. No chart value exists, hence extraEnvs.
  extraEnvs:
    - name: STRIMZI_ENTITY_OPERATOR_WATCHED_NAMESPACE_ENABLED
      value: "true"
    # Strimzi's own policies open every listener to all namespaces; ours are in
    # charts/network-policies. Existing generated policies must be deleted once by hand.
    - name: STRIMZI_NETWORK_POLICY_GENERATION
      value: "false"

  # Upstream defaults for resources are fine; security contexts are empty upstream, hence set here.
  podSecurityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL
