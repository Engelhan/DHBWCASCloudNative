# Muss unter dem Dependency-Alias "strimzi-kafka-operator" verschachtelt sein (siehe
# Chart.yaml), damit Helm die Werte an das gewrappte Upstream-Chart durchreicht.
strimzi-kafka-operator:
  # Chart-Default beobachtet nur den eigenen Install-Namespace (watchAnyNamespace: false) -
  # cluster-wide statt dessen, analog zum CNPG-Operator (der bereits Default cluster-wide
  # ist). Die eigentliche Kafka-CR liegt in charts/kafka-cluster/templates/kafka-cluster.yaml
  # (urspruenglich in charts/ticketflow geplant, siehe dessen Git-Historie), Namespace
  # "ticketflow" - getrennt vom Operator-Namespace "kafka" hier.
  watchAnyNamespace: true

  # resources hat der Chart schon sinnvoll vorbelegt (limits 1000m/384Mi, requests 200m/384Mi) -
  # kein Override noetig. podSecurityContext/securityContext sind dagegen Chart-Default leer
  # ({}) - anders als alle anderen Operator-Charts hier nicht von Haus aus gehaertet, deshalb
  # explizit gesetzt. Kein natives networkPolicy-Feld im Chart vorhanden.
  podSecurityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL
