# Gemeinsame Basiswerte fuer alle Umgebungen. dev/prod-spezifische Overrides in
# values-dev.yaml/values-prod.yaml (siehe README ## values-dev.yaml vs. values-prod.yaml).
#
# Kafka-/Messaging-Teil (P1 fuer Carlos' Scope) sowie catalogApi/frontend (Philipps Scope).
# reservation-worker folgt als eigener Abschnitt, sobald der Service existiert;
# notification-worker/CNPG-Postgres sind bewusst NICHT hier drin - eigene, volleigenstaendige
# Charts (charts/notification-worker, charts/postgres-cluster), siehe charts/README.md.
#
# Struktur (getrennte broker-/controller-NodePools statt Combined-Role, metricsConfig,
# kafkaExporter, entityOperator-Resources) orientiert sich an einem realen Strimzi-Setup, das der
# Nutzer als Referenz aus seinem Arbeitsumfeld bereitgestellt hat - siehe die Kommentare in den
# jeweiligen Templates fuer die Stellen, an denen bewusst abgewichen wurde (z.B. kein externer
# Listener/keine Auth, da wir noch keine Client-Identitaeten haben; kein message.max.bytes-Override,
# da unsere JSON-Events klein sind).

# Namespace fuer alle Ressourcen dieses Charts - getrennt vom Strimzi-Operator-Namespace "kafka"
# (siehe charts/strimzi-operator), analog zu cnpg-operator (Namespace cnpg-system) vs. dieser
# App-Namespace. Wird von gitops/apps/ticketflow.yaml als destination.namespace gesetzt
# (CreateNamespace=true).
namespace: ticketflow

kafka:
  metadata:
    name: ticketflow-kafka
    namespace: ticketflow

  # Kafka-Version, die der gepinnte Strimzi-Operator (charts/strimzi-operator, Chart-Version
  # 1.1.0, existiert real nicht) unterstuetzt - live gegen den Kafka.status-Fehler geprueft
  # (Operator meldete beim ersten Sync-Versuch "Unsupported Kafka.spec.kafka.version: 4.0.0.
  # Supported versions are: [4.2.0, 4.2.1, 4.3.0]"), 4.3.0 gewaehlt als neueste unterstuetzte.
  # Kein metadataVersion gesetzt - siehe Kommentar in templates/messaging/kafka-cluster.yaml.
  version: "4.3.0"

  # Getrennte Pools statt Combined-Role (anders als unser erster Entwurf) - orientiert an der
  # realen Referenz. Braucht mehr Pods als Combined-Role, aber ist die im Referenz-Setup
  # tatsaechlich genutzte Aufteilung.
  controller:
    replicas: 1
    storage:
      type: persistent-claim
      size: 2Gi
    resources:
      requests:
        memory: 512Mi
      limits:
        memory: 512Mi

  broker:
    replicas: 1
    storage:
      type: persistent-claim
      size: 5Gi
    resources:
      requests:
        memory: 512Mi
      limits:
        memory: 1Gi

  # Von values-dev.yaml/values-prod.yaml passend zur jeweiligen Replica-Zahl ueberschrieben -
  # bei replicas: 1 muss der Replication-Factor ebenfalls 1 sein, sonst bleiben interne Topics
  # dauerhaft under-replicated.
  config:
    offsetsTopicReplicationFactor: 1
    transactionStateLogReplicationFactor: 1
    transactionStateLogMinIsr: 1
    defaultReplicationFactor: 1
    minInsyncReplicas: 1

  entityOperator:
    topicOperator:
      resource:
        memoryLimit: 256Mi
    userOperator:
      resource:
        memoryLimit: 256Mi

  # RESERVATION_TOPIC (catalog-api -> reservation-worker) und RESULT_TOPIC
  # (reservation-worker -> notification-worker), siehe src/*/README.md ## Konfiguration.
  # replicationFactor darf weder controller.replicas noch broker.replicas uebersteigen.
  topics:
    - name: reservation-requested
      partitions: 3
      replicationFactor: 1
      config:
        retention.ms: "604800000"
        cleanup.policy: delete
    - name: reservation-result
      partitions: 3
      replicationFactor: 1
      config:
        retention.ms: "604800000"
        cleanup.policy: delete

catalogApi:
  replicas: 2

  image:
    repository: ticketflow/catalog-api
    # Git-Short-SHA, wird beim Deploy gesetzt (--set catalogApi.image.tag=<sha>), siehe P3 -
    # kein :latest im Repo.
    tag: ""
    pullPolicy: IfNotPresent

  service:
    port: 8080

  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 300m
      memory: 128Mi

  # -> ConfigMap (templates/catalog-api/configmap.yaml), siehe src/catalog-api/README.md
  # ## Konfiguration fuer die Bedeutung jeder Variable.
  env:
    logLevel: info
    port: "8080"
    reservationTopic: reservation-requested
    # Bootstrap-Service des Kafka-Clusters aus diesem selben Chart (kafka.metadata.name), Port
    # 9092 ist Strimzi's Standard-Plaintext-Listener.
    kafkaBrokers: "ticketflow-kafka-kafka-bootstrap.ticketflow.svc:9092"
    # Nur fuer Requests ausserhalb des Ingress-Pfads relevant (z.B. direkter Aufruf durch
    # load-generator) - das Frontend selbst braucht dank Same-Origin-Ingress (siehe
    # templates/frontend/ingress.yaml) kein CORS.
    corsAllowedOrigin: ""

  # WICHTIG - noch ungeloeste Team-Abhaengigkeit (siehe Root-README/CLAUDE.md): charts/postgres-cluster
  # (Namespace "application", DB-Name "postgres", Secret mit getrennten username/password-Feldern)
  # liefert aktuell KEIN Secret mit dieser Form. Bis das gekaert ist, muss dieses Secret manuell
  # angelegt werden (z.B. `kubectl -n ticketflow create secret generic ticketflow-database-url
  # --from-literal=DATABASE_URL=postgres://...`), sonst bleibt der Pod im readyz-Fehler haengen
  # (DB-Ping schlaegt fehl) - crasht aber nicht, siehe readinessProbe.
  databaseSecretName: ticketflow-database-url

  podDisruptionBudget:
    enabled: true
    minAvailable: 1

  serviceMonitor:
    enabled: true
    interval: 30s
    # Gleiche Annahme wie charts/notification-worker/values.yaml (nicht live verifiziert):
    # kube-prometheus-stack hat keinen expliziten serviceMonitorSelector-Override im values.yaml
    # dieses Repos -> Chart-Default "release: <helm-release-name>" (Release-Name = ArgoCD
    # Application-Name "kube-prometheus-stack"). Falls falsch: nur dieses Label anpassen.
    labels:
      release: kube-prometheus-stack

  # Weiche Verteilung ueber die drei simulierten Regionen (P4) - catalog-api ist stateless und
  # horizontal skaliert, damit ein Ausfall einer Region waehrend eines Flash Sales nicht alle
  # Replicas gleichzeitig verliert. whenUnsatisfiable: ScheduleAnyway statt DoNotSchedule, weil
  # values-dev.yaml mit replicas: 1 sonst auf einem Ein-Node-Dev-Setup haengen bleiben wuerde.
  topologySpreadConstraint:
    enabled: true
    maxSkew: 1

frontend:
  replicas: 2

  image:
    repository: ticketflow/frontend
    tag: ""
    pullPolicy: IfNotPresent

  service:
    port: 80

  resources:
    requests:
      cpu: 10m
      memory: 16Mi
    limits:
      cpu: 100m
      memory: 64Mi

  ingress:
    enabled: true
    # Muss innerhalb der aktivierten RFC2136-Zone liegen, siehe
    # charts/cert-manager-config/values.yaml rfc2136.zone.
    host: "ticketflow.cas438007-at-cas-dhbw-de.users.dhbw.site"
    clusterIssuerName: certificate-cluster-issuer
    tlsSecretName: ticketflow-frontend-tls

  podDisruptionBudget:
    enabled: true
    minAvailable: 1

  topologySpreadConstraint:
    enabled: true
    maxSkew: 1
