apiVersion: v1
kind: ConfigMap
metadata:
  name: ticketflow-catalog-api
  namespace: {{ .Values.namespace }}
data:
  LOG_LEVEL: {{ .Values.catalogApi.env.logLevel | quote }}
  PORT: {{ .Values.catalogApi.env.port | quote }}
  RESERVATION_TOPIC: {{ .Values.catalogApi.env.reservationTopic | quote }}
  KAFKA_BROKERS: {{ .Values.catalogApi.env.kafkaBrokers | quote }}
  CORS_ALLOWED_ORIGIN: {{ .Values.catalogApi.env.corsAllowedOrigin | quote }}
