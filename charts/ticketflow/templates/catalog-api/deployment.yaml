apiVersion: apps/v1
kind: Deployment
metadata:
  name: ticketflow-catalog-api
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: catalog-api
    app.kubernetes.io/part-of: ticketflow
spec:
  replicas: {{ .Values.catalogApi.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: catalog-api
      app.kubernetes.io/part-of: ticketflow
  template:
    metadata:
      labels:
        app.kubernetes.io/name: catalog-api
        app.kubernetes.io/part-of: ticketflow
    spec:
      # Weiche Verteilung ueber die drei simulierten Regionen (P4) - siehe values.yaml-Kommentar
      # bei catalogApi.topologySpreadConstraint.
      {{- if .Values.catalogApi.topologySpreadConstraint.enabled }}
      topologySpreadConstraints:
        - maxSkew: {{ .Values.catalogApi.topologySpreadConstraint.maxSkew }}
          topologyKey: topology.ticketflow/region
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: catalog-api
              app.kubernetes.io/part-of: ticketflow
      {{- end }}
      securityContext:
        runAsNonRoot: true
      containers:
        - name: catalog-api
          image: "{{ .Values.catalogApi.image.repository }}:{{ .Values.catalogApi.image.tag }}"
          imagePullPolicy: {{ .Values.catalogApi.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: ticketflow-catalog-api
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.catalogApi.databaseSecretName }}
                  key: DATABASE_URL
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
          resources:
            {{- toYaml .Values.catalogApi.resources | nindent 12 }}
