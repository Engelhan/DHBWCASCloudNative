# Ueberschreibt das im Image gebackene config.js (Default: http://localhost:8080, siehe
# src/frontend/config.js) per Volume-Mount mit einem leeren API_BASE_URL - das Ingress
# (ingress.yaml) routet /events und /reservations bereits auf derselben Origin an catalog-api,
# ein leerer Wert macht die fetch()-Aufrufe im Frontend damit zu relativen Same-Origin-Requests.
apiVersion: v1
kind: ConfigMap
metadata:
  name: ticketflow-frontend-config
  namespace: {{ .Values.namespace }}
data:
  config.js: |
    window.API_BASE_URL = "";
