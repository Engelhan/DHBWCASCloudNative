# HA-Werte - siehe README ## values-dev.yaml vs. values-prod.yaml. Kafka-Werte liegen seit der
# Auslagerung in charts/kafka-cluster/values-prod.yaml.
#
# 3 Replicas je Service, damit topologySpreadConstraints (maxSkew: 1) tatsaechlich etwas zu
# verteilen hat - eine Region kann komplett ausfallen, ohne dass catalog-api/frontend komplett weg
# sind (P4/P5-Begruendung, analog zu Kafka in charts/kafka-cluster).
catalogApi:
  replicas: 3

frontend:
  replicas: 3
