# Every NetworkPolicy of the cluster (except ArgoCD's own). Each namespace: default-deny + DNS,
# then every connection explicitly; see charts/README.md ## network-policies.
ticketflow: {}

# Namespaces hard-wired in gitops/applicationsets/; keep in sync.
namespaces:
  # monitoring: monitoring - observability stack removed.
  certManager: cert-manager
  externalDns: external-dns
  cnpg: cnpg-system
  keda: keda
  longhorn: longhorn-system
  argocd: argocd
  kubeSystem: kube-system
  # Namespaces without workloads: default-deny only.
  withoutWorkloads:
    - default
    - kube-public
    - kube-node-lease

# kube-proxy DNATs the kubernetes service (443) to node IP:6443 before policy evaluation.
apiServerPort: 6443

# Optional SMTP egress, closed unless enabled.
notificationWorker:
  smtp:
    enabled: false
    port: 587
