{{- /*
Operators without their own data path: API egress, API ingress on webhook ports, plus their one
external connection.
*/}}
{{- $rfc2136 := required "ticketflow.rfc2136.server is missing - pass gitops/env/cluster.yaml" .Values.ticketflow.rfc2136.server -}}
{{- $rfc2136Cidr := ternary (printf "%s/128" $rfc2136) (printf "%s/32" $rfc2136) (contains ":" $rfc2136) -}}

{{- /* ===================== cert-manager ===================== */ -}}
{{- $ns := .Values.namespaces.certManager }}
{{ include "np.baseline" (list $ $ns) }}
---
{{ include "np.header" (list $ "allow-cert-manager-controller" $ns) }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: cert-manager
      app.kubernetes.io/component: controller
  policyTypes:
    - Ingress
    - Egress
  ingress:
    {{- include "np.ingress.prometheus" (list $ 9402) | nindent 4 }}
  egress:
    {{- include "np.egress.apiServer" . | nindent 4 }}
    # ACME server (by hostname, no fixed ipBlock) and DNS-01: RFC2136 updates plus propagation
    # checks
    # against the zone's authoritative nameservers.
    - to:
        {{- include "np.peer.internet" . | nindent 8 }}
      ports:
        - port: 443
          protocol: TCP
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
---
{{ include "np.header" (list $ "allow-cert-manager-webhook" $ns) }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: cert-manager
      app.kubernetes.io/component: webhook
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Validating/mutating webhook.
    {{- include "np.ingress.apiServer" (list $ 10250) | nindent 4 }}
    {{- include "np.ingress.prometheus" (list $ 9402) | nindent 4 }}
  egress:
    {{- include "np.egress.apiServer" . | nindent 4 }}
---
{{ include "np.header" (list $ "allow-cert-manager-cainjector-startupapicheck" $ns) }}
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/component
        operator: In
        values:
          - cainjector
          - startupapicheck
      - key: app.kubernetes.io/instance
        operator: In
        values:
          - cert-manager
  policyTypes:
    - Ingress
    - Egress
  ingress:
    {{- include "np.ingress.prometheus" (list $ 9402) | nindent 4 }}
  egress:
    {{- include "np.egress.apiServer" . | nindent 4 }}
---
{{- /* ===================== external-dns ===================== */ -}}
{{- $ns = .Values.namespaces.externalDns }}
{{ include "np.baseline" (list $ $ns) }}
---
{{ include "np.header" (list $ "allow-external-dns" $ns) }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: external-dns
  policyTypes:
    - Ingress
    - Egress
  ingress:
    {{- include "np.ingress.prometheus" (list $ 7979) | nindent 4 }}
  egress:
    # Watches Ingress/IngressRoute/Service objects.
    {{- include "np.egress.apiServer" . | nindent 4 }}
    # RFC2136 updates (TSIG) to the configured DNS server.
    - to:
        - ipBlock:
            cidr: {{ $rfc2136Cidr }}
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
---
{{- /* ===================== CloudNativePG ===================== */ -}}
{{- $ns = .Values.namespaces.cnpg }}
{{ include "np.baseline" (list $ $ns) }}
---
{{ include "np.header" (list $ "allow-cnpg-operator" $ns) }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: cloudnative-pg
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Webhooks.
    {{- include "np.ingress.apiServer" (list $ 9443) | nindent 4 }}
    {{- include "np.ingress.prometheus" (list $ 8080) | nindent 4 }}
  egress:
    {{- include "np.egress.apiServer" . | nindent 4 }}
    # Instance manager (8000) and Postgres (5432) of every instance (CNPG docs). Counterpart:
    # np.cnpgCluster.
    - to:
        - namespaceSelector: {}
          podSelector:
            matchExpressions:
              - key: cnpg.io/cluster
                operator: Exists
      ports:
        - port: 8000
          protocol: TCP
        - port: 5432
          protocol: TCP
---
{{- /* ===================== KEDA ===================== */ -}}
{{- $ns = .Values.namespaces.keda }}
{{ include "np.baseline" (list $ $ns) }}
---
{{ include "np.header" (list $ "allow-keda-operator" $ns) }}
spec:
  podSelector:
    matchLabels:
      app: keda-operator
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # gRPC metrics service queried by the metrics apiserver.
    - from:
        - podSelector:
            matchLabels:
              app: keda-operator-metrics-apiserver
      ports:
        - port: 9666
          protocol: TCP
    {{- include "np.ingress.prometheus" (list $ 8080) | nindent 4 }}
  egress:
    {{- include "np.egress.apiServer" . | nindent 4 }}
    # Kafka scaler: reads reservation-worker's consumer lag (B2).
    - to:
        {{- include "np.peer.kafkaBrokers" . | nindent 8 }}
      ports:
        - port: 9092
          protocol: TCP
---
{{ include "np.header" (list $ "allow-keda-metrics-apiserver" $ns) }}
spec:
  podSelector:
    matchLabels:
      app: keda-operator-metrics-apiserver
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # External metrics APIService (HPA via API server).
    {{- include "np.ingress.apiServer" (list $ 6443) | nindent 4 }}
    {{- include "np.ingress.prometheus" (list $ 8080) | nindent 4 }}
  egress:
    {{- include "np.egress.apiServer" . | nindent 4 }}
    - to:
        - podSelector:
            matchLabels:
              app: keda-operator
      ports:
        - port: 9666
          protocol: TCP
---
{{ include "np.header" (list $ "allow-keda-admission-webhooks" $ns) }}
spec:
  podSelector:
    matchLabels:
      app: keda-admission-webhooks
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Admission webhook.
    {{- include "np.ingress.apiServer" (list $ 9443) | nindent 4 }}
  egress:
    {{- include "np.egress.apiServer" . | nindent 4 }}
