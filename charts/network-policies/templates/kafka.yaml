{{- /*
Kafka platform: Strimzi, brokers/controllers, entity operator, exporter, Apicurio, AKHQ, schema job.
Strimzi's own policy generation is off; the internal rules below match what it generated, the client
listeners are narrowed to the real clients.
*/}}
{{- $ns := include "np.ns.kafka" . -}}
{{- $app := include "np.ns.app" . -}}
{{- $cluster := include "np.kafkaCluster" . -}}
{{ include "np.baseline" (list $ $ns) }}
---
{{ include "np.header" (list $ "allow-kafka-nodes" $ns) }}
spec:
  podSelector:
    matchLabels:
      strimzi.io/cluster: {{ $cluster }}
      strimzi.io/kind: Kafka
      strimzi.io/name: {{ $cluster }}-kafka
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # KRaft controller quorum.
    - from:
        - podSelector:
            matchLabels:
              strimzi.io/cluster: {{ $cluster }}
              strimzi.io/kind: Kafka
              strimzi.io/name: {{ $cluster }}-kafka
        - podSelector:
            matchLabels:
              strimzi.io/kind: cluster-operator
      ports:
        - port: 9090
          protocol: TCP
    # Replication / internal mTLS listener.
    - from:
        - podSelector:
            matchLabels:
              strimzi.io/kind: cluster-operator
        - podSelector:
            matchLabels:
              strimzi.io/cluster: {{ $cluster }}
              strimzi.io/kind: Kafka
              strimzi.io/name: {{ $cluster }}-kafka
        - podSelector:
            matchLabels:
              strimzi.io/name: {{ $cluster }}-entity-operator
        - podSelector:
            matchLabels:
              strimzi.io/name: {{ $cluster }}-kafka-exporter
      ports:
        - port: 9091
          protocol: TCP
    # Kafka agent (broker state for rolling updates).
    - from:
        - podSelector:
            matchLabels:
              strimzi.io/kind: cluster-operator
      ports:
        - port: 8443
          protocol: TCP
    # SASL listener: the four KafkaUser clients plus KEDA's lag scaler.
    - from:
        - {{ include "np.nsSelector" $app | nindent 10 | trim }}
          podSelector:
            matchLabels:
              app.kubernetes.io/instance: ticketflow-app
              app.kubernetes.io/component: catalog-api
        - {{ include "np.nsSelector" $app | nindent 10 | trim }}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: reservation-worker
        - {{ include "np.nsSelector" $app | nindent 10 | trim }}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: notification-worker
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: akhq
        - {{ include "np.nsSelector" .Values.namespaces.keda | nindent 10 | trim }}
          podSelector:
            matchLabels:
              app: keda-operator
      ports:
        - port: 9092
          protocol: TCP
    # Anonymous listener: Apicurio only - the network is the only access control here.
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: apicurio
      ports:
        - port: 9093
          protocol: TCP
    {{- include "np.ingress.prometheus" (list $ 9404) | nindent 4 }}
  egress:
    # Strimzi's config provider reads secrets via the API.
    {{- include "np.egress.apiServer" . | nindent 4 }}
    - to:
        - podSelector:
            matchLabels:
              strimzi.io/cluster: {{ $cluster }}
              strimzi.io/kind: Kafka
              strimzi.io/name: {{ $cluster }}-kafka
      ports:
        - port: 9090
          protocol: TCP
        - port: 9091
          protocol: TCP
---
{{ include "np.header" (list $ "allow-strimzi-cluster-operator" $ns) }}
spec:
  podSelector:
    matchLabels:
      strimzi.io/kind: cluster-operator
  policyTypes:
    - Ingress
    - Egress
  ingress:
    {{- include "np.ingress.prometheus" (list $ 8080) | nindent 4 }}
  egress:
    {{- include "np.egress.apiServer" . | nindent 4 }}
    # Admin client (9091), KRaft quorum (9090), Kafka agent (8443).
    - to:
        - podSelector:
            matchLabels:
              strimzi.io/kind: Kafka
      ports:
        - port: 9090
          protocol: TCP
        - port: 9091
          protocol: TCP
        - port: 8443
          protocol: TCP
---
{{ include "np.header" (list $ "allow-strimzi-entity-operator" $ns) }}
spec:
  podSelector:
    matchLabels:
      strimzi.io/name: {{ $cluster }}-entity-operator
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Topic/User operator metrics.
    {{- include "np.ingress.prometheus" (list $ 8080 8081) | nindent 4 }}
  egress:
    # KafkaTopic/KafkaUser CRs (also in the app namespace).
    {{- include "np.egress.apiServer" . | nindent 4 }}
    # Topics, SCRAM credentials, ACLs via the admin client.
    - to:
        - podSelector:
            matchLabels:
              strimzi.io/cluster: {{ $cluster }}
              strimzi.io/name: {{ $cluster }}-kafka
      ports:
        - port: 9091
          protocol: TCP
---
{{ include "np.header" (list $ "allow-strimzi-kafka-exporter" $ns) }}
spec:
  podSelector:
    matchLabels:
      strimzi.io/name: {{ $cluster }}-kafka-exporter
  policyTypes:
    - Ingress
    - Egress
  ingress:
    {{- include "np.ingress.prometheus" (list $ 9404) | nindent 4 }}
  egress:
    # Consumer lag/offsets via the internal listener.
    - to:
        - podSelector:
            matchLabels:
              strimzi.io/cluster: {{ $cluster }}
              strimzi.io/name: {{ $cluster }}-kafka
      ports:
        - port: 9091
          protocol: TCP
---
{{ include "np.header" (list $ "allow-apicurio" $ns) }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: apicurio
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Schema lookups by the services + registration by the hook job.
    - from:
        - {{ include "np.nsSelector" $app | nindent 10 | trim }}
          podSelector:
            matchLabels:
              app.kubernetes.io/instance: ticketflow-app
              app.kubernetes.io/component: catalog-api
        - {{ include "np.nsSelector" $app | nindent 10 | trim }}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: reservation-worker
        - {{ include "np.nsSelector" $app | nindent 10 | trim }}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: notification-worker
        - podSelector:
            matchLabels:
              app: ticketflow-schema-registrar
      ports:
        - port: 8080
          protocol: TCP
  egress:
    # kafkasql storage (anonymous listener).
    - to:
        - podSelector:
            matchLabels:
              strimzi.io/cluster: {{ $cluster }}
              strimzi.io/name: {{ $cluster }}-kafka
              strimzi.io/broker-role: "true"
      ports:
        - port: 9093
          protocol: TCP
---
{{ include "np.header" (list $ "allow-akhq" $ns) }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: akhq
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Public UI.
    - from:
        {{- include "np.peer.traefik" . | nindent 8 }}
      ports:
        - port: 8080
          protocol: TCP
    {{- include "np.ingress.prometheus" (list $ 28081) | nindent 4 }}
  egress:
    - to:
        - podSelector:
            matchLabels:
              strimzi.io/cluster: {{ $cluster }}
              strimzi.io/name: {{ $cluster }}-kafka
              strimzi.io/broker-role: "true"
      ports:
        - port: 9092
          protocol: TCP
---
{{ include "np.header" (list $ "allow-schema-registrar-job" $ns) }}
spec:
  podSelector:
    matchLabels:
      app: ticketflow-schema-registrar
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: apicurio
      ports:
        - port: 8080
          protocol: TCP
    # apk add at runtime - Alpine mirrors.
    - to:
        {{- include "np.peer.internet" . | nindent 8 }}
      ports:
        - port: 443
          protocol: TCP
        - port: 80
          protocol: TCP
