{{- /*
Kafka-Plattform (ticketflow.namespaces.kafka): Strimzi-Operator, Kafka-Broker/-Controller (KRaft),
Entity-Operator, Kafka-Exporter, Apicurio, AKHQ, Schema-Registrierungs-Job.

Strimzi generiert normalerweise eigene Ingress-Policies (pro Listener "von allen Namespaces"
offen). Das ist in charts/strimzi-operator per STRIMZI_NETWORK_POLICY_GENERATION=false
abgeschaltet - der von der Strimzi-Doku (Restricting access to listeners with network policies)
vorgesehene Weg fuer eigene Policies. Die internen Regeln (9090/9091/8443) unten sind 1:1 die, die
der Operator zuvor selbst erzeugt hatte (live ausgelesen), die Client-Listener 9092/9093 sind auf
die tatsaechlichen Clients verengt.
*/ -}}
{{- $ns := include "np.ns.kafka" . -}}
{{- $app := include "np.ns.app" . -}}
{{- $cluster := include "np.kafkaCluster" . -}}
{{ include "np.baseline" (list $ $ns) }}
---
{{ include "np.header" (list $ "allow-kafka-nodes" $ns) }}
spec:
  podSelector:
    matchLabels:
      strimzi.io/cluster: {{ $cluster }}
      strimzi.io/kind: Kafka
      strimzi.io/name: {{ $cluster }}-kafka
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # KRaft-Controller-Quorum.
    - from:
        - podSelector:
            matchLabels:
              strimzi.io/cluster: {{ $cluster }}
              strimzi.io/kind: Kafka
              strimzi.io/name: {{ $cluster }}-kafka
        - podSelector:
            matchLabels:
              strimzi.io/kind: cluster-operator
      ports:
        - port: 9090
          protocol: TCP
    # Replikation/interner mTLS-Listener: Broker untereinander und Strimzi-Komponenten.
    - from:
        - podSelector:
            matchLabels:
              strimzi.io/kind: cluster-operator
        - podSelector:
            matchLabels:
              strimzi.io/cluster: {{ $cluster }}
              strimzi.io/kind: Kafka
              strimzi.io/name: {{ $cluster }}-kafka
        - podSelector:
            matchLabels:
              strimzi.io/name: {{ $cluster }}-entity-operator
        - podSelector:
            matchLabels:
              strimzi.io/name: {{ $cluster }}-kafka-exporter
      ports:
        - port: 9091
          protocol: TCP
    # Kafka-Agent (Broker-State fuer Rolling Updates).
    - from:
        - podSelector:
            matchLabels:
              strimzi.io/kind: cluster-operator
      ports:
        - port: 8443
          protocol: TCP
    # Listener "plain" (SASL/SCRAM): genau die vier KafkaUser-Clients plus KEDAs Lag-Scaler.
    - from:
        - {{ include "np.nsSelector" $app | nindent 10 | trim }}
          podSelector:
            matchLabels:
              app.kubernetes.io/instance: ticketflow-app
              app.kubernetes.io/component: catalog-api
        - {{ include "np.nsSelector" $app | nindent 10 | trim }}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: reservation-worker
        - {{ include "np.nsSelector" $app | nindent 10 | trim }}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: notification-worker
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: akhq
        - {{ include "np.nsSelector" .Values.namespaces.keda | nindent 10 | trim }}
          podSelector:
            matchLabels:
              app: keda-operator
      ports:
        - port: 9092
          protocol: TCP
    # Listener "unauth" (anonym, Superuser) - ausschliesslich Apicurio (kafkasql-Storage kann kein
    # SCRAM, siehe charts/kafka-cluster). Hier ist die Netzwerkebene die einzige Zugangskontrolle.
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: apicurio
      ports:
        - port: 9093
          protocol: TCP
    {{- include "np.ingress.prometheus" (list $ 9404) | nindent 4 }}
  egress:
    # Strimzis Config-Provider (strimzisecrets:...) liest Zertifikate/Credentials zur Laufzeit
    # ueber die Kubernetes-API, nicht aus gemounteten Dateien.
    {{- include "np.egress.apiServer" . | nindent 4 }}
    - to:
        - podSelector:
            matchLabels:
              strimzi.io/cluster: {{ $cluster }}
              strimzi.io/kind: Kafka
              strimzi.io/name: {{ $cluster }}-kafka
      ports:
        - port: 9090
          protocol: TCP
        - port: 9091
          protocol: TCP
---
{{ include "np.header" (list $ "allow-strimzi-cluster-operator" $ns) }}
spec:
  podSelector:
    matchLabels:
      strimzi.io/kind: cluster-operator
  policyTypes:
    - Ingress
    - Egress
  ingress:
    {{- include "np.ingress.prometheus" (list $ 8080) | nindent 4 }}
  egress:
    {{- include "np.egress.apiServer" . | nindent 4 }}
    # Admin-Client (9091), KRaft-Quorum-Abfragen (9090), Kafka-Agent (8443).
    - to:
        - podSelector:
            matchLabels:
              strimzi.io/kind: Kafka
      ports:
        - port: 9090
          protocol: TCP
        - port: 9091
          protocol: TCP
        - port: 8443
          protocol: TCP
---
{{ include "np.header" (list $ "allow-strimzi-entity-operator" $ns) }}
spec:
  podSelector:
    matchLabels:
      strimzi.io/name: {{ $cluster }}-entity-operator
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Topic-/User-Operator-Metriken.
    {{- include "np.ingress.prometheus" (list $ 8080 8081) | nindent 4 }}
  egress:
    # Liest/schreibt KafkaTopic-/KafkaUser-CRs (auch im App-Namespace, watchedNamespace).
    {{- include "np.egress.apiServer" . | nindent 4 }}
    # Legt Topics/SCRAM-Credentials/ACLs per Admin-Client an.
    - to:
        - podSelector:
            matchLabels:
              strimzi.io/cluster: {{ $cluster }}
              strimzi.io/name: {{ $cluster }}-kafka
      ports:
        - port: 9091
          protocol: TCP
---
{{ include "np.header" (list $ "allow-strimzi-kafka-exporter" $ns) }}
spec:
  podSelector:
    matchLabels:
      strimzi.io/name: {{ $cluster }}-kafka-exporter
  policyTypes:
    - Ingress
    - Egress
  ingress:
    {{- include "np.ingress.prometheus" (list $ 9404) | nindent 4 }}
  egress:
    # Consumer-Lag/Offsets ueber den internen Listener.
    - to:
        - podSelector:
            matchLabels:
              strimzi.io/cluster: {{ $cluster }}
              strimzi.io/name: {{ $cluster }}-kafka
      ports:
        - port: 9091
          protocol: TCP
---
{{ include "np.header" (list $ "allow-apicurio" $ns) }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: apicurio
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Schema-Aufloesung der drei Services + Registrierung durch den Hook-Job.
    - from:
        - {{ include "np.nsSelector" $app | nindent 10 | trim }}
          podSelector:
            matchLabels:
              app.kubernetes.io/instance: ticketflow-app
              app.kubernetes.io/component: catalog-api
        - {{ include "np.nsSelector" $app | nindent 10 | trim }}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: reservation-worker
        - {{ include "np.nsSelector" $app | nindent 10 | trim }}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: notification-worker
        - podSelector:
            matchLabels:
              app: ticketflow-schema-registrar
      ports:
        - port: 8080
          protocol: TCP
  egress:
    # kafkasql-Storage: Registry-Inhalt liegt in einem Kafka-Topic (Listener "unauth").
    - to:
        - podSelector:
            matchLabels:
              strimzi.io/cluster: {{ $cluster }}
              strimzi.io/name: {{ $cluster }}-kafka
              strimzi.io/broker-role: "true"
      ports:
        - port: 9093
          protocol: TCP
---
{{ include "np.header" (list $ "allow-akhq" $ns) }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: akhq
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Oeffentliche UI (Ingress akhq.<dnsZone>).
    - from:
        {{- include "np.peer.traefik" . | nindent 8 }}
      ports:
        - port: 8080
          protocol: TCP
    {{- include "np.ingress.prometheus" (list $ 28081) | nindent 4 }}
  egress:
    - to:
        - podSelector:
            matchLabels:
              strimzi.io/cluster: {{ $cluster }}
              strimzi.io/name: {{ $cluster }}-kafka
              strimzi.io/broker-role: "true"
      ports:
        - port: 9092
          protocol: TCP
---
{{ include "np.header" (list $ "allow-schema-registrar-job" $ns) }}
spec:
  podSelector:
    matchLabels:
      app: ticketflow-schema-registrar
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: apicurio
      ports:
        - port: 8080
          protocol: TCP
    # Der Job installiert curl/jq zur Laufzeit per `apk add` (alpine:3.20) - Alpine-Paketspiegel.
    - to:
        {{- include "np.peer.internet" . | nindent 8 }}
      ports:
        - port: 443
          protocol: TCP
        - port: 80
          protocol: TCP
