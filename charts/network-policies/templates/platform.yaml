{{- /*
Platform namespaces: Longhorn, ArgoCD, kube-system (k3s-managed) and empty default namespaces.
*/}}

{{- /* ===================== Longhorn ===================== */ -}}
{{- $ns := .Values.namespaces.longhorn }}
{{ include "np.baseline" (list $ $ns) }}
---
{{ include "np.header" (list $ "allow-longhorn-internal" $ns) }}
spec:
  # All Longhorn pods incl. dynamic ones; engine/replica ports are dynamic, so allow Longhorn among
  # itself. Host iSCSI is covered by kube-router's local-node rule.
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector: {}
    # Webhooks (9502) and recovery backend (9503).
    {{- include "np.ingress.apiServer" (list $ 9502 9503) | nindent 4 }}
  egress:
    {{- include "np.egress.apiServer" . | nindent 4 }}
    - to:
        - podSelector: {}
---
{{- /* ===================== ArgoCD ===================== */ -}}
{{- /*
ArgoCD's install manifest already ships ingress policies; this adds default-deny and egress. If this
breaks ArgoCD: kubectl -n argocd delete networkpolicy -l app.kubernetes.io/name=network-policies
*/}}
{{- $ns = .Values.namespaces.argocd }}
{{ include "np.baseline" (list $ $ns) }}
---
{{ include "np.header" (list $ "allow-argocd-application-controller" $ns) }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: argocd-application-controller
  policyTypes:
    - Egress
  egress:
    # Applies manifests (in-cluster only).
    {{- include "np.egress.apiServer" . | nindent 4 }}
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: argocd-repo-server
      ports:
        - port: 8081
          protocol: TCP
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: argocd-redis
      ports:
        - port: 6379
          protocol: TCP
---
{{ include "np.header" (list $ "allow-argocd-repo-server" $ns) }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: argocd-repo-server
  policyTypes:
    - Egress
  egress:
    # Manifest cache.
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: argocd-redis
      ports:
        - port: 6379
          protocol: TCP
    # This repo via SSH and helm dependency build against upstream chart repos (https).
    - to:
        {{- include "np.peer.internet" . | nindent 8 }}
      ports:
        - port: 22
          protocol: TCP
        - port: 443
          protocol: TCP
---
{{ include "np.header" (list $ "allow-argocd-server" $ns) }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: argocd-server
  policyTypes:
    - Egress
  egress:
    {{- include "np.egress.apiServer" . | nindent 4 }}
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: argocd-repo-server
      ports:
        - port: 8081
          protocol: TCP
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: argocd-redis
      ports:
        - port: 6379
          protocol: TCP
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: argocd-dex-server
      ports:
        - port: 5556
          protocol: TCP
        - port: 5557
          protocol: TCP
---
{{ include "np.header" (list $ "allow-argocd-applicationset-notifications" $ns) }}
spec:
  # ApplicationSet and notifications controllers.
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values:
          - argocd-applicationset-controller
          - argocd-notifications-controller
  policyTypes:
    - Egress
  egress:
    {{- include "np.egress.apiServer" . | nindent 4 }}
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: argocd-repo-server
      ports:
        - port: 8081
          protocol: TCP
---
{{ include "np.header" (list $ "allow-argocd-dex-server" $ns) }}
spec:
  # No SSO connector: API only.
  podSelector:
    matchLabels:
      app.kubernetes.io/name: argocd-dex-server
  policyTypes:
    - Egress
  egress:
    {{- include "np.egress.apiServer" . | nindent 4 }}
---
{{- /* ===================== kube-system ===================== */ -}}
{{- $ns = .Values.namespaces.kubeSystem }}
{{ include "np.baseline" (list $ $ns) }}
---
{{ include "np.header" (list $ "allow-coredns" $ns) }}
spec:
  podSelector:
    matchLabels:
      k8s-app: kube-dns
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Every pod resolves via CoreDNS.
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    {{- include "np.ingress.prometheus" (list $ 9153) | nindent 4 }}
  egress:
    # Watches Services/EndpointSlices.
    {{- include "np.egress.apiServer" . | nindent 4 }}
    # Forwards external names to the host's resolvers.
    - to:
        {{- include "np.peer.internet" . | nindent 8 }}
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
---
{{ include "np.header" (list $ "allow-traefik" $ns) }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: traefik
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # web/websecure from the internet (via svclb or directly).
    - ports:
        - port: 8000
          protocol: TCP
        - port: 8443
          protocol: TCP
    {{- include "np.ingress.prometheus" (list $ 9100) | nindent 4 }}
  egress:
    # Watches Ingress/IngressRoute/Secrets.
    {{- include "np.egress.apiServer" . | nindent 4 }}
    # Backends of all ingress objects.
    - to:
        - {{ include "np.nsSelector" (include "np.ns.app" .) | nindent 10 | trim }}
          podSelector:
            matchLabels:
              app.kubernetes.io/instance: ticketflow-app
      ports:
        - port: 80
          protocol: TCP
        - port: 8080
          protocol: TCP
    - to:
        - {{ include "np.nsSelector" (include "np.ns.kafka" .) | nindent 10 | trim }}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: akhq
      ports:
        - port: 8080
          protocol: TCP
    - to:
        - {{ include "np.nsSelector" (include "np.ns.openbao" .) | nindent 10 | trim }}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: openbao
              component: server
      ports:
        - port: 8200
          protocol: TCP
    # TLS passthrough (charts/argocd-ingress).
    - to:
        - {{ include "np.nsSelector" .Values.namespaces.argocd | nindent 10 | trim }}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: argocd-server
      ports:
        - port: 8080
          protocol: TCP
---
{{ include "np.header" (list $ "allow-svclb-traefik" $ns) }}
spec:
  # klipper-lb: hostPort 80/443, DNAT to Traefik.
  podSelector:
    matchLabels:
      svccontroller.k3s.cattle.io/svcname: traefik
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - ports:
        - port: 80
          protocol: TCP
        - port: 443
          protocol: TCP
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - port: 8000
          protocol: TCP
        - port: 8443
          protocol: TCP
---
{{ include "np.header" (list $ "allow-metrics-server" $ns) }}
spec:
  podSelector:
    matchLabels:
      k8s-app: metrics-server
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # metrics.k8s.io APIService (kubectl top, HPA).
    {{- include "np.ingress.apiServer" (list $ 10250) | nindent 4 }}
  egress:
    {{- include "np.egress.apiServer" . | nindent 4 }}
    # Scrapes every kubelet.
    - to:
        {{- include "np.peer.nodes" . | nindent 8 }}
      ports:
        - port: 10250
          protocol: TCP
---
{{ include "np.header" (list $ "allow-local-path-provisioner" $ns) }}
spec:
  # API only.
  podSelector:
    matchLabels:
      app: local-path-provisioner
  policyTypes:
    - Egress
  egress:
    {{- include "np.egress.apiServer" . | nindent 4 }}
---
{{ include "np.header" (list $ "allow-k3s-helm-install-jobs" $ns) }}
spec:
  # k3s helm-controller install jobs; charts are embedded, API only.
  podSelector:
    matchExpressions:
      - key: helmcharts.helm.cattle.io/chart
        operator: Exists
  policyTypes:
    - Egress
  egress:
    {{- include "np.egress.apiServer" . | nindent 4 }}
{{- range .Values.namespaces.withoutWorkloads }}
---
{{ include "np.baseline" (list $ .) }}
{{- end }}
