{{- /*
App namespace: Browser -> Traefik -> frontend / catalog-api -> Kafka -> reservation-worker ->
Postgres + Kafka -> notification-worker.
*/}}
{{- $ns := include "np.ns.app" . -}}
{{- $pg := include "np.pgCluster" . -}}
{{ include "np.baseline" (list $ $ns) }}
---
{{ include "np.header" (list $ "allow-catalog-api" $ns) }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: ticketflow-app
      app.kubernetes.io/component: catalog-api
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Ingress paths /events and /reservations.
    - from:
        {{- include "np.peer.traefik" . | nindent 8 }}
      ports:
        - port: 8080
          protocol: TCP
    {{- include "np.ingress.prometheus" (list $ 8080) | nindent 4 }}
  egress:
    # Reads events/seats, runs the seed migration.
    - to:
        - podSelector:
            matchLabels:
              cnpg.io/cluster: {{ $pg }}
      ports:
        - port: 5432
          protocol: TCP
    # Produces ReservationRequested (SASL listener).
    - to:
        {{- include "np.peer.kafkaBrokers" . | nindent 8 }}
      ports:
        - port: 9092
          protocol: TCP
    # Schema lookup at startup + /readyz.
    - to:
        {{- include "np.peer.apicurio" . | nindent 8 }}
      ports:
        - port: 8080
          protocol: TCP
---
{{ include "np.header" (list $ "allow-frontend" $ns) }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: ticketflow-app
      app.kubernetes.io/component: frontend
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        {{- include "np.peer.traefik" . | nindent 8 }}
      ports:
        - port: 80
          protocol: TCP
  # No egress: static files only.
  egress: []
---
{{ include "np.header" (list $ "allow-reservation-worker" $ns) }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: reservation-worker
  policyTypes:
    - Ingress
    - Egress
  ingress:
    {{- include "np.ingress.prometheus" (list $ 8080) | nindent 4 }}
  egress:
    # Seat lock, reservations, migrations.
    - to:
        - podSelector:
            matchLabels:
              cnpg.io/cluster: {{ $pg }}
      ports:
        - port: 5432
          protocol: TCP
    # Consumes reservation-requested, produces reservation-result.
    - to:
        {{- include "np.peer.kafkaBrokers" . | nindent 8 }}
      ports:
        - port: 9092
          protocol: TCP
    - to:
        {{- include "np.peer.apicurio" . | nindent 8 }}
      ports:
        - port: 8080
          protocol: TCP
---
{{ include "np.header" (list $ "allow-notification-worker" $ns) }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: notification-worker
  policyTypes:
    - Ingress
    - Egress
  ingress:
    {{- include "np.ingress.prometheus" (list $ 8080) | nindent 4 }}
  egress:
    # Consumes reservation-result, may write to the dead-letter topic.
    - to:
        {{- include "np.peer.kafkaBrokers" . | nindent 8 }}
      ports:
        - port: 9092
          protocol: TCP
    - to:
        {{- include "np.peer.apicurio" . | nindent 8 }}
      ports:
        - port: 8080
          protocol: TCP
    {{- if .Values.notificationWorker.smtp.enabled }}
    # Optional SMTP (SMTP_ENABLED).
    - to:
        {{- include "np.peer.internet" . | nindent 8 }}
      ports:
        - port: {{ .Values.notificationWorker.smtp.port }}
          protocol: TCP
    {{- end }}
---
{{- $clients := list }}
{{- $clients = append $clients (dict "podSelector" (dict "matchLabels" (dict "app.kubernetes.io/instance" "ticketflow-app" "app.kubernetes.io/component" "catalog-api"))) }}
{{- $clients = append $clients (dict "podSelector" (dict "matchLabels" (dict "app.kubernetes.io/name" "reservation-worker"))) }}
{{ include "np.cnpgCluster" (dict "root" $ "ns" $ns "cluster" $pg "clients" (toYaml $clients)) }}
