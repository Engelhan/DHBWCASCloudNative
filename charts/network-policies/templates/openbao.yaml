{{- /* OpenBao: 3 HA pods, bootstrap job, own CNPG database. */}}
{{- $ns := include "np.ns.openbao" . -}}
{{- $pg := include "np.openbaoPgCluster" . -}}
{{ include "np.baseline" (list $ $ns) }}
---
{{ include "np.header" (list $ "allow-openbao-server" $ns) }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: openbao
      component: server
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # KV reads/writes by the ESO controller.
    - from:
        - {{ include "np.nsSelector" (include "np.ns.externalSecrets" .) | nindent 10 | trim }}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: external-secrets
      ports:
        - port: 8200
          protocol: TCP
    # Public UI via openbao-active.
    - from:
        {{- include "np.peer.traefik" . | nindent 8 }}
      ports:
        - port: 8200
          protocol: TCP
    # Init/unseal/config by the bootstrap job, per pod.
    - from:
        - podSelector:
            matchLabels:
              app: openbao-bootstrap
      ports:
        - port: 8200
          protocol: TCP
    # HA: standbys forward to the active node (8201) or redirect via API address (8200).
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: openbao
              component: server
      ports:
        - port: 8200
          protocol: TCP
        - port: 8201
          protocol: TCP
  egress:
    # Kubernetes auth (TokenReview) and service_registration (openbao-active label).
    {{- include "np.egress.apiServer" . | nindent 4 }}
    # Storage backend + HA lock.
    - to:
        - podSelector:
            matchLabels:
              cnpg.io/cluster: {{ $pg }}
      ports:
        - port: 5432
          protocol: TCP
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: openbao
              component: server
      ports:
        - port: 8200
          protocol: TCP
        - port: 8201
          protocol: TCP
---
{{ include "np.header" (list $ "allow-openbao-bootstrap-job" $ns) }}
spec:
  podSelector:
    matchLabels:
      app: openbao-bootstrap
  policyTypes:
    - Egress
  egress:
    # Reads/writes the openbao-unseal-keys secret.
    {{- include "np.egress.apiServer" . | nindent 4 }}
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: openbao
              component: server
      ports:
        - port: 8200
          protocol: TCP
---
{{- $clients := list (dict "podSelector" (dict "matchLabels" (dict "app.kubernetes.io/name" "openbao" "component" "server"))) }}
{{ include "np.cnpgCluster" (dict "root" $ "ns" $ns "cluster" $pg "clients" (toYaml $clients)) }}
