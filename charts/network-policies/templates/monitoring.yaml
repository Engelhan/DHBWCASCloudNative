{{- /*
Observability (monitoring): kube-prometheus-stack (Prometheus, Alertmanager, Grafana, Operator,
kube-state-metrics, Admission-Jobs), Loki (SingleBinary + Gateway + Canary + MinIO), Tempo.
node-exporter laeuft mit hostNetwork - fuer solche Pods greifen NetworkPolicies nicht.

Die Chart-eigenen Policies von kube-prometheus-stack/Tempo sind abgeschaltet; die von Prometheus
hatte live policyTypes [Ingress, Egress] ohne eine einzige Regel und schnitt Prometheus damit von
API-Server und allen Targets ab (0 aktive Targets).
*/ -}}
{{- $ns := .Values.namespaces.monitoring -}}
{{ include "np.baseline" (list $ $ns) }}
---
{{ include "np.header" (list $ "allow-prometheus" $ns) }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: prometheus
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Grafana-Datasource; Prometheus scrapt sich selbst + seinen config-reloader.
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: grafana
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - port: 9090
          protocol: TCP
        - port: 8080
          protocol: TCP
  egress:
    # Kubernetes-Service-Discovery + apiserver-ServiceMonitor.
    {{- include "np.egress.apiServer" . | nindent 4 }}
    # hostNetwork-/Host-Ziele: Kubelet/cAdvisor (10250), node-exporter (9100) und die in k3s
    # eingebetteten Komponenten, fuer die kube-prometheus-stack ServiceMonitors anlegt
    # (kube-proxy 10249, controller-manager 10257, scheduler 10259, etcd 2381).
    - to:
        {{- include "np.peer.nodes" . | nindent 8 }}
      ports:
        - port: 10250
          protocol: TCP
        - port: 9100
          protocol: TCP
        - port: 10249
          protocol: TCP
        - port: 10257
          protocol: TCP
        - port: 10259
          protocol: TCP
        - port: 2381
          protocol: TCP
    # Scrape-Ziele in allen Namespaces. Bewusst ohne Portliste: welche Ports tatsaechlich
    # erreichbar sind, regelt die Ingress-Seite jedes Ziels (np.ingress.prometheus) - eine zweite,
    # parallel zu pflegende Portliste hier waere nur eine weitere Stelle, die veralten kann.
    # Schliesst Alertmanager (9093, Alert-Zustellung) mit ein.
    - to:
        - namespaceSelector: {}
---
{{ include "np.header" (list $ "allow-alertmanager" $ns) }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: alertmanager
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Alerts von Prometheus, Scrapes (Web + config-reloader), Grafana-Datasource.
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - port: 9093
          protocol: TCP
        - port: 8080
          protocol: TCP
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: grafana
      ports:
        - port: 9093
          protocol: TCP
    # HA-Mesh zwischen Alertmanager-Replikas (bei einer Replika nur mit sich selbst).
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: alertmanager
      ports:
        - port: 9094
          protocol: TCP
        - port: 9094
          protocol: UDP
  egress:
    # Einziger Receiver ist "null" - keine Zustellung nach aussen. Wer einen echten Receiver
    # (Mail/Webhook) konfiguriert, braucht hier eine zusaetzliche Egress-Regel.
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: alertmanager
      ports:
        - port: 9094
          protocol: TCP
        - port: 9094
          protocol: UDP
---
{{ include "np.header" (list $ "allow-grafana" $ns) }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: grafana
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Kein Ingress-Objekt fuer Grafana - Zugriff per `kubectl port-forward` (laeuft ueber das
    # Kubelet direkt in den Pod und ist von NetworkPolicies nicht betroffen).
    {{- include "np.ingress.prometheus" (list $ 3000) | nindent 4 }}
  egress:
    # Sidecars (grafana-sc-dashboard/-datasources) beobachten ConfigMaps/Secrets.
    {{- include "np.egress.apiServer" . | nindent 4 }}
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - port: 9090
          protocol: TCP
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: alertmanager
      ports:
        - port: 9093
          protocol: TCP
    # Loki-Datasource zeigt auf loki-gateway (Service 80 -> Container 8080).
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: loki
              app.kubernetes.io/component: gateway
      ports:
        - port: 8080
          protocol: TCP
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: tempo
      ports:
        - port: 3200
          protocol: TCP
---
{{ include "np.header" (list $ "allow-prometheus-operator" $ns) }}
spec:
  podSelector:
    matchLabels:
      app: kube-prometheus-stack-operator
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Admission-Webhook kube-prometheus-stack-admission (PrometheusRule-Validierung) + Metriken.
    {{- include "np.ingress.apiServer" (list $ 10250) | nindent 4 }}
    {{- include "np.ingress.prometheus" (list $ 10250) | nindent 4 }}
  egress:
    {{- include "np.egress.apiServer" . | nindent 4 }}
---
{{ include "np.header" (list $ "allow-kube-state-metrics" $ns) }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: kube-state-metrics
  policyTypes:
    - Ingress
    - Egress
  ingress:
    {{- include "np.ingress.prometheus" (list $ 8080 8081) | nindent 4 }}
  egress:
    {{- include "np.egress.apiServer" . | nindent 4 }}
---
{{ include "np.header" (list $ "allow-prometheus-admission-jobs" $ns) }}
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values:
          - kube-prometheus-stack-admission-create
          - kube-prometheus-stack-admission-patch
  policyTypes:
    - Egress
  egress:
    # Erzeugen das Webhook-Zertifikat und patchen die Webhook-Konfigurationen.
    {{- include "np.egress.apiServer" . | nindent 4 }}
---
{{ include "np.header" (list $ "allow-loki" $ns) }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: loki
      app.kubernetes.io/component: single-binary
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Push/Query/Tail kommen ausschliesslich ueber den Gateway.
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: loki
              app.kubernetes.io/component: gateway
      ports:
        - port: 3100
          protocol: TCP
    # Memberlist-Ring und interner gRPC - auch mit einer Replika spricht Loki sich selbst ueber
    # die Pod-IP an.
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: loki
              app.kubernetes.io/component: single-binary
      ports:
        - port: 3100
          protocol: TCP
        - port: 7946
          protocol: TCP
        - port: 9095
          protocol: TCP
    {{- include "np.ingress.prometheus" (list $ 3100) | nindent 4 }}
  egress:
    # Sidecar loki-sc-rules beobachtet ConfigMaps mit Alert-Regeln.
    {{- include "np.egress.apiServer" . | nindent 4 }}
    # Chunk-/Index-Store (S3-kompatibel).
    - to:
        - podSelector:
            matchLabels:
              app: minio
              release: loki
      ports:
        - port: 9000
          protocol: TCP
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: loki
              app.kubernetes.io/component: single-binary
      ports:
        - port: 3100
          protocol: TCP
        - port: 7946
          protocol: TCP
        - port: 9095
          protocol: TCP
---
{{ include "np.header" (list $ "allow-loki-gateway" $ns) }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: loki
      app.kubernetes.io/component: gateway
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: grafana
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: loki
              app.kubernetes.io/component: canary
      ports:
        - port: 8080
          protocol: TCP
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: loki
              app.kubernetes.io/component: single-binary
      ports:
        - port: 3100
          protocol: TCP
---
{{ include "np.header" (list $ "allow-loki-canary" $ns) }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: loki
      app.kubernetes.io/component: canary
  policyTypes:
    - Ingress
    - Egress
  ingress:
    {{- include "np.ingress.prometheus" (list $ 3500) | nindent 4 }}
  egress:
    # Schreibt Testzeilen und liest sie per Websocket-Tail zurueck (-addr=loki-gateway:80).
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: loki
              app.kubernetes.io/component: gateway
      ports:
        - port: 8080
          protocol: TCP
---
{{ include "np.header" (list $ "allow-loki-minio" $ns) }}
spec:
  podSelector:
    matchLabels:
      app: minio
      release: loki
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Loki + der MinIO-Post-Install-Job (legt die Buckets an).
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: loki
              app.kubernetes.io/component: single-binary
        - podSelector:
            matchLabels:
              app: minio-job
              release: loki
      ports:
        - port: 9000
          protocol: TCP
  egress: []
---
{{ include "np.header" (list $ "allow-loki-minio-job" $ns) }}
spec:
  podSelector:
    matchLabels:
      app: minio-job
      release: loki
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: minio
              release: loki
      ports:
        - port: 9000
          protocol: TCP
---
{{ include "np.header" (list $ "allow-tempo" $ns) }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: tempo
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Query-API (Grafana-Datasource) und Metriken teilen sich Port 3200.
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: grafana
      ports:
        - port: 3200
          protocol: TCP
    {{- include "np.ingress.prometheus" (list $ 3200) | nindent 4 }}
    # Memberlist/gRPC mit sich selbst (Single-Binary spricht sich ueber die Pod-IP an).
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: tempo
    # Keine OTLP-/Jaeger-/Zipkin-Freigabe: kein Service in diesem Cluster sendet Traces. Wer
    # Tracing einbaut, gibt hier 4317/4318 fuer den jeweiligen Sender frei.
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: tempo
