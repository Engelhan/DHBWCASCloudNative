{{- /*
External Secrets Operator (ticketflow.namespaces.externalSecrets): Controller, Webhook,
Cert-Controller. Der ClusterSecretStore (charts/openbao-secretstore) hat keine Pods.
*/ -}}
{{- $ns := include "np.ns.externalSecrets" . -}}
{{ include "np.baseline" (list $ $ns) }}
---
{{ include "np.header" (list $ "allow-external-secrets-controller" $ns) }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: external-secrets
  policyTypes:
    - Ingress
    - Egress
  ingress:
    {{- include "np.ingress.prometheus" (list $ 8080) | nindent 4 }}
  egress:
    {{- include "np.egress.apiServer" . | nindent 4 }}
    # ExternalSecret/PushSecret gegen OpenBao (Service openbao-active).
    - to:
        - {{ include "np.nsSelector" (include "np.ns.openbao" .) | nindent 10 | trim }}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: openbao
              component: server
      ports:
        - port: 8200
          protocol: TCP
---
{{ include "np.header" (list $ "allow-external-secrets-webhook" $ns) }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: external-secrets-webhook
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # ValidatingWebhookConfigurations externalsecret-/secretstore-validate.
    {{- include "np.ingress.apiServer" (list $ 10250) | nindent 4 }}
    {{- include "np.ingress.prometheus" (list $ 8080) | nindent 4 }}
  egress:
    {{- include "np.egress.apiServer" . | nindent 4 }}
---
{{ include "np.header" (list $ "allow-external-secrets-cert-controller" $ns) }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: external-secrets-cert-controller
  policyTypes:
    - Ingress
    - Egress
  ingress:
    {{- include "np.ingress.prometheus" (list $ 8080) | nindent 4 }}
  egress:
    # Rotiert das Webhook-Zertifikat und patcht caBundle in Webhook-Konfiguration/CRDs.
    {{- include "np.egress.apiServer" . | nindent 4 }}
