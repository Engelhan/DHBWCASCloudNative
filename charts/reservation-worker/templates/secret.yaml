{{- if .Values.secret.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "reservation-worker.fullname" . }}
  labels:
    {{- include "reservation-worker.labels" . | nindent 4 }}
type: Opaque
stringData:
  # Platzhalter; echter Wert via --set/--set-file/External Secret zur Deploy-Zeit, nie im Repo
  # committen (siehe values.yaml-Kommentar zum offenen Namespace/Secret-Punkt).
  DATABASE_URL: {{ .Values.secret.databaseUrl | quote }}
{{- end }}
