{{- if .Values.databaseSecret.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "reservation-worker.fullname" . }}
  labels:
    {{- include "reservation-worker.labels" . | nindent 4 }}
type: Opaque
stringData:
  # Lab-Zugangsdaten, siehe values.yaml-Kommentar. Muss mit charts/postgres-cluster values.yaml
  # database.owner/.password uebereinstimmen (gleiches Muster wie charts/ticketflow-app).
  username: {{ .Values.databaseSecret.username | quote }}
  password: {{ .Values.databaseSecret.password | quote }}
{{- end }}
