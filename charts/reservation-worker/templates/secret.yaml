{{- if .Values.databaseSecret.create }}
apiVersion: v1
kind: Secret
metadata:
  # NICHT {{ "{{" }} include "reservation-worker.fullname" . {{ "}}" }} alleine - kollidiert mit
  # dem von Strimzi's User-Operator fuer die gleichnamige KafkaUser-CR "reservation-worker"
  # (charts/kafka-cluster) automatisch angelegten Secret im selben Namespace "ticketflow". Beide
  # hiessen zuvor identisch "reservation-worker"; der User-Operator reconciled kontinuierlich und
  # ueberschrieb das Secret live immer wieder mit seinem eigenen Inhalt (nur "password"/
  # "sasl.jaas.config", kein "username") - DB_USER (deployment.yaml) verlor dadurch seinen
  # secretKeyRef-Key und der Pod ging in CreateContainerConfigError
  # ("couldn't find key username in Secret ticketflow/reservation-worker"). Eigener Name loest
  # die Kollision auf.
  name: {{ include "reservation-worker.fullname" . }}-db-credentials
  labels:
    {{- include "reservation-worker.labels" . | nindent 4 }}
type: Opaque
stringData:
  # Lab-Zugangsdaten, siehe values.yaml-Kommentar. Muss mit charts/postgres-cluster values.yaml
  # database.owner/.password uebereinstimmen (gleiches Muster wie charts/ticketflow-app).
  username: {{ .Values.databaseSecret.username | quote }}
  password: {{ .Values.databaseSecret.password | quote }}
{{- end }}
