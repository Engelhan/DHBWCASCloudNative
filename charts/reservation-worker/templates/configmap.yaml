apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "reservation-worker.fullname" . }}
  labels:
    {{- include "reservation-worker.labels" . | nindent 4 }}
data:
  DB_HOST: {{ .Values.database.host | quote }}
  DB_PORT: {{ .Values.database.port | quote }}
  DB_NAME: {{ .Values.database.name | quote }}
  DB_SSLMODE: {{ .Values.database.sslMode | quote }}
  KAFKA_BROKERS: {{ .Values.config.kafkaBrokers | quote }}
  KAFKA_SASL_ENABLED: {{ .Values.config.kafkaSasl.enabled | quote }}
  KAFKA_SASL_USERNAME: {{ .Values.config.kafkaSasl.username | quote }}
  RESERVATION_TOPIC: {{ .Values.config.reservationTopic | quote }}
  RESULT_TOPIC: {{ .Values.config.resultTopic | quote }}
  CONSUMER_GROUP: {{ .Values.config.consumerGroup | quote }}
  PROCESS_MAX_RETRIES: {{ .Values.config.processMaxRetries | quote }}
  PROCESS_RETRY_BACKOFF: {{ .Values.config.processRetryBackoff | quote }}
  REGISTRY_URL: {{ .Values.config.registryUrl | quote }}
  REGISTRY_GROUP_ID: {{ .Values.config.registryGroupId | quote }}
  LOG_LEVEL: {{ .Values.config.logLevel | quote }}
  HTTP_ADDR: {{ .Values.config.httpAddr | quote }}
