# P6: scale on consumer-group lag. KEDA takes username/password only via secretTargetRef and the
# Strimzi secret has no username key, hence this small secret; the password comes straight from
# Strimzi's secret.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "reservation-worker.fullname" . }}-keda-auth
  labels:
    {{- include "reservation-worker.labels" . | nindent 4 }}
type: Opaque
stringData:
  username: {{ .Values.config.kafkaSasl.username | quote }}
---
apiVersion: keda.sh/v1alpha1
kind: TriggerAuthentication
metadata:
  name: {{ include "reservation-worker.fullname" . }}-kafka-lag
  labels:
    {{- include "reservation-worker.labels" . | nindent 4 }}
spec:
  secretTargetRef:
    - parameter: username
      name: {{ include "reservation-worker.fullname" . }}-keda-auth
      key: username
    - parameter: password
      name: {{ .Values.config.kafkaSasl.secretName }}
      key: password
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: {{ include "reservation-worker.fullname" . }}
  labels:
    {{- include "reservation-worker.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    name: {{ include "reservation-worker.fullname" . }}
  minReplicaCount: {{ .Values.config.keda.minReplicaCount }}
  maxReplicaCount: {{ .Values.config.keda.maxReplicaCount }}
  pollingInterval: {{ .Values.config.keda.pollingInterval }}
  cooldownPeriod: {{ .Values.config.keda.cooldownPeriod }}
  # cooldownPeriod only applies to scale-to-zero; above that the HPA window governs (default 300s).
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleDown:
          stabilizationWindowSeconds: {{ .Values.config.keda.scaleDownStabilizationSeconds }}
  triggers:
    - type: kafka
      authenticationRef:
        name: {{ include "reservation-worker.fullname" . }}-kafka-lag
      metadata:
        bootstrapServers: {{ include "reservation-worker.kafkaBootstrap" . | quote }}
        consumerGroup: {{ .Values.config.consumerGroup | quote }}
        topic: {{ .Values.config.reservationTopic | quote }}
        lagThreshold: {{ .Values.config.keda.lagThreshold | quote }}
        # Must match the consumer (kafka-go starts at FirstOffset); with "latest" KEDA counts every
        # uncommitted partition as lag 1.
        offsetResetPolicy: earliest
        sasl: {{ .Values.config.kafkaSasl.enabled | ternary "scram_sha512" "none" | quote }}
        tls: disable
