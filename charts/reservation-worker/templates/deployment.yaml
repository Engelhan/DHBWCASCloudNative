apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "reservation-worker.fullname" . }}
  labels:
    {{- include "reservation-worker.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "reservation-worker.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "reservation-worker.labels" . | nindent 8 }}
    spec:
      # Weiche Verteilung ueber die drei simulierten Regionen (P4) - siehe values.yaml-Kommentar
      # bei topologySpreadConstraint. whenUnsatisfiable: ScheduleAnyway statt DoNotSchedule, weil
      # replicaCount: 1 (bzw. KEDA minReplicaCount: 1) sonst auf einem Ein-Node-Dev-Setup haengen
      # bleiben wuerde - gleiches Muster wie charts/ticketflow-app.
      {{- if .Values.topologySpreadConstraint.enabled }}
      topologySpreadConstraints:
        - maxSkew: {{ .Values.topologySpreadConstraint.maxSkew }}
          topologyKey: topology.ticketflow/region
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "reservation-worker.selectorLabels" . | nindent 14 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: reservation-worker
          image: {{ include "reservation-worker.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "reservation-worker.fullname" . }}
          env:
            # Aus dem von charts/postgres-cluster angelegten Secret - Keys "username"/"password",
            # deshalb explizit gemappt statt per envFrom (das wuerde Env-Vars "username"/
            # "password" statt "DB_USER"/"DB_PASSWORD" erzeugen). Seit Datenbank und Anwendung
            # denselben Namespace teilen, ist dafuer kein chart-eigenes Duplikat mehr noetig.
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "reservation-worker.databaseSecretName" . }}
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "reservation-worker.databaseSecretName" . }}
                  key: password
            {{- if .Values.config.kafkaSasl.enabled }}
            - name: KAFKA_SASL_PASSWORD
              valueFrom:
                secretKeyRef:
                  # Vom Strimzi User Operator automatisch angelegtes Secret (siehe
                  # values.yaml-Kommentar bei config.kafkaSasl) - nicht dieser Chart.
                  name: {{ .Values.config.kafkaSasl.secretName }}
                  key: password
            {{- end }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
