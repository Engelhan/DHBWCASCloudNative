apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "reservation-worker.fullname" . }}
  labels:
    {{- include "reservation-worker.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "reservation-worker.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "reservation-worker.labels" . | nindent 8 }}
    spec:
      # P4: hard spread across regions; matchLabelKeys ignores old pods during rollouts.
      {{- if .Values.topologySpreadConstraint.enabled }}
      topologySpreadConstraints:
        - maxSkew: {{ .Values.topologySpreadConstraint.maxSkew }}
          topologyKey: topology.ticketflow/region
          whenUnsatisfiable: DoNotSchedule
          matchLabelKeys:
            - pod-template-hash
          labelSelector:
            matchLabels:
              {{- include "reservation-worker.selectorLabels" . | nindent 14 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: reservation-worker
          image: {{ include "reservation-worker.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "reservation-worker.fullname" . }}
          env:
            # Explicit mapping: envFrom would yield env vars named username/password.
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "reservation-worker.databaseSecretName" . }}
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "reservation-worker.databaseSecretName" . }}
                  key: password
            {{- if .Values.config.kafkaSasl.enabled }}
            - name: KAFKA_SASL_PASSWORD
              valueFrom:
                secretKeyRef:
                  # Created by the Strimzi User Operator.
                  name: {{ .Values.config.kafkaSasl.secretName }}
                  key: password
            {{- end }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
