{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "reservation-worker.fullname" . }}
  labels:
    {{- include "reservation-worker.labels" . | nindent 4 }}
spec:
  # podSelector bewusst auf die eigenen Pod-Labels beschraenkt, niemals leer - siehe
  # charts/README.md fuer den dokumentierten Loki-Vorfall (leerer podSelector traf alle Pods im
  # geteilten Namespace).
  podSelector:
    matchLabels:
      {{- include "reservation-worker.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    # Nur Prometheus-Scraping aus dem monitoring-Namespace erlauben. Egress bleibt offen: Kafka-
    # und Postgres-Traffic aus diesem Chart heraus sicher einzugrenzen ist ohne die endgueltige
    # Netzwerktopologie (siehe values.yaml - offener Namespace/Secret-Punkt) nicht sinnvoll
    # planbar.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - port: http
          protocol: TCP
{{- end }}
