{{- if .Values.podMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: {{ include "reservation-worker.fullname" . }}
  labels:
    {{- include "reservation-worker.labels" . | nindent 4 }}
    {{- with .Values.podMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  # PodMonitor statt ServiceMonitor: siehe values.yaml-Kommentar - kein anderer Konsumenten der
  # HTTP-Endpunkte, eine eigene Service-Ressource waere unnoetig.
  selector:
    matchLabels:
      {{- include "reservation-worker.selectorLabels" . | nindent 6 }}
  podMetricsEndpoints:
    - port: http
      path: /metrics
      interval: {{ .Values.podMonitor.interval }}
{{- end }}
