# Set via gitops/env/cluster.yaml; empty default only for a readable error.
ticketflow: {}

# Empty: registry/tag from gitops/env/cluster.yaml. Never :latest (P3).
image:
  repository: ""
  tag: ""
  pullPolicy: IfNotPresent

# Initial value only; KEDA owns replicas afterwards (ArgoCD ignores spec.replicas).
replicaCount: 2

# Go binary, I/O-bound (waits on Postgres/Kafka): small requests, since KEDA runs up to 10 copies.
# CPU limit 10x for schema validation bursts; throughput scales with pods, not CPU per pod.
resources:
  requests:
    cpu: 25m
    memory: 48Mi
  limits:
    cpu: 250m
    memory: 128Mi

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

config:
  # Empty = derived (SASL listener 9092).
  kafkaBrokers: ""
  reservationTopic: "reservation-requested"
  resultTopic: "reservation-result"
  consumerGroup: "reservation-worker"
  processMaxRetries: 3
  processRetryBackoff: "2s"

  # B2: SCRAM as KafkaUser reservation-worker; secret created by Strimzi.
  kafkaSasl:
    enabled: true
    username: reservation-worker
    secretName: reservation-worker

  # P6: scale on consumer lag, not CPU.
  # max 10 pods = 2 of the 20 partitions each; the single Postgres primary is the real limit.
  # lagThreshold 10: desired pods = ceil(lag / 10).
  # pollingInterval is inert with minReplicaCount >= 1 (HPA polls every 15s).
  # scaleDownStabilizationSeconds 60 instead of the HPA's 300.
  # minReplicaCount 2: always two pods in two regions (P4/P5).
  keda:
    minReplicaCount: 2
    maxReplicaCount: 10
    lagThreshold: "10"
    pollingInterval: 15
    scaleDownStabilizationSeconds: 60
    cooldownPeriod: 60

  # Empty = derived from ticketflow.namespaces.kafka.
  registryUrl: ""
  registryGroupId: "ticketflow"
  logLevel: "info"
  httpAddr: ":8080"

# The app builds its DSN from these parts + the secret. Empty host/name/secret = derived from
# ticketflow.postgres.databaseName (CNPG's <db>-postgres-cluster-app, not via OpenBao).
database:
  host: ""
  port: "5432"
  name: ""
  sslMode: "require"
  credentialsSecretName: ""

# Off: no Prometheus in the cluster (KEDA reads Kafka directly).
podMonitor:
  enabled: false
  interval: 30s
  labels:
    release: kube-prometheus-stack

# maxUnavailable fits a varying replica count (2..10); messages wait in Kafka meanwhile (P5).
podDisruptionBudget:
  enabled: true
  maxUnavailable: 1

# P4: hard spread across regions (10 pods -> 4/3/3).
topologySpreadConstraint:
  enabled: true
  maxSkew: 1
