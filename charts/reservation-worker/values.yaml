image:
  repository: ghcr.io/engelhan/ticketflow-reservation-worker # siehe .github/workflows/build-images.yml
  # Git-Short-SHA aus build-images.yml, kein :latest (siehe P3). a0acfac6 war stale (vor dem
  # DB_HOST/DB_USER-Refactor und der SASL-Anbindung gebaut) - 4579b884 (Commit
  # "chore(reservation-worker): re-trigger image build") ist der neueste, gegen ghcr.io
  # verifizierte Tag mit aktuellem Code. Bei jedem neuen build-images.yml-Lauf, der
  # src/reservation-worker aendert, hier den dann aktuellen Tag eintragen.
  tag: "4579b884"
  pullPolicy: IfNotPresent

# Startwert, bis das ScaledObject unten (keda.minReplicaCount/.maxReplicaCount) den ersten Scale-
# Reconcile durchfuehrt und die Kontrolle uebernimmt. gitops/apps/reservation-worker.yaml
# ignoriert spec.replicas fuer dieses Deployment explizit (ArgoCD ignoreDifferences) - sonst
# wuerde selfHeal jede KEDA-Skalierung sofort wieder auf diesen Wert zuruecksetzen.
replicaCount: 1

resources:
  requests:
    cpu: 25m
    memory: 48Mi
  limits:
    cpu: 250m
    memory: 128Mi

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

config:
  # Echter Wert: Strimzi-Bootstrap-Service aus charts/kafka-cluster, gleicher Namespace "ticketflow".
  # Port 9092 = Strimzi's "plain"-Listener - seit B2 SASL_PLAINTEXT (SCRAM-Auth, siehe
  # kafkaSasl unten), Transport bleibt unverschluesselt.
  kafkaBrokers: "ticketflow-kafka-kafka-bootstrap.ticketflow.svc:9092"
  reservationTopic: "reservation-requested"
  resultTopic: "reservation-result"
  consumerGroup: "reservation-worker"
  processMaxRetries: 3
  processRetryBackoff: "2s"

  # B2 (Root-README ## Entscheidungen): SASL/SCRAM-SHA-512-Auth gegen die vom Strimzi User
  # Operator verwaltete KafkaUser "reservation-worker" (siehe charts/kafka-cluster values.yaml
  # kafka.users). secretName referenziert das vom User Operator AUTOMATISCH angelegte Secret
  # (Keys "password"/"sasl.jaas.config") direkt per secretKeyRef - kein eigenes Secret noetig wie
  # bei Postgres, weil dieser Chart und der Kafka-Cluster denselben Namespace "ticketflow" teilen.
  kafkaSasl:
    enabled: true
    username: reservation-worker
    secretName: reservation-worker

  # P6 (Root-README ## Entscheidungen): KEDA skaliert auf Basis des Kafka-Consumer-Group-Lags
  # von config.consumerGroup, nicht CPU. Siehe templates/keda-scaledobject.yaml + gitops/apps/
  # keda.yaml (Operator-Chart). maxReplicaCount: 3 ist bewusst an die tatsaechlich synchte
  # Kafka-Partitionszahl gebunden - gitops/apps/kafka-cluster.yaml faehrt aktuell mit
  # values-dev.yaml (charts/kafka-cluster), das reservation-requested nur 3 Partitionen gibt (ein
  # Consumer pro Partition ist das Maximum innerhalb einer Consumer-Group; mehr Replicas als
  # Partitionen wuerden nur untaetig herumstehen). Bei einem Wechsel auf values-prod.yaml (8
  # Partitionen) muss dieser Wert auf 8 mitgezogen werden. lagThreshold: "10" passt zum
  # 30-Sitzplatz-Demo-Event aus local/postgres/init.sql - ein kompletter Sellout-Burst (~30
  # gleichzeitige Reservierungen) erzeugt genug Lag, um bis auf maxReplicaCount hochzuskalieren.
  # pollingInterval/cooldownPeriod bewusst kuerzer als KEDAs Standard (30s/300s), damit ein
  # Flash-Sale-Screencast Skalierung UND Rueckskalierung in vertretbarer Zeit zeigt, statt bis zu
  # 5 Minuten auf das Cooldown zu warten.
  keda:
    minReplicaCount: 1
    maxReplicaCount: 3
    lagThreshold: "10"
    pollingInterval: 15
    cooldownPeriod: 60

  # Apicurio Registry (charts/apicurio), siehe charts/kafka-cluster/values.yaml schemaRegistry.* fuer
  # denselben Wert - kein Secret, keine Zugangsdaten involviert (siehe charts/apicurio/Chart.yaml).
  registryUrl: "http://apicurio.kafka.svc:8080/apis/registry/v3"
  registryGroupId: "ticketflow"
  logLevel: "info"
  httpAddr: ":8080"

# Anwendung baut den Connection-String selbst aus Host/Port/Name (hier, ConfigMap) +
# Username/Passwort (Secret unten) zusammen - gleiches Muster wie charts/ticketflow-app
# catalogApi.database, CNPG (charts/postgres-cluster) liefert ohnehin nur username/password
# getrennt, kein fertiges DATABASE_URL.
database:
  host: "postgres-postgres-cluster-rw.application.svc.cluster.local"
  port: "5432"
  name: "postgres"
  sslMode: "require"

# Chart legt das Secret selbst an (Niklas' Vorgabe, analog zu charts/notification-worker/
# templates/secret.yaml und charts/ticketflow-app catalogApi.databaseSecret - kein externes
# Copy-Skript mehr). Lab-Zugangsdaten (2026-09-16, auf expliziten Wunsch direkt hier hinterlegt
# statt CHANGE_ME/--set, da fuer diesen Kurs kein produktionsartiges Geheimnis) - muss mit
# charts/postgres-cluster values.yaml database.owner/.password uebereinstimmen (dort ebenfalls
# hardcoded, siehe dessen Kommentar).
databaseSecret:
  create: true
  username: "postgres"
  password: "ticketflow"

# PodMonitor statt ServiceMonitor: es gibt keinen anderen Konsumenten der HTTP-Endpunkte (reiner
# Kafka-Consumer, Kubelet-Probes gehen direkt an den Pod), daher auch keine eigene
# Service-Ressource in diesem Chart - siehe templates/podmonitor.yaml.
podMonitor:
  enabled: true
  interval: 30s
  # Analog zu charts/notification-worker/values.yaml: Annahme, nicht live verifiziert.
  labels:
    release: kube-prometheus-stack

networkPolicy:
  enabled: false # Default aus, wie im Repo sonst ueblich (siehe charts/README.md)

podDisruptionBudget:
  enabled: true # jetzt sinnvoll: KEDA kann tatsaechlich > 1 Replica fahren (siehe keda oben)
  minAvailable: 1

# Weiche Verteilung ueber die drei simulierten Regionen (P4) - gleiches Muster wie
# charts/ticketflow-app catalogApi.topologySpreadConstraint. Bei replicaCount: 1 (bzw. KEDAs
# minReplicaCount: 1) wirkungslos, aber sobald KEDA hochskaliert (config.keda.maxReplicaCount),
# verteilt sich reservation-worker ueber die Regionen statt sich auf einem Node zu haeufen.
topologySpreadConstraint:
  enabled: true
  maxSkew: 1
