# Zentrale, deployment-weite Werte - werden NICHT hier gepflegt, sondern in
# gitops/env/cluster.yaml (ArgoCD reicht die Datei jedem Chart per Multi-Source "$values"
# durch, siehe gitops/applicationset.yaml). Der leere Default steht hier nur, damit ein
# Rendern ohne diese Datei eine verstaendliche Fehlermeldung statt eines Nil-Pointers liefert.
# Lokal deshalb immer:
#   helm template <name> charts/<name> -f charts/<name>/values.yaml -f gitops/env/cluster.yaml
ticketflow: {}

# Registry und Tag kommen zentral aus gitops/env/cluster.yaml (ticketflow.imageRegistry /
# .imageTag) - ein Image-Bump beruehrt damit genau eine Stelle im Repo und gilt fuer alle vier
# Services gleichzeitig; .github/workflows/build-images.yml schreibt den Tag dort automatisch
# fort. Die beiden Felder hier sind nur ein bewusster Einzelfall-Override (z.B. ein Test-Build
# aus einer anderen Registry) und bleiben normalerweise leer. Nie :latest (P3) - das verbietet
# auch values.schema.json.
image:
  repository: ""
  tag: ""
  pullPolicy: IfNotPresent

# Startwert, bis das ScaledObject unten (keda.minReplicaCount/.maxReplicaCount) den ersten Scale-
# Reconcile durchfuehrt und die Kontrolle uebernimmt. Das ApplicationSet-Element reservation-worker
# ignoriert spec.replicas fuer dieses Deployment explizit (ArgoCD ignoreDifferences) - sonst
# wuerde selfHeal jede KEDA-Skalierung sofort wieder auf diesen Wert zuruecksetzen. Gleich
# config.keda.minReplicaCount, damit schon vor dem ersten Reconcile zwei Pods in zwei Regionen laufen.
replicaCount: 2

# P4 - Herleitung der Zahlen (statisch gelinktes Go-Binary, kein JVM/Runtime-Overhead):
#   memory 48Mi request: Go-Runtime + Prometheus-Registry ~10-15Mi, kafka-go-Reader-Fetch-Puffer
#     (Default MaxBytes 1MB je Fetch) + pgxpool (Default max(4, CPU-Anzahl) Verbindungen) +
#     eingebettete JSON-Schemas - im Leerlauf ~20-30Mi, 48Mi = Leerlauf plus Puffer fuer den
#     normalen Durchsatz. Klein gehalten, weil KEDA bis zu maxReplicaCount Kopien davon
#     gleichzeitig einplant - jedes Mi hier zaehlt dreifach (prod: achtfach).
#   memory 128Mi limit: ~2,5x Request - deckt GC-Spitzen im Flash-Sale-Burst (viele kurzlebige
#     Event-Structs/JSON-Decodes), begrenzt aber ein Leck, bevor es den Node belastet.
#   cpu 25m request: ein Consumer verarbeitet nachrichtenweise und wartet dabei fast nur auf
#     Postgres (UPDATE ... WHERE status='free') und Kafka - I/O-gebunden, deshalb skaliert P6
#     auch nicht auf CPU. 25m reicht, damit Idle-Pods auf keinem Node Platz blockieren.
#   cpu 250m limit: 10x Request fuer Bursts (JSON-Schema-Validierung + Framing je Nachricht);
#     mehr bringt nichts, weil der Durchsatz je Pod von der DB-Latenz begrenzt wird - mehr
#     Durchsatz kommt ueber mehr Pods (KEDA), nicht ueber mehr CPU je Pod.
#   Nachmessen: `kubectl top pod -n ticketflow -l app.kubernetes.io/name=reservation-worker`
#   waehrend des k6-Flash-Sale-Tests.
resources:
  requests:
    cpu: 25m
    memory: 48Mi
  limits:
    cpu: 250m
    memory: 128Mi

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

config:
  # Echter Wert: Strimzi-Bootstrap-Service aus charts/kafka-cluster, gleicher Namespace "ticketflow".
  # Port 9092 = Strimzi's "plain"-Listener - seit B2 SASL_PLAINTEXT (SCRAM-Auth, siehe
  # kafkaSasl unten), Transport bleibt unverschluesselt.
  # Leer lassen: wird aus ticketflow.kafka.clusterName + ticketflow.namespaces.kafka
  # abgeleitet (Kafka laeuft in einem eigenen Namespace, siehe gitops/env/cluster.yaml).
  kafkaBrokers: ""
  reservationTopic: "reservation-requested"
  resultTopic: "reservation-result"
  consumerGroup: "reservation-worker"
  processMaxRetries: 3
  processRetryBackoff: "2s"

  # B2 (Root-README ## Entscheidungen): SASL/SCRAM-SHA-512-Auth gegen die vom Strimzi User
  # Operator verwaltete KafkaUser "reservation-worker" (siehe charts/kafka-cluster values.yaml
  # kafka.users). secretName referenziert das vom User Operator AUTOMATISCH angelegte Secret
  # (Keys "password"/"sasl.jaas.config") direkt per secretKeyRef - kein eigenes Secret noetig wie
  # bei Postgres, weil dieser Chart und der Kafka-Cluster denselben Namespace "ticketflow" teilen.
  kafkaSasl:
    enabled: true
    username: reservation-worker
    secretName: reservation-worker

  # B2 (Root-README ## Bonus): KEDA skaliert auf Basis des Kafka-Consumer-Group-Lags von
  # config.consumerGroup, nicht CPU. Siehe templates/keda-scaledobject.yaml + charts/keda
  # (Operator).
  #
  # maxReplicaCount: 10 bei 20 Partitionen von reservation-requested (charts/kafka-cluster
  # values.yaml, in dev und prod gleich). Innerhalb einer Consumer-Group bekommt jede Partition
  # genau einen Consumer - die Partitionszahl ist die harte Obergrenze, KEDA kappt ohnehin dort.
  # 10 statt 20, weil jeder Pod exakt 2 Partitionen bekommt (20/10, keine ungleiche Last) und die
  # eigentliche Grenze dahinter der eine Postgres-Primary ist, auf den alle Pods gleichzeitig
  # schreiben (Verbindungen sind kein Engpass: jeder Pod arbeitet sequenziell und haelt damit
  # praktisch eine, max_connections ist 100). Ist der Primary ausgelastet, bringen weitere Pods
  # keinen Durchsatz mehr. Die 20
  # Partitionen lassen Reserve bis 20 Pods, ohne das Topic neu anlegen zu muessen (Kafka kann
  # Partitionen nur erhoehen, nie reduzieren).
  #
  # lagThreshold: "10" = Ziel-Rueckstand pro Pod. KEDA rechnet gewuenschte Replicas =
  # ceil(Gesamt-Lag / 10). Bewusst niedrig: jede der drei Hallen hat 1000 Plaetze, ein
  # Flash-Sale-Burst erzeugt weit mehr als 10 offene Nachrichten und skaliert zuverlaessig, sobald
  # der Zufluss die Verarbeitung eines Pods uebersteigt.
  #
  # Bei minReplicaCount >= 1 fragt das von KEDA erzeugte HPA den Lag selbst ab, im eigenen
  # 15s-Takt ueber KEDAs Metrics-API; pollingInterval wirkt dann gar nicht (nur bei Skalierung
  # auf/von 0 bzw. useCachedMetrics - KEDAs Admission-Webhook warnt entsprechend). Der Wert bleibt
  # nur gesetzt, damit ein spaeteres minReplicaCount: 0 nicht auf 30s zurueckfaellt. Das
  # Hochskalieren begrenzt das HPA auf Verdopplung bzw. +4 Pods je 15s - 2 -> 10 in ~30s.
  # scaleDownStabilizationSeconds 60 (HPA-Default 300): das HPA nimmt fuer das Rueckskalieren
  # den hoechsten Wunschwert der letzten 60s - kein Flattern zwischen zwei Polls, aber ein
  # Screencast zeigt das Zurueckgehen nach einer Minute statt nach fuenf.
  # cooldownPeriod wirkt nur beim Skalieren auf 0, bei minReplicaCount: 2 also nicht.
  # minReplicaCount: 2 - auch ohne Last immer zwei Pods in zwei Regionen (P4/P5), ein Node-Ausfall
  # haelt die Reservierungsverarbeitung damit nie bis zum naechsten Scale-Up an.
  keda:
    minReplicaCount: 2
    maxReplicaCount: 10
    lagThreshold: "10"
    pollingInterval: 15
    scaleDownStabilizationSeconds: 60
    cooldownPeriod: 60

  # Apicurio Registry (charts/apicurio), siehe charts/kafka-cluster/values.yaml schemaRegistry.* fuer
  # denselben Wert - kein Secret, keine Zugangsdaten involviert (siehe charts/apicurio/Chart.yaml).
  # Leer lassen: wird aus ticketflow.namespaces.kafka abgeleitet.
  registryUrl: ""
  registryGroupId: "ticketflow"
  logLevel: "info"
  httpAddr: ":8080"

# Anwendung baut den Connection-String selbst aus Host/Port/Name (hier, ConfigMap) +
# Username/Passwort (Secret unten) zusammen - gleiches Muster wie charts/ticketflow-app
# catalogApi.database, CNPG (charts/postgres-cluster) liefert ohnehin nur username/password
# getrennt, kein fertiges DATABASE_URL.
# Die Anwendung baut ihren Connection-String selbst aus diesen Einzelteilen + dem Secret
# zusammen (Team-Entscheidung, siehe src/*/README.md ## Konfiguration). host/name leer lassen:
# beide werden aus ticketflow.postgres.databaseName abgeleitet, weil die Datenbank im selben
# Namespace laeuft (gitops/env/cluster.yaml -> ticketflow.namespaces.app).
# credentialsSecretName zeigt per Default auf das von CNPG selbst erzeugte Secret
# "<databaseName>-postgres-cluster-app" (Keys username/password) - direkt, nicht ueber OpenBao:
# die Datenbank-Zugangsdaten sollen nicht von einem entsiegelten Secret-Vault abhaengen.
database:
  host: ""
  port: "5432"
  name: ""
  sslMode: "require"
  credentialsSecretName: ""

# Aus, wie in charts/notification-worker: kube-prometheus-stack ist entfernt, die PodMonitor-CRD
# existiert nicht mehr. KEDA liest den Lag direkt aus Kafka, nicht aus Prometheus.
podMonitor:
  enabled: false
  interval: 30s
  labels:
    release: kube-prometheus-stack

# maxUnavailable: 1 statt minAvailable - bei schwankender Replica-Zahl (KEDA, 2..10) bleibt
# das Budget damit immer "hoechstens ein Pod gleichzeitig weg", ohne dass ein fester
# minAvailable-Wert bei 2 Pods jeden Drain blockiert oder bei 10 zu viel zulaesst. Unkritisch
# (P5): Anfragen warten im Kafka-Topic, der Offset wird erst nach dem DB-Commit bestaetigt, ein
# Ersatz-Pod arbeitet den Rueckstand ab, ohne dass eine Reservierung verloren geht.
podDisruptionBudget:
  enabled: true
  maxUnavailable: 1

# Harte Verteilung ueber die drei simulierten Regionen (P4) - gleiches Muster wie
# charts/ticketflow-app catalogApi.topologySpreadConstraint. Die zwei Mindest-Pods liegen damit
# immer in zwei Regionen; skaliert KEDA hoch, verteilt maxSkew 1 auch die weiteren Pods
# gleichmaessig (bei 10 Pods 4/3/3) statt sie auf einem Node zu haeufen.
topologySpreadConstraint:
  enabled: true
  maxSkew: 1
