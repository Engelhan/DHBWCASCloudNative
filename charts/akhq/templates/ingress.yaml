# Own Ingress (the upstream one can't use the central dnsZone). Plain HTTP, Traefik terminates TLS;
# external-dns picks it up without a target annotation.
{{- $host := printf "akhq.%s" (required "ticketflow.dnsZone is missing - pass gitops/env/cluster.yaml (-f gitops/env/cluster.yaml)" .Values.ticketflow.dnsZone) }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: akhq
  labels:
    app.kubernetes.io/name: akhq
    app.kubernetes.io/managed-by: {{ .Release.Service }}
  annotations:
    cert-manager.io/cluster-issuer: {{ .Values.ingress.clusterIssuerName | quote }}
spec:
  ingressClassName: {{ .Values.ingress.className | quote }}
  tls:
    - hosts:
        - {{ $host | quote }}
      secretName: {{ .Values.ingress.tlsSecretName | quote }}
  rules:
    - host: {{ $host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: akhq
                port:
                  name: http
