# AKHQs Basic-Auth-Login-Passwort (Root-README ## Bonus B1). Vorher ein SHA-256-Hash-Literal
# direkt in values.yaml (secrets.akhq.security.basic-auth) - jetzt per ExternalSecret aus OpenBao
# synct, Hash wird von External Secrets selbst per Sprig-Funktion "sha256sum" aus dem
# Klartext-Passwort in der Vault berechnet (nie als Klartext in diesem Repo). Name
# "akhq-basic-auth" muss zum secretKeyRef in .Values.extraEnv (values.yaml) passen.
#
# Vorsicht: ".password" unten ist ESOs eigene Go-Template-Syntax, geschuetzt vor Helms Templating
# wie in kafka-sasl-secret.yaml (siehe dessen Kommentar).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: akhq-basic-auth
  labels:
    app.kubernetes.io/name: akhq
spec:
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  refreshInterval: 1h
  target:
    name: akhq-basic-auth
    template:
      data:
        password-hash: '{{ "{{" }} .password | sha256sum {{ "}}" }}'
  data:
    - secretKey: password
      remoteRef:
        key: akhq/basic-auth
        property: password
