# Basic-auth hash and shared JWT key, both from OpenBao. The escaped braces keep ESO's own
# template syntax away from Helm.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: akhq-basic-auth
  labels:
    app.kubernetes.io/name: akhq
spec:
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  refreshInterval: 1h
  target:
    name: akhq-basic-auth
    template:
      data:
        password-hash: '{{ "{{" }} .password | sha256sum {{ "}}" }}'
        jwt-secret: '{{ "{{" }} .jwt {{ "}}" }}'
  data:
    - secretKey: password
      remoteRef:
        key: akhq/basic-auth
        property: password
    - secretKey: jwt
      remoteRef:
        key: akhq/jwt
        property: secret
