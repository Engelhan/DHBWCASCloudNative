# SCRAM-Credentials fuer die "akhq"-KafkaUser (charts/kafka-cluster values.yaml kafka.users).
# Seit 2026-09-23 keine eigene JAAS-Konstruktion mehr: der Strimzi User Operator generiert das
# Passwort UND einen fertigen "sasl.jaas.config"-String selbst (wie bei catalog-api/
# reservation-worker/notification-worker), charts/kafka-cluster/templates/messaging/
# kafka-user-pushsecrets.yaml spiegelt genau dieses Secret nach OpenBao (KV-Pfad "kafka/akhq") -
# dieses ExternalSecret holt den fertigen JAAS-String von dort einfach 1:1 zurueck, statt ihn aus
# Username+Passwort selbst zusammenzubauen. Kein Helm/ESO-Template-Escaping mehr noetig (vorher:
# "{{ "{{" }}"/"{{ "}}" }}"-Schutz fuer ESOs eigene Go-Template-Syntax in target.template) - reine
# 1:1-Key-Kopie. Name "akhq-kafka-sasl" muss zum secretKeyRef in .Values.extraEnv (values.yaml,
# oberhalb des "akhq:"-Blocks) passen.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: akhq-kafka-sasl
  labels:
    app.kubernetes.io/name: akhq
spec:
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  refreshInterval: 1h
  target:
    name: akhq-kafka-sasl
  data:
    - secretKey: sasl.jaas.config
      remoteRef:
        key: kafka/akhq
        property: sasl.jaas.config
