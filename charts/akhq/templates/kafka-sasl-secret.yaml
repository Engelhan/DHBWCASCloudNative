# Strimzi-generated JAAS config for the akhq KafkaUser, pulled back from OpenBao (its secret lives
# in another namespace).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: akhq-kafka-sasl
  labels:
    app.kubernetes.io/name: akhq
spec:
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  refreshInterval: 1h
  target:
    name: akhq-kafka-sasl
  data:
    - secretKey: sasl.jaas.config
      remoteRef:
        key: kafka/akhq
        property: sasl.jaas.config
