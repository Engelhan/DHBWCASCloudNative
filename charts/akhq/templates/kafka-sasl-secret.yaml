# SCRAM-Credentials fuer die "akhq"-KafkaUser (charts/kafka-cluster values.yaml kafka.users) als
# fertiger JAAS-Config-String - siehe Kommentar bei .Values.kafkaSasl. Name "akhq-kafka-sasl" muss
# zum secretKeyRef in .Values.extraEnv (values.yaml, oberhalb des "akhq:"-Blocks) passen.
apiVersion: v1
kind: Secret
metadata:
  name: akhq-kafka-sasl
  labels:
    app.kubernetes.io/name: akhq
type: Opaque
stringData:
  sasl.jaas.config: >-
    org.apache.kafka.common.security.scram.ScramLoginModule required
    username="{{ .Values.kafkaSasl.username }}" password="{{ .Values.kafkaSasl.password }}";
