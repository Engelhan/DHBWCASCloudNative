# Set via gitops/env/cluster.yaml; empty default only for a readable error.
ticketflow: {}

# Kafka UI. Our own templates (secrets, ingress) live outside the upstream "akhq:" block.

# Upstream chart values (dependency alias).
akhq:
  image:
    tag: "0.28.0"

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

  # P4: two replicas in two regions. The upstream chart has no spread field, hence a required
  # anti-affinity with the rendered pod labels.
  replicaCount: 2
  affinity:
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - topologyKey: topology.ticketflow/region
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: akhq
              app.kubernetes.io/instance: akhq

  # readOnlyRootFilesystem left off: unknown whether AKHQ writes at runtime.
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    seccompProfile:
      type: RuntimeDefault
  containerSecurityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop: ["ALL"]

  # Kafka login (B2); Micronaut resolves ${VAR} at runtime, no password in the repo.
  extraEnv:
    - name: KAFKA_SASL_JAAS_CONFIG
      valueFrom:
        secretKeyRef:
          name: akhq-kafka-sasl
          key: sasl.jaas.config
    # Basic-auth hash from OpenBao (B1).
    - name: AKHQ_BASIC_AUTH_PASSWORD_HASH
      valueFrom:
        secretKeyRef:
          name: akhq-basic-auth
          key: password-hash
    # Shared JWT signing key for all replicas.
    - name: AKHQ_JWT_SECRET
      valueFrom:
        secretKeyRef:
          name: akhq-basic-auth
          key: jwt-secret

  # NetworkPolicies come from charts/network-policies.
  networkPolicy:
    enabled: false

  # Read-only roles only (B2); anonymous visitors get none.
  configuration:
    micronaut:
      security:
        enabled: true
        # Both replicas must sign sessions with the same key.
        token:
          jwt:
            signatures:
              secret:
                generator:
                  secret: "${AKHQ_JWT_SECRET}"
    akhq:
      security:
        default-group: no-roles
        roles:
          node-read:
            - resources: ["NODE"]
              actions: ["READ", "READ_CONFIG"]
          topic-read:
            - resources: ["TOPIC", "TOPIC_DATA"]
              actions: ["READ"]
            - resources: ["TOPIC"]
              actions: ["READ_CONFIG"]
          registry-read:
            - resources: ["SCHEMA"]
              actions: ["READ"]
          group-read:
            - resources: ["CONSUMER_GROUP"]
              actions: ["READ"]
        groups:
          no-roles: []
          reader:
            - role: node-read
            - role: topic-read
            - role: registry-read
            - role: group-read

  # Secret config. "admin" is just a name; group "reader" grants read-only access.
  secrets:
    akhq:
      connections:
        ticketflow-kafka:
          properties:
            # Short name: values files aren't templated, AKHQ shares Kafka's namespace.
            bootstrap.servers: "ticketflow-kafka-kafka-bootstrap:9092"
            # SASL_PLAINTEXT (B2); JAAS config from the KAFKA_SASL_JAAS_CONFIG env var.
            security.protocol: SASL_PLAINTEXT
            sasl.mechanism: SCRAM-SHA-512
            sasl.jaas.config: "${KAFKA_SASL_JAAS_CONFIG}"
      security:
        basic-auth:
          - username: admin
            password: "${AKHQ_BASIC_AUTH_PASSWORD_HASH}"
            groups:
              - reader

  # Rendered by templates/ingress.yaml instead.
  ingress:
    enabled: false

# Own Ingress; host is always akhq.<dnsZone>.
ingress:
  className: traefik
  clusterIssuerName: certificate-cluster-issuer
  tlsSecretName: akhq-tls
