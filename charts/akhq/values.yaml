# Zentrale, deployment-weite Werte - werden NICHT hier gepflegt, sondern in
# gitops/env/cluster.yaml (ArgoCD reicht die Datei jedem Chart per Multi-Source "$values"
# durch, siehe gitops/applicationset.yaml). Der leere Default steht hier nur, damit ein
# Rendern ohne diese Datei eine verstaendliche Fehlermeldung statt eines Nil-Pointers liefert.
# Lokal deshalb immer:
#   helm template <name> charts/<name> -f charts/<name>/values.yaml -f gitops/env/cluster.yaml
ticketflow: {}

# AKHQ (https://akhq.io) - Web-UI fuer den Strimzi-Kafka-Cluster (Topics/Consumer-Groups/
# Messages/Schema-Registry). Carlos' Scope (Kafka Cluster/Schema Registry/AKHQ/
# reservation-worker), siehe CLAUDE.md ## Team. Wrapper um den Upstream-Chart, gleiches Muster
# wie die anderen Addon-Charts, siehe charts/README.md ## Addon-Charts.
#
# B2 (Root-README ## Bonus): eigenes Secret (templates/kafka-sasl-secret.yaml) fuer die
# SCRAM-Credentials der "akhq"-KafkaUser (charts/kafka-cluster values.yaml kafka.users) - bewusst
# AUSSERHALB des "akhq:"-Dependency-Blocks unten (das waere an den Upstream-Chart durchgereicht,
# dieses Secret ist aber unser eigenes, zusaetzliches Template). MUSS mit charts/kafka-cluster
# values.yaml kafka.akhqUser.password uebereinstimmen (siehe dessen Kommentar fuer den
# Cross-Namespace-Grund, wieso dieses Chart das Passwort nicht einfach per secretKeyRef vom
# Strimzi User Operator lesen kann). Lab-Zugangsdaten (2026-09-16, auf expliziten Wunsch direkt
# hier hinterlegt statt CHANGE_ME/--set, da fuer diesen Kurs kein produktionsartiges Geheimnis) -
# dasselbe Passwort wie secrets.akhq.security.basic-auth unten (dort schon so gehandhabt).
kafkaSasl:
  username: akhq
  password: "ticketflow"

# Muss unter dem Dependency-Alias "akhq" verschachtelt sein (siehe Chart.yaml), damit Helm die
# Werte an den gewrappten Upstream-Chart durchreicht.
akhq:
  image:
    tag: "0.28.0" # = Chart.AppVersion, explizit statt implizitem Default (kein :latest, siehe P3)

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

  # Weiche Verteilung ueber die drei simulierten Regionen (P4). AKHQs Upstream-Chart hat
  # (anders als charts/ticketflow-app/charts/reservation-worker/charts/apicurio) KEIN natives
  # topologySpreadConstraints-Feld - gegen templates/deployment.yaml im Upstream-Chart-Tarball
  # geprueft (nur affinity/nodeSelector/tolerations werden dort templated, reiner
  # toYaml-Passthrough). Deshalb aequivalent ueber eine weiche podAntiAffinity ausgedrueckt.
  # labelSelector ist hier (anders als bei den volleigenen Charts) auf die tatsaechlich vom
  # Upstream-Chart gerenderten Pod-Labels haendisch hartkodiert (app.kubernetes.io/name=akhq,
  # app.kubernetes.io/instance=akhq - Release-Name = ArgoCD-Application-Name "akhq"), da
  # values.yaml selbst nicht templated wird und daher keine Helm-Helper wie "akhq.selectorLabels"
  # referenzieren kann. Bei replicaCount: 1 (Chart-Default) wirkungslos, aber korrekt vorbereitet,
  # falls replicaCount je erhoeht wird. Gegen `helm template` verifiziert.
  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            topologyKey: topology.ticketflow/region
            labelSelector:
              matchLabels:
                app.kubernetes.io/name: akhq
                app.kubernetes.io/instance: akhq

  # Chart-Default fuer beide ist {} (ungehaertet) - wie bei charts/strimzi-operator (siehe
  # dessen values.yaml) explizit gesetzt statt uebernommen. readOnlyRootFilesystem bewusst NICHT
  # gesetzt: unklar, ob/wohin AKHQ zur Laufzeit schreibt (kein Hinweis im Upstream-Chart/-Doku
  # gefunden) - vor einem echten Deploy per `helm template` + laufendem Pod verifizieren, dann
  # erst aktivieren (siehe charts/README.md ## Resource-Limits... zum selben Vorgehen bei Tempo).
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    seccompProfile:
      type: RuntimeDefault
  containerSecurityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop: ["ALL"]

  # B2 (Root-README ## Entscheidungen): AKHQ authentifiziert sich seit
  # charts/kafka-cluster/templates/messaging/kafka-users.yaml (authorization: type: simple ist
  # jetzt Default-Deny fuer jeden unauthentifizierten Client) als eigene KafkaUser-Identitaet
  # "akhq" statt anonym zu verbinden. Das JAAS-Config-Secret wird NICHT hier eingetragen (waere
  # ein Klartext-Passwort im Repo), sondern per Env-Var aus einem selbst angelegten Secret
  # (secretKeyRef unten) injiziert - AKHQ/Micronaut loest "${VAR}"-Platzhalter in jedem
  # Config-Wert zur Laufzeit auf.
  extraEnv:
    - name: KAFKA_SASL_JAAS_CONFIG
      valueFrom:
        secretKeyRef:
          name: akhq-kafka-sasl
          key: sasl.jaas.config

  # Chart-Default ist bereits enabled: true, und templates/networkpolicy.yaml wurde gegengeprueft
  # (podSelector korrekt auf die eigenen Pods verengt, kein "Loki-Bug" mit leerem Selector - siehe
  # charts/README.md ## Resource-Limits...) - keine Aenderung noetig, nur zur Doku hier vermerkt.
  networkPolicy:
    enabled: true

  # Nicht-sensible Konfiguration (landet in einem ConfigMap). RBAC-Rollen/-Gruppen an AKHQs
  # eigenem application.example.yml angelehnt (https://github.com/tchiotludo/akhq/blob/dev/
  # application.example.yml), aber bewusst NUR die *-read-Rollen uebernommen (keine
  # */-admin-Rollen mit CREATE/UPDATE/DELETE) - root README.md ## Entscheidungen (B2) legt AKHQ
  # explizit als "schreibgeschuetzt konfiguriert" fest (Topics/ACLs werden deklarativ ueber
  # charts/kafka-cluster bzw. kuenftige KafkaUser-CRs verwaltet, nicht ad-hoc per UI). Kafka-Connect-
  # Rollen (connect-admin/connect-cluster-read) komplett weggelassen - es existiert kein Kafka-
  # Connect-Cluster in diesem Projekt. default-group auf eine leere Gruppe ("no-roles") statt
  # "reader" wie fuer eingeloggte Nutzer, damit nicht eingeloggte Besucher:innen ueber die
  # oeffentliche Ingress unten trotzdem NICHTS sehen.
  #
  # UNVERIFIZIERT (kein laufender Cluster zum Gegenpruefen verfuegbar) - vor dem ersten echten
  # Sync in der ArgoCD-UI kontrollieren, ob Login + Rollenzuweisung tatsaechlich wie erwartet
  # greifen.
  configuration:
    micronaut:
      security:
        enabled: true
    akhq:
      security:
        default-group: no-roles
        roles:
          node-read:
            - resources: ["NODE"]
              actions: ["READ", "READ_CONFIG"]
          topic-read:
            - resources: ["TOPIC", "TOPIC_DATA"]
              actions: ["READ"]
            - resources: ["TOPIC"]
              actions: ["READ_CONFIG"]
          registry-read:
            - resources: ["SCHEMA"]
              actions: ["READ"]
          group-read:
            - resources: ["CONSUMER_GROUP"]
              actions: ["READ"]
        groups:
          no-roles: []
          reader:
            - role: node-read
            - role: topic-read
            - role: registry-read
            - role: group-read

  # Sensible Werte (Kafka-Verbindung, Basic-Auth-Passwort-Hash) - landen in einem Secret statt im
  # ConfigMap (siehe Upstream-values.yaml-Kommentar zu "secrets"). Format: SHA-256-Hex von
  # `echo -n "<echtes-passwort>" | sha256sum` (kein passwordHash-Feld gesetzt -> SHA256 ist AKHQs
  # Default, siehe akhq.io Basic-Auth-Doku).
  #
  # Lab-Zugangsdaten (2026-09-15, auf expliziten Wunsch direkt hier hinterlegt statt per --set,
  # da fuer diesen Kurs kein produktionsartiges Geheimnis): Passwort "ticketflow" - schwach und
  # als solches im SHA-256-Hash unten fuer jeden mit Repo-Zugriff leicht rueckrechenbar (kein
  # Salt, sehr kurzes Woerterbuch-Wort), aber fuer ein privates Uebungsrepo akzeptiert. Username
  # "admin" ist nur ein Label - die Gruppe "reader" bestimmt die tatsaechlichen (schreibgeschuetzten)
  # Rechte, siehe root README.md ## Entscheidungen (B2) "AKHQ schreibgeschuetzt konfiguriert".
  secrets:
    akhq:
      connections:
        ticketflow-kafka:
          properties:
            # Kurzer In-Namespace-Name: AKHQ laeuft im selben Namespace wie der Kafka-Cluster
            # (ticketflow.namespaces.kafka), der Eintrag bleibt damit auch bei einer
            # Umbenennung dieses Namespace korrekt. Ein abgeleiteter Wert ist hier nicht
            # moeglich - der Block gehoert zu den Values des gewrappten Upstream-Charts,
            # und Helm templatet Values-Dateien nicht (siehe charts/README.md).
            bootstrap.servers: "ticketflow-kafka-kafka-bootstrap:9092"
            # SASL_PLAINTEXT statt PLAINTEXT (B2) - "${KAFKA_SASL_JAAS_CONFIG}" wird von
            # Micronaut/AKHQ zur Laufzeit aus der env-Var aufgeloest, die extraEnv oben per
            # secretKeyRef aus templates/kafka-sasl-secret.yaml injiziert (kein Klartext-Passwort
            # in dieser Datei).
            security.protocol: SASL_PLAINTEXT
            sasl.mechanism: SCRAM-SHA-512
            sasl.jaas.config: "${KAFKA_SASL_JAAS_CONFIG}"
      security:
        basic-auth:
          - username: admin
            password: b3c20af422987f4f012e71955f29ccbd5335b08c05df52c5740207b63a161180
            groups:
              - reader

  # Bewusst aus: der Ingress wird von diesem Chart selbst gerendert
  # (templates/ingress.yaml), weil sein Hostname aus der zentralen DNS-Zone abgeleitet wird -
  # siehe den ingress-Block ausserhalb dieses "akhq:"-Blocks weiter unten.
  ingress:
    enabled: false

# Einstellungen fuer den chart-eigenen Ingress (templates/ingress.yaml). Der Hostname selbst steht
# hier NICHT - er ist immer "akhq.<ticketflow.dnsZone>" aus gitops/env/cluster.yaml.
ingress:
  className: traefik
  clusterIssuerName: certificate-cluster-issuer
  tlsSecretName: akhq-tls
