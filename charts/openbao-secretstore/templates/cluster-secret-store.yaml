# "openbao-active" ist der vom Upstream-Chart automatisch gepflegte Service, der immer auf die
# aktuell aktive OpenBao-Instanz zeigt (service_registration "kubernetes" in charts/openbao/
# values.yaml labelt sie automatisch) - macht Failover zwischen bereits entsiegelten Standbys fuer
# External Secrets transparent, ohne eigene Retry-Logik hier. Service-Name folgt der ueblichen
# Vault/OpenBao-Helm-Konvention "<fullname>-active" mit Release-Name "openbao" - gegen den real
# gerenderten Manifest-Output verifizieren, bevor der erste echte Sync erwartet wird.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: openbao
spec:
  provider:
    vault:
      server: "http://openbao-active.{{ required "ticketflow.namespaces.openbao fehlt - gitops/env/cluster.yaml mitgeben (-f gitops/env/cluster.yaml)" .Values.ticketflow.namespaces.openbao }}.svc:8200"
      path: "secret"
      version: "v2"
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "external-secrets"
          serviceAccountRef:
            name: "external-secrets"
            namespace: {{ required "ticketflow.namespaces.externalSecrets fehlt - gitops/env/cluster.yaml mitgeben (-f gitops/env/cluster.yaml)" .Values.ticketflow.namespaces.externalSecrets | quote }}
