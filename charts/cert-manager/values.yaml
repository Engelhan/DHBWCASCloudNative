# Muss unter dem Dependency-Alias "cert-manager" verschachtelt sein (siehe Chart.yaml), damit
# Helm die Werte an das gewrappte Upstream-Chart durchreicht. securityContext/
# containerSecurityContext sind fuer alle drei Komponenten bereits Chart-Default gehaertet
# (runAsNonRoot, readOnlyRootFilesystem, capabilities drop ALL, seccompProfile RuntimeDefault) -
# kein Override noetig, nur resources (Chart-Default ueberall {}) und networkPolicy (Chart-
# Default deaktiviert) fehlen.
cert-manager:
  crds:
    enabled: true

  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi

  webhook:
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        cpu: 100m
        memory: 128Mi

  cainjector:
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        cpu: 100m
        memory: 128Mi

  startupapicheck:
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        cpu: 100m
        memory: 128Mi

  # Chart-eigene NetworkPolicy-Ressourcen mit sinnvollen Default-Regeln (siehe Upstream-
  # values.yaml: Ingress nur auf Metrics-/Healthz-Ports, Egress auf 80/443/53) - nicht weiter
  # auf konkrete Pod-/Namespace-Selektoren verengt, da charts/kafka-cluster (der eigentliche
  # Consumer von Zertifikaten) noch nicht existiert und die genauen Cross-Namespace-Flows noch
  # nicht feststehen.
  networkPolicy:
    enabled: true
