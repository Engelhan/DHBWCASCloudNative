# Muss unter dem Dependency-Alias "cert-manager" verschachtelt sein (siehe Chart.yaml), damit
# Helm die Werte an das gewrappte Upstream-Chart durchreicht. securityContext/
# containerSecurityContext sind fuer alle drei Komponenten bereits Chart-Default gehaertet
# (runAsNonRoot, readOnlyRootFilesystem, capabilities drop ALL, seccompProfile RuntimeDefault) -
# kein Override noetig, nur resources (Chart-Default ueberall {}) fehlt. NetworkPolicies: siehe
# charts/network-policies.
cert-manager:
  crds:
    enabled: true

  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi

  webhook:
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        cpu: 100m
        memory: 128Mi

  cainjector:
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        cpu: 100m
        memory: 128Mi

  startupapicheck:
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        cpu: 100m
        memory: 128Mi

  # Aus - alle NetworkPolicies kommen zentral aus charts/network-policies (B1). Die Chart-eigenen
  # deckten nur den Controller ab (Webhook/cainjector blieben ungeregelt) und erlaubten Egress auf
  # 80/443/53/6443 zu beliebigen Zielen.
  networkPolicy:
    enabled: false
