# Single source of deployment-specific values, read by ArgoCD (git generator + $values), every
# chart (.Values.ticketflow), Ansible (gitops_secrets) and Terraform (namePrefix).
# Own top-level key instead of "global", which Helm passes into upstream subcharts.
# No secrets here: they live in terraform.tfvars and infra/ansible/secrets.yml.
ticketflow:
  # --- Fork identity ---
  # ArgoCD only reads the pushed state of this revision.
  repoURL: git@github.com:Engelhan/DHBWCASCloudNative.git
  targetRevision: main

  # --- Environment ---
  # Selects values-<env>.yaml for every chart.
  environment: dev  # dev | prod

  # --- DNS / ACME ---
  # All hostnames derive from dnsZone (argocd., traefik., akhq., ticketflow., openbao.).
  dnsZone: cas438007-at-cas-dhbw-de.users.dhbw.site
  acmeEmail: cas438007@cas.dhbw.de
  # Reachable from the DHBW network only.
  acmeServer: https://certificates.dhbw.cloud
  rfc2136:
    server: "141.72.5.244"
    # Key name only; the secret value is in infra/ansible/secrets.yml.
    keyName: user-key-f28a14246f3de83a8ef98b0e727abd6b96a1f124

  # --- Namespaces ---
  # Bootstrap DNS, registry URL etc. are derived from these.
  namespaces:
    # App and its database (secretKeyRef can't cross namespaces).
    app: ticketflow
    kafka: kafka
    # OpenBao and its own database.
    openbao: openbao
    externalSecrets: external-secrets

  kafka:
    # Strimzi names the bootstrap service <clusterName>-kafka-bootstrap.
    clusterName: ticketflow-kafka

  postgres:
    # Derives <db>-postgres-cluster, its -rw service and CNPG's <db>-postgres-cluster-app secret.
    databaseName: postgres

  openbao:
    # OpenBao's storage DB; CNPG generates its credential (it can't come from the vault).
    databaseName: openbao-vault

  # --- Network (charts/network-policies) ---
  # Targets without pods behind them: API server and kubelets.
  network:
    # DHBWV6 subnets: API server (node IP:6443) and kubelets.
    nodeCIDRs:
      - "2001:7c0:1b20:c913::/64"
      - "10.200.0.0/19"
    # Source address of the control-plane host towards pods on other nodes (flannel tunnel = first
    # address of k3s_cluster_cidr/_v4 in group_vars/all.yml; keep in sync).
    controlPlaneTunnelIPs:
      - "fd00:42::/128"
      - "10.42.0.0/32"

  # --- Images ---
  # ghcr.io requires lowercase.
  imageRegistry: ghcr.io/engelhan
  # Written by the bump job in .github/workflows/build-images.yml. Never "latest" (P3).
  imageTag: "26fced0f"

  # --- Infrastructure ---
  # Prefix of all OpenStack resource names.
  namePrefix: niklas-ticketflow
