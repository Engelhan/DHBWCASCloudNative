# Zentrale Konfiguration dieses Deployments - die EINZIGE Datei, die fuer einen eigenen Fork
# angepasst werden muss (plus die eine repoURL-Zeile im git-files-Generator in
# ../applicationset.yaml, siehe dort). Gelesen von:
#
#   - ArgoCD   : ../applicationset.yaml zieht sie per git-files-Generator (steuert Repo, Revision,
#                Environment) UND reicht sie jedem Chart per Multi-Source "$values" als
#                zusaetzliche Values-Datei durch.
#   - Helm     : alle Charts lesen ihre uebergreifenden Werte aus .Values.ticketflow.* - lokal
#                deshalb immer mit "-f gitops/env/cluster.yaml" rendern (siehe charts/README.md).
#   - Ansible  : infra/ansible/roles/gitops_secrets liest repoURL fuer die ArgoCD-Repo-Credential.
#   - Terraform: infra/terraform/main.tf liest namePrefix per yamldecode().
#
# Bewusst EIN Top-Level-Key "ticketflow" und nicht "global": Helm reicht "global" automatisch an
# alle Sub-Charts durch, und die Upstream-Charts hier (Longhorn, Loki, Grafana, ...) belegen dort
# eigene Bedeutungen (global.imageRegistry, global.storageClass, global.clusterDomain). Ein
# eigener Key kann mit keinem davon kollidieren.
#
# NICHT hier hinein gehoeren Geheimnisse - die bleiben in den gitignorierten Dateien
# infra/terraform/terraform.tfvars (OpenStack-Credentials) und infra/ansible/secrets.yml
# (RFC2136-TSIG-Wert). Diese Datei ist git-getrackt, weil ArgoCD sie aus dem Repo liest.
ticketflow:
  # --- Fork-Identitaet -------------------------------------------------------------------
  # Muss auf das eigene (private) Repo zeigen. ArgoCD liest ausschliesslich den Remote-Stand
  # dieser Revision - lokale, ungepushte Aenderungen sieht es nicht.
  repoURL: git@github.com:Engelhan/DHBWCASCloudNative.git
  targetRevision: main

  # --- Umgebung --------------------------------------------------------------------------
  # Waehlt fuer jeden Chart mit values-dev.yaml/values-prod.yaml die passende Datei aus
  # (siehe ../applicationset.yaml). Ein Umschalten hier zieht den kompletten Stack um.
  environment: dev # dev | prod

  # --- DNS / ACME ------------------------------------------------------------------------
  # Eigene DHBW-Zone aus self-service.dhbw.cloud inkl. RFC2136-Freigabe. Alle Hostnamen leiten
  # sich daraus ab: argocd.<dnsZone>, traefik.<dnsZone>, akhq.<dnsZone>, ticketflow.<dnsZone>.
  dnsZone: cas438007-at-cas-dhbw-de.users.dhbw.site
  acmeEmail: cas438007@cas.dhbw.de
  # DHBW-internes ACME-Verzeichnis - nur aus dem DHBW-Netz/VPN erreichbar.
  acmeServer: https://certificates.dhbw.cloud
  rfc2136:
    # DHBW-Dynamic-DNS-Server (self-service.dhbw.cloud) - kein Geheimnis, nur die Adresse.
    server: "141.72.5.244"
    # Nur der Key-NAME/Bezeichner. Der geheime Wert steht in infra/ansible/secrets.yml und wird
    # von dort als Kubernetes-Secret angelegt, nie im Repo.
    keyName: user-key-f28a14246f3de83a8ef98b0e727abd6b96a1f124

  # --- Namespace-Aufteilung --------------------------------------------------------------
  # Die Kafka-Plattform (Cluster, Nodepools, Topics, Operator, AKHQ, Apicurio) laeuft bewusst in
  # einem eigenen Namespace, getrennt von der Anwendung (catalog-api/frontend, reservation-worker,
  # notification-worker). Alles, was daraus folgt - Bootstrap-DNS, Schema-Registry-URL, der
  # Namespace der KafkaUser-CRs - wird aus diesen beiden Werten abgeleitet, statt als
  # ausgeschriebener DNS-Name in fuenf values.yaml zu stehen.
  namespaces:
    # Anwendung UND Datenbank. Der CNPG-Cluster liegt bewusst hier und nicht in einem eigenen
    # Namespace: catalog-api und reservation-worker koennen sein Credentials-Secret dadurch direkt
    # per secretKeyRef lesen (Kubernetes erlaubt das nicht ueber Namespace-Grenzen), statt die
    # Zugangsdaten in jedem Chart ein zweites Mal zu hinterlegen.
    app: ticketflow
    kafka: kafka

  kafka:
    # Name der Strimzi-Kafka-CR. Der Bootstrap-Service heisst daraus abgeleitet
    # "<clusterName>-kafka-bootstrap" - Strimzis eigene Namenskonvention, nicht frei waehlbar.
    clusterName: ticketflow-kafka

  postgres:
    # Logischer Datenbankname. charts/postgres-cluster leitet daraus die CNPG-Cluster-CR
    # ("<databaseName>-postgres-cluster"), deren rw-Service und das Credentials-Secret
    # ("<databaseName>-postgres-user", Keys username/password) ab; catalog-api und
    # reservation-worker greifen genau darauf zu.
    databaseName: postgres

  # --- Container-Images ------------------------------------------------------------------
  # ghcr.io verlangt kleingeschriebene Namen - der GitHub-Owner ist hier bewusst lowercase,
  # anders als in repoURL oben (.github/workflows/build-images.yml macht dasselbe per ${VAR,,}).
  imageRegistry: ghcr.io/engelhan
  # Git-Short-SHA des zuletzt gebauten Images, gilt fuer alle vier Services. Wird vom
  # bump-Job in .github/workflows/build-images.yml automatisch fortgeschrieben - hier normalerweise
  # nicht von Hand editieren. Nie "latest" (P3).
  imageTag: "4579b884"

  # --- Infrastruktur ---------------------------------------------------------------------
  # Praefix aller OpenStack-Ressourcennamen (infra/terraform/main.tf liest das per yamldecode).
  namePrefix: niklas-ticketflow
