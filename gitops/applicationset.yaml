---
# Two ApplicationSets, applied in order by infra/ansible/roles/gitops_rollout:
#   1. ticketflow-platform: addons, operators, OpenBao
#   2. ticketflow-apps: data, Kafka, services, NetworkPolicies
# Stage 2 is applied only once every stage-1 Application is Synced and Healthy. Sync waves don't
# work on ApplicationSet-generated apps; RollingSync would disable selfHeal.
# Changes to this file need a re-run of playbooks/bootstrap-gitops.yml.
# Fork: change the two git-generator repoURLs below (everything else comes from env/cluster.yaml).
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: ticketflow-platform
  namespace: argocd
  labels:
    # Selected by kubectl apply -l.
    ticketflow.io/stage: platform
spec:
  goTemplate: true
  generators:
    # git generator: one parameter set (env/cluster.yaml); list: one per Application.
    - matrix:
        generators:
          - git:
              # Literal repo URL (chicken-and-egg).
              repoURL: git@github.com:Engelhan/DHBWCASCloudNative.git
              revision: main
              files:
                - path: gitops/env/cluster.yaml
          - list:
              # chartPath, not path: the git generator already sets .path.
              # serverSideApply: for CRDs above the 262144-byte annotation limit.
              # ignoreReplicas: KEDA owns spec.replicas.
              elements:
                # --- Addons / storage ---
                - name: longhorn
                  chartPath: charts/longhorn
                  namespace: longhorn-system
                - name: cert-manager
                  chartPath: charts/cert-manager
                  namespace: cert-manager
                # Needs cert-manager's CRDs; retry covers the race.
                - name: cert-manager-issuer
                  chartPath: charts/cert-manager-config
                  namespace: cert-manager
                - name: external-dns
                  chartPath: charts/external-dns
                  namespace: external-dns
                - name: traefik-config
                  chartPath: charts/traefik-config
                  namespace: kube-system
                # Needs the ClusterIssuer.
                - name: argocd-ingress
                  chartPath: charts/argocd-ingress
                  namespace: argocd
                # --- Operators ---
                - name: cnpg-operator
                  chartPath: charts/cnpg-operator
                  namespace: cnpg-system
                  serverSideApply: true
                - name: strimzi-operator
                  chartPath: charts/strimzi-operator
                  namespace: kafka
                  serverSideApply: true
                - name: keda
                  chartPath: charts/keda
                  namespace: keda
                  serverSideApply: true
                # --- Secret vault (B1) ---
                - name: external-secrets-operator
                  chartPath: charts/external-secrets-operator
                  namespace: external-secrets
                  # CRDs are ~252KB, too close to the annotation limit for client-side apply.
                  serverSideApply: true
                # Needs the CNPG CRDs.
                - name: openbao-postgres
                  chartPath: charts/openbao-postgres
                  namespace: openbao
                # Healthy only after the bootstrap hook (init/unseal/seed) ran.
                - name: openbao
                  chartPath: charts/openbao
                  namespace: openbao
                # Healthy only once the store reaches an unsealed OpenBao.
                - name: openbao-secretstore
                  chartPath: charts/openbao-secretstore
                  namespace: external-secrets
  # spec.template is a typed object: Go expressions only inside strings; conditionals go to
  # templatePatch.
  template:
    metadata:
      name: '{{ .name }}'
      labels:
        # Used by gitops_rollout to find this stage's Applications.
        ticketflow.io/stage: platform
    spec:
      project: default
      # Second source exposes env/cluster.yaml as $values to every chart.
      sources:
        - repoURL: '{{ .ticketflow.repoURL }}'
          targetRevision: '{{ .ticketflow.targetRevision }}'
          path: '{{ .chartPath }}'
          helm:
            # values-<env>.yaml is optional per chart; a missing cluster.yaml fails the render.
            ignoreMissingValueFiles: true
            valueFiles:
              - values.yaml
              - 'values-{{ .ticketflow.environment }}.yaml'
              - $values/gitops/env/cluster.yaml
        - repoURL: '{{ .ticketflow.repoURL }}'
          targetRevision: '{{ .ticketflow.targetRevision }}'
          ref: values
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{ .namespace }}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        # ArgoCD never retries a failed auto-sync for the same commit; intra-stage dependencies need
        # it.
        retry:
          limit: -1
          backoff:
            duration: 30s
            factor: 2
            maxDuration: 5m
  # Merge patch: maps merge, lists are replaced.
  templatePatch: |
    spec:
      syncPolicy:
        syncOptions:
          - CreateNamespace=true
          {{- if .serverSideApply }}
          - ServerSideApply=true
          {{- end }}
      {{- if .ignoreReplicas }}
      ignoreDifferences:
        - group: apps
          kind: Deployment
          name: {{ .name }}
          jsonPointers:
            - /spec/replicas
      {{- end }}
---
# Stage 2 - applied once ticketflow-platform is green.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: ticketflow-apps
  namespace: argocd
  labels:
    # Selected by kubectl apply -l.
    ticketflow.io/stage: apps
spec:
  goTemplate: true
  generators:
    # git generator: one parameter set (env/cluster.yaml); list: one per Application.
    - matrix:
        generators:
          - git:
              # Literal repo URL (chicken-and-egg).
              repoURL: git@github.com:Engelhan/DHBWCASCloudNative.git
              revision: main
              files:
                - path: gitops/env/cluster.yaml
          - list:
              # See the field notes in ticketflow-platform above.
              elements:
                # --- Network isolation (B1) ---
                # Writes into namespaces other apps create; retry covers the race. Each object sets
                # its own
                # namespace.
                - name: network-policies
                  chartPath: charts/network-policies
                  namespace: kube-system
                # --- Data / messaging ---
                # Same namespace as the app so it can read the CNPG secret.
                - name: postgres-cluster
                  chartPath: charts/postgres-cluster
                  namespace: ticketflow
                # Must share a stage with apicurio: the schema hook waits for Apicurio, which needs
                # Kafka.
                - name: kafka-cluster
                  chartPath: charts/kafka-cluster
                  namespace: kafka
                - name: apicurio
                  chartPath: charts/apicurio
                  namespace: kafka
                - name: akhq
                  chartPath: charts/akhq
                  namespace: kafka
                # --- TicketFlow application ---
                - name: ticketflow-app
                  chartPath: charts/ticketflow-app
                  namespace: ticketflow
                - name: reservation-worker
                  chartPath: charts/reservation-worker
                  namespace: ticketflow
                  ignoreReplicas: true
                - name: notification-worker
                  chartPath: charts/notification-worker
                  namespace: ticketflow
  # Typed object: see ticketflow-platform.
  template:
    metadata:
      name: '{{ .name }}'
      labels:
        ticketflow.io/stage: apps
    spec:
      project: default
      sources:
        - repoURL: '{{ .ticketflow.repoURL }}'
          targetRevision: '{{ .ticketflow.targetRevision }}'
          path: '{{ .chartPath }}'
          helm:
            ignoreMissingValueFiles: true
            valueFiles:
              - values.yaml
              - 'values-{{ .ticketflow.environment }}.yaml'
              - $values/gitops/env/cluster.yaml
        - repoURL: '{{ .ticketflow.repoURL }}'
          targetRevision: '{{ .ticketflow.targetRevision }}'
          ref: values
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{ .namespace }}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        retry:
          limit: -1
          backoff:
            duration: 30s
            factor: 2
            maxDuration: 5m
  templatePatch: |
    spec:
      syncPolicy:
        syncOptions:
          - CreateNamespace=true
          {{- if .serverSideApply }}
          - ServerSideApply=true
          {{- end }}
      {{- if .ignoreReplicas }}
      ignoreDifferences:
        - group: apps
          kind: Deployment
          name: {{ .name }}
          jsonPointers:
            - /spec/replicas
      {{- end }}
