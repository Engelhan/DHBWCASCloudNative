---
# reservation-worker: Kafka-Consumer, der die eigentliche Sitzplatzbuchung durchfuehrt (siehe
# src/reservation-worker/README.md, charts/reservation-worker/). Anders als zunaechst (inline
# helm.values hier in der Application) leben image.tag/config.kafkaBrokers/secret.databaseUrl
# jetzt als Defaults direkt in charts/reservation-worker/values.yaml, kein values-dev.yaml/
# values-prod.yaml-Split fuer diesen Chart. image.repository und config.kafkaBrokers sind dort
# echte Werte; secret.databaseUrl bleibt ein bewusst falscher Platzhalter (siehe dessen
# Kommentar in values.yaml) - charts/postgres-cluster legt das DB-Secret nur im Namespace
# "application" an, Secrets sind namespace-uebergreifend nicht referenzierbar. Mit
# automated/selfHeal bleibt diese Application deshalb absichtlich rot (DB-Connect-Fehler) in der
# ArgoCD-UI, statt unbemerkt gruen mit falschen Daten zu laufen - sichtbarer Reminder, bis der
# Wert durch einen echten ersetzt wird (z.B. per External Secret, dann in values.yaml committen).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: reservation-worker
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git@github.com:Engelhan/DHBWCASCloudNative.git
    targetRevision: main
    path: charts/reservation-worker
  destination:
    server: https://kubernetes.default.svc
    namespace: ticketflow
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
