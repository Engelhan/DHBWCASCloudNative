---
# reservation-worker: Kafka-Consumer, der die eigentliche Sitzplatzbuchung durchfuehrt (siehe
# src/reservation-worker/README.md, charts/reservation-worker/). image.tag/config.kafkaBrokers/
# databaseSecret.{username,password} leben als Defaults direkt in
# charts/reservation-worker/values.yaml (Lab-Zugangsdaten, muss mit charts/postgres-cluster
# values.yaml database.owner/.password uebereinstimmen), kein values-dev.yaml/values-prod.yaml-
# Split fuer diesen Chart, keine helm.values hier in der Application.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: reservation-worker
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git@github.com:Engelhan/DHBWCASCloudNative.git
    targetRevision: main
    path: charts/reservation-worker
  destination:
    server: https://kubernetes.default.svc
    namespace: ticketflow
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
  # P6: KEDA (gitops/apps/keda.yaml) verwaltet spec.replicas dieses Deployments ab dem ersten
  # Scale-Reconcile (charts/reservation-worker/templates/keda-scaledobject.yaml). Ohne dieses
  # ignoreDifferences wuerde selfHeal jede KEDA-Skalierung beim naechsten Sync-Tick sofort wieder
  # auf den Git-Wert (replicaCount: 1) zuruecksetzen - Standard-Pattern fuer ArgoCD + HPA/KEDA.
  ignoreDifferences:
    - group: apps
      kind: Deployment
      name: reservation-worker
      jsonPointers:
        - /spec/replicas
