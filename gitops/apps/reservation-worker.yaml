---
# reservation-worker: Kafka-Consumer, der die eigentliche Sitzplatzbuchung durchfuehrt (siehe
# src/reservation-worker/README.md, charts/reservation-worker/). config.kafkaBrokers ist ein
# echter Wert (Strimzi-Bootstrap-Service aus charts/ticketflow, gleicher Namespace "ticketflow").
# image.repository ist ebenfalls real (Default im Chart selbst, siehe values.yaml) -
# .github/workflows/build-images.yml pusht dorthin.
#
# image.tag und secret.databaseUrl sind dagegen bewusst falsche Platzhalter, kein echter Deploy-
# Wert: image.tag ist der Git-Short-SHA des zuletzt von build-images.yml gepushten Images (erst
# nach dem ersten erfolgreichen Workflow-Lauf bekannt, siehe dessen ghcr.io-Package-Seite), und
# charts/postgres-cluster legt das DB-Secret nur im Namespace "application" an - Secrets sind
# namespace-uebergreifend nicht referenzierbar, siehe dessen eigener Kommentar in
# charts/reservation-worker/values.yaml. Mit automated/selfHeal bleibt diese Application deshalb
# absichtlich rot (ImagePullBackOff / DB-Connect-Fehler) in der ArgoCD-UI, statt unbemerkt gruen
# mit falschen Daten zu laufen - sichtbarer Reminder, bis beide Werte durch echte ersetzt werden
# (z.B. per `argocd app set --helm-set ...` oder einem External Secret, dann hier committen).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: reservation-worker
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git@github.com:Engelhan/DHBWCASCloudNative.git
    targetRevision: main
    path: charts/reservation-worker
    helm:
      values: |
        image:
          tag: "REPLACE-ME-set-to-a-real-git-short-sha-after-build-images-runs"
        config:
          kafkaBrokers: "ticketflow-kafka-kafka-bootstrap.ticketflow.svc:9092"
        secret:
          databaseUrl: "REPLACE-ME-cross-namespace-secret-unresolved"
  destination:
    server: https://kubernetes.default.svc
    namespace: ticketflow
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
