---
# Log-Aggregation (Grafana Loki), SingleBinary-Modus mit eingebautem MinIO als
# S3-kompatiblem Objektspeicher, beides auf Longhorn-PVCs persistiert. Wrapper-Chart
# ../../charts/loki (Dependency auf den Upstream-Chart, Werte in dessen values.yaml) -
# einheitliches Muster fuer alle Addon-Charts, siehe charts/README.md. Als Datasource in
# kube-prometheus-stack/values.yaml (Grafana) eingebunden - derselbe Namespace wie dort.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: loki
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git@github.com:Engelhan/DHBWCASCloudNative.git
    targetRevision: main
    path: charts/loki
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
