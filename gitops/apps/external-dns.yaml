---
# external-dns. Nutzt die echte DHBW-DNS-Zone (self-service.dhbw.cloud) - siehe
# charts/external-dns/values.yaml, das denselben Zone-/TSIG-Key wie der
# cert-manager-dns01-Solver nutzt. Wrapper-Chart ../../charts/external-dns (Dependency auf den
# Upstream-Chart, Werte in dessen values.yaml) statt Application-inline-Values - einheitliches
# Muster fuer alle Addon-Charts, siehe charts/README.md.
#
# Voraussetzung (VOR dem ersten Sync manuell angelegt, nicht im Repo):
#   kubectl create namespace external-dns
#   kubectl -n external-dns create secret generic external-dns-rfc2136-tsig \
#     --from-literal=secret=<TSIG-Wert>
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-dns
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git@github.com:Engelhan/DHBWCASCloudNative.git
    targetRevision: main
    path: charts/external-dns
  destination:
    server: https://kubernetes.default.svc
    namespace: external-dns
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
