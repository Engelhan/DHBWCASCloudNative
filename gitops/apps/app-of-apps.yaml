---
# Root-Application des App-of-Apps-Patterns (W2). Zeigt per "directory"-Source auf diesen
# Ordner - jede weitere Application-Datei, die hier abgelegt wird, wird dadurch automatisch
# von ArgoCD aufgenommen. Wird von infra/ansible/roles/argocd_bootstrap einmalig angewendet
# (siehe dortige tasks/main.yml - der Schritt kopiert/appliziert GENAU diese Datei, sobald sie
# im Repo existiert).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: app-of-apps
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: git@github.com:Engelhan/DHBWCASCloudNative.git
    targetRevision: main
    path: gitops/apps
    directory:
      recurse: false
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
