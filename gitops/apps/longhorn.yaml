---
# Verteilter Block-Storage. Wrapper-Chart ../../charts/longhorn (Dependency auf den
# Upstream-Chart, Werte in dessen values.yaml) statt Application-inline-Values - einheitliches
# Muster fuer alle Addon-Charts, siehe charts/README.md.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: longhorn
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git@github.com:Engelhan/DHBWCASCloudNative.git
    targetRevision: niklas
    path: charts/longhorn
  destination:
    server: https://kubernetes.default.svc
    namespace: longhorn-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
