---
# ClusterIssuer-Konfiguration aus charts/cert-manager-config (echte Werte, siehe dortige
# values.yaml).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager-issuer
  namespace: argocd
  annotations:
    # Sync-Wave nach cert-manager.yaml (Wave 0/Default) - die cert-manager-CRDs muessen
    # existieren, bevor der ClusterIssuer angewendet wird.
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: https://github.com/Engelhan/DHBWCASCloudNative.git
    targetRevision: main
    path: charts/cert-manager-config
  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
