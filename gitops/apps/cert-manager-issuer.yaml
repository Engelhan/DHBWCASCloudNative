---
# ClusterIssuer-Konfiguration aus charts/cert-manager-config, mit Platzhaltern (siehe dortige
# values.yaml). Bewusst OHNE syncPolicy.automated: solange die Platzhalter nicht durch echte
# Werte ersetzt sind, soll ArgoCD hier NICHT automatisch synchen. Aktivierung siehe
# charts/cert-manager-config/values.yaml ## Aktivierung.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager-issuer
  namespace: argocd
  annotations:
    # Nur informativ (diese Application syncd ohnehin nicht automatisch) - dokumentiert, dass
    # die cert-manager-CRDs vor einem manuellen Sync bereits vorhanden sein muessen.
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: https://github.com/Engelhan/DHBWCASCloudNative.git
    targetRevision: main
    path: charts/cert-manager-config
  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
