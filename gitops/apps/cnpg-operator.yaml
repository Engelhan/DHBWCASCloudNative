---
# CloudNativePG-Operator. Wrapper-Chart ../../charts/cnpg-operator (Dependency auf den
# Upstream-Chart, Werte in dessen values.yaml) - einheitliches Muster fuer alle Addon-Charts,
# siehe charts/README.md. Die eigentliche Postgres-Cluster-CR kommt spaeter aus
# charts/ticketflow (noch nicht geschrieben) als eigene Application.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cnpg-operator
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git@github.com:Engelhan/DHBWCASCloudNative.git
    targetRevision: main
    path: charts/cnpg-operator
  destination:
    server: https://kubernetes.default.svc
    namespace: cnpg-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # Der Upstream-Chart buendelt mehrere sehr grosse CRDs (z.B. poolers.postgresql.cnpg.io
      # ueber 650 KB) - Client-Side-Apply wuerde die komplette Ressource zusaetzlich als
      # last-applied-configuration-Annotation speichern und damit das harte 262144-Byte-Limit
      # der Kubernetes-API sprengen ("Too long"). Server-Side Apply schreibt diese Annotation
      # gar nicht erst - exakt dasselbe Problem/derselbe Fix wie beim ArgoCD-Install selbst,
      # siehe CLAUDE.md ## Infra layering (Ansible specifics).
      - ServerSideApply=true
