---
# cert-manager-Operator selbst - immer aktiv (CRDs sind auch ohne einen scharfen ClusterIssuer
# nuetzlich). Der eigentliche ClusterIssuer liegt als eigene Application in
# cert-manager-issuer.yaml, siehe dort. Wrapper-Chart ../../charts/cert-manager (Dependency auf
# den Upstream-Chart, Werte in dessen values.yaml) statt Application-inline-Values -
# einheitliches Muster fuer alle Addon-Charts, siehe charts/README.md.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git@github.com:Engelhan/DHBWCASCloudNative.git
    targetRevision: niklas
    path: charts/cert-manager
  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
