---
# Apicurio Registry (JSON-Schema-Registry), Carlos' Scope - siehe CLAUDE.md ## Team,
# charts/apicurio/values.yaml. Liegt im Namespace "kafka" (zusammen mit Strimzi-Operator/AKHQ,
# siehe akhq.yaml/strimzi-operator.yaml) statt "ticketflow" - Registry ist Kafka-Plattform-
# Tooling, kein Teil der TicketFlow-Anwendung selbst. Kein Ingress (nur intern erreichbar, anders
# als AKHQ). Registriert werden die Schemas durch einen eigenen Job in charts/kafka-cluster (siehe
# templates/schema-registry/), nicht hier - dieser Chart deployt nur die Registry selbst.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: apicurio
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git@github.com:Engelhan/DHBWCASCloudNative.git
    targetRevision: main
    path: charts/apicurio
  destination:
    server: https://kubernetes.default.svc
    namespace: kafka
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
