---
# TicketFlow-Anwendungsebene. Eigener Chart ../../charts/ticketflow (kein Wrapper - volleigene
# Custom Resources, siehe charts/ticketflow/Chart.yaml). catalog-api/frontend
# (Deployment/Service/ConfigMap/Ingress/ServiceMonitor), siehe charts/ticketflow/templates/.
# reservation-worker folgt als eigenes Template; notification-worker/CNPG-Cluster/Kafka-Cluster
# sind eigene, volleigenstaendige Charts (siehe gitops/apps/kafka-cluster.yaml u.a.), siehe
# charts/README.md.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ticketflow
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git@github.com:Engelhan/DHBWCASCloudNative.git
    targetRevision: main
    path: charts/ticketflow
    helm:
      valueFiles:
        - values-dev.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: ticketflow
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
