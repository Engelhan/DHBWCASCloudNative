---
# TicketFlow-Messaging-Ebene: Kafka + Schema-Registry-Registrierung (Carlos' Scope). Eigener
# Chart ../../charts/ticketflow (kein Wrapper - volleigene Custom Resources, siehe
# charts/ticketflow/Chart.yaml). catalog-api/frontend sind bewusst NICHT hier drin - eigener
# Chart/eigene Application, siehe gitops/apps/ticketflow-app.yaml (Team-Entscheidung: nicht in
# derselben Application wie Kafka deployen). reservation-worker/notification-worker/CNPG-Cluster
# sind ebenfalls eigene, volleigenstaendige Charts, siehe charts/README.md.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ticketflow
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git@github.com:Engelhan/DHBWCASCloudNative.git
    targetRevision: main
    path: charts/ticketflow
    helm:
      valueFiles:
        - values-dev.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: ticketflow
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
