---
# TicketFlow-Anwendungsebene. Eigener Chart ../../charts/ticketflow (kein Wrapper - volleigene
# Custom Resources, siehe charts/ticketflow/Chart.yaml). Bisher nur der Kafka-Cluster
# (KafkaNodePool/Kafka/KafkaTopic, siehe charts/ticketflow/templates/messaging/) - catalog-api/
# frontend/notification-worker/CNPG-Cluster folgen als eigene Templates.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ticketflow
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git@github.com:Engelhan/DHBWCASCloudNative.git
    #targetRevision: main
    targetRevision: strimzi-setup
    path: charts/ticketflow
    helm:
      valueFiles:
        - values-dev.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: ticketflow
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
