---
# KEDA. Wrapper-Chart ../../charts/keda (Dependency auf den Upstream-Chart, Werte in dessen
# values.yaml) - einheitliches Muster fuer alle Addon-Charts, siehe charts/README.md. Das
# eigentliche ScaledObject/TriggerAuthentication fuer reservation-worker liegt in
# charts/reservation-worker als Teil dessen eigener Application, nicht hier (P6, siehe
# Root-README ## Entscheidungen).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: keda
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git@github.com:Engelhan/DHBWCASCloudNative.git
    targetRevision: main
    path: charts/keda
  destination:
    server: https://kubernetes.default.svc
    namespace: keda
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # Der Upstream-Chart buendelt mehrere grosse CRDs (crd-scaledjobs.yaml allein > 650 KB) -
      # Client-Side-Apply wuerde die komplette Ressource zusaetzlich als
      # last-applied-configuration-Annotation speichern und damit das harte 262144-Byte-Limit
      # der Kubernetes-API sprengen ("Too long"). Server-Side Apply schreibt diese Annotation
      # gar nicht erst - exakt dasselbe Problem/derselbe Fix wie bei CNPG/Strimzi/
      # kube-prometheus-stack, siehe CLAUDE.md ## Infra layering.
      - ServerSideApply=true
