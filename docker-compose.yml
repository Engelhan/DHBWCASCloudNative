# Rein lokales Entwickler-Tooling fuer catalog-api/frontend, KEIN Teil des
# Terraform -> Ansible -> ArgoCD -> Helm-Deploy-Pfads (siehe CLAUDE.md ## Infra layering).
# Postgres und Kafka hier sind funktionale Stand-ins fuer CNPG/Strimzi im Cluster.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ticketflow
      POSTGRES_USER: ticketflow
      POSTGRES_PASSWORD: ticketflow
    ports:
      - "5432:5432"
    volumes:
      - ./local/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ticketflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  kafka:
    image: apache/kafka:3.8.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:29092,CONTROLLER://:9093,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

  # Legt Reservation- und Result-Topic vorab an, statt sich auf Kafkas Auto-Create-on-first-produce
  # zu verlassen - sonst schlaegt genau die erste Buchung im Screencast mit "Unknown Topic Or
  # Partition" fehl, weil die Themenerstellung asynchron zur ersten Produce-Anfrage laeuft.
  kafka-init:
    image: apache/kafka:3.8.0
    depends_on:
      - kafka
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        until /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --list; do sleep 1; done &&
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists
        --topic reservation-requested --partitions 1 --replication-factor 1 &&
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists
        --topic reservation-result --partitions 1 --replication-factor 1

  # kafkasql-Storage (schemas landen in einem Kafka-Topic + In-Memory-H2) - dieselbe
  # Konfiguration wie charts/apicurio/values.yaml, kein zusaetzlicher DB-Container noetig, da
  # Kafka hier bereits laeuft.
  apicurio:
    image: quay.io/apicurio/apicurio-registry:3.3.3
    ports:
      - "8083:8080"
    environment:
      APICURIO_STORAGE_KIND: kafkasql
      APICURIO_KAFKASQL_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      kafka-init:
        condition: service_completed_successfully

  # Registriert die beiden kanonischen Schemas lokal - dieselbe curl/jq-Logik wie
  # charts/ticketflow/templates/schema-registry/register-job.yaml, siehe dessen Kommentar fuer
  # die Begruendung. Mountet die Schemas direkt aus charts/ticketflow statt einer lokalen Kopie.
  apicurio-init:
    image: alpine:3.20
    depends_on:
      - apicurio
    volumes:
      - ./charts/ticketflow/files/schemas:/schemas:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        apk add --no-cache curl jq >/dev/null &&
        until curl -sf http://apicurio:8080/apis/registry/v3/groups >/dev/null 2>&1; do sleep 1; done &&
        for pair in reservation-requested-value:/schemas/reservation-requested.schema.json reservation-result-value:/schemas/reservation-result.schema.json; do
        id="$${pair%%:*}"; file="$${pair#*:}";
        body=$$(jq -n --arg id "$$id" --rawfile content "$$file" '{artifactId:$$id, artifactType:"JSON", firstVersion:{content:{content:$$content, contentType:"application/json"}}}');
        curl -sf -X POST "http://apicurio:8080/apis/registry/v3/groups/ticketflow/artifacts?ifExists=FIND_OR_CREATE_VERSION&canonical=true" -H "Content-Type: application/json" --data "$$body";
        done

  catalog-api:
    build: ./src/catalog-api
    ports:
      - "8080:8080"
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ticketflow
      DB_USER: ticketflow
      DB_PASSWORD: ticketflow
      DB_SSLMODE: disable
      KAFKA_BROKERS: kafka:29092
      RESERVATION_TOPIC: reservation-requested
      REGISTRY_URL: http://apicurio:8080/apis/registry/v3
      REGISTRY_GROUP_ID: ticketflow
      LOG_LEVEL: info
      CORS_ALLOWED_ORIGIN: http://localhost:8081
    depends_on:
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      apicurio-init:
        condition: service_completed_successfully

  reservation-worker:
    build: ./src/reservation-worker
    ports:
      - "8082:8080"
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ticketflow
      DB_USER: ticketflow
      DB_PASSWORD: ticketflow
      DB_SSLMODE: disable
      KAFKA_BROKERS: kafka:29092
      RESERVATION_TOPIC: reservation-requested
      RESULT_TOPIC: reservation-result
      CONSUMER_GROUP: reservation-worker
      REGISTRY_URL: http://apicurio:8080/apis/registry/v3
      REGISTRY_GROUP_ID: ticketflow
      LOG_LEVEL: info
    depends_on:
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      apicurio-init:
        condition: service_completed_successfully

  # Bislang fehlte notification-worker hier komplett - ohne ihn liess sich die
  # Konsumenten-Seite (jetzt inkl. Schema-Validierung) nicht lokal end-to-end testen.
  notification-worker:
    build: ./src/notification-worker
    ports:
      - "8084:8080"
    environment:
      KAFKA_BROKERS: kafka:29092
      RESULT_TOPIC: reservation-result
      CONSUMER_GROUP: notification-worker
      REGISTRY_URL: http://apicurio:8080/apis/registry/v3
      REGISTRY_GROUP_ID: ticketflow
      LOG_LEVEL: info
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      apicurio-init:
        condition: service_completed_successfully

  frontend:
    build: ./src/frontend
    ports:
      - "8081:80"
    depends_on:
      - catalog-api
