# Rein lokales Entwickler-Tooling fuer catalog-api/frontend, KEIN Teil des
# Terraform -> Ansible -> ArgoCD -> Helm-Deploy-Pfads (siehe CLAUDE.md ## Infra layering).
# Postgres und Kafka hier sind funktionale Stand-ins fuer CNPG/Strimzi im Cluster.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ticketflow
      POSTGRES_USER: ticketflow
      POSTGRES_PASSWORD: ticketflow
    ports:
      - "5432:5432"
    volumes:
      - ./local/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ticketflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  kafka:
    image: apache/kafka:3.8.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:29092,CONTROLLER://:9093,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

  # Legt das Reservation-Topic vorab an, statt sich auf Kafkas Auto-Create-on-first-produce zu
  # verlassen - sonst schlaegt genau die erste Buchung im Screencast mit "Unknown Topic Or
  # Partition" fehl, weil die Themenerstellung asynchron zur ersten Produce-Anfrage laeuft.
  kafka-init:
    image: apache/kafka:3.8.0
    depends_on:
      - kafka
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        until /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --list; do sleep 1; done &&
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists
        --topic reservation-requested --partitions 1 --replication-factor 1

  catalog-api:
    build: ./src/catalog-api
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://ticketflow:ticketflow@postgres:5432/ticketflow?sslmode=disable
      KAFKA_BROKERS: kafka:29092
      RESERVATION_TOPIC: reservation-requested
      LOG_LEVEL: info
      CORS_ALLOWED_ORIGIN: http://localhost:8081
    depends_on:
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully

  frontend:
    build: ./src/frontend
    ports:
      - "8081:80"
    depends_on:
      - catalog-api
