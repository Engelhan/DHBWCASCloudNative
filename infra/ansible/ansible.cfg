[defaults]
inventory = inventory/hosts.ini
roles_path = roles
retry_files_enabled = False
; Die VMs sind ephemer (jeder "terraform apply" kann neue Instanzen mit denselben Namen/IPs
; erzeugen) - Host-Keys aendern sich dadurch regelmaessig. Fuer dieses Lab bewusst deaktiviert,
; statt bei jedem Rebuild manuell known_hosts zu bereinigen.
host_key_checking = False

[ssh_connection]
pipelining = True
