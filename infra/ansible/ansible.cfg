[defaults]
inventory = inventory/hosts.ini
roles_path = roles
retry_files_enabled = False
; The VMs are ephemeral (every "terraform apply" can create new instances with the same
; names/IPs) - host keys therefore change regularly. Deliberately disabled for this lab instead of
; cleaning up known_hosts by hand after every rebuild.
host_key_checking = False

[ssh_connection]
pipelining = True
