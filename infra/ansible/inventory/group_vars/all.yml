---
# Pinned versions (see root README ## Entscheidungen on P2/P3 - no "latest" references).
# When updating: check https://github.com/k3s-io/k3s/releases and
# https://github.com/argoproj/argo-cd/releases and adjust deliberately here.
k3s_version: "v1.37.0+k3s1"
argocd_version: "v3.4.5"

# Despite its name, DHBWV6 is dual-stack (in addition to its IPv6 address, every VM gets a
# private but genuinely internet-routed IPv4 address via DHCP - see
# infra/terraform/modules/compute/outputs.tf). k3s therefore runs in dual-stack mode: IPv6 stays
# primary (--node-ip/--tls-san/kubeconfig server URL IPv6 first, ULA range fd00::/8 for the
# cluster/service CIDR, since it does not need to be reachable from outside - RFC 4193), IPv4 is
# added as the second family, solely so that pods (e.g. ArgoCD, external-dns) can reach IPv4-only
# targets such as github.com, which has no AAAA record. The IPv4 CIDRs are the k3s defaults
# (10.42.0.0/16 / 10.43.0.0/16) - they do not collide with the VMs' own DHCP range
# 10.200.0.0/19. --flannel-ipv6-masq is still needed for IPv6 pod egress (ULA is not globally
# routable); k3s/Flannel masquerade IPv4 pod egress by default, no equivalent explicit flag needed.
k3s_cluster_cidr: "fd00:42::/56"
k3s_service_cidr: "fd00:43::/112"
k3s_cluster_cidr_v4: "10.42.0.0/16"
k3s_service_cidr_v4: "10.43.0.0/16"
