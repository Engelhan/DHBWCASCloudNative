---
# Pinned versions (P3).
k3s_version: "v1.37.0+k3s1"
argocd_version: "v3.4.5"

# Dual-stack, IPv6 primary (ULA ranges). IPv4 only so pods reach IPv4-only hosts like github.com;
# k3s' default IPv4 CIDRs don't collide with the VMs' 10.200.0.0/19.
k3s_cluster_cidr: "fd00:42::/56"
k3s_service_cidr: "fd00:43::/112"
k3s_cluster_cidr_v4: "10.42.0.0/16"
k3s_service_cidr_v4: "10.43.0.0/16"
