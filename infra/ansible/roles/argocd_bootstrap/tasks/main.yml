---
- name: Namespace argocd anlegen
  command: k3s kubectl create namespace argocd
  register: ns_create
  failed_when: ns_create.rc != 0 and 'AlreadyExists' not in ns_create.stderr
  changed_when: ns_create.rc == 0

# Core-Install (kein HA-Manifest): fuer einen einzelnen Control-Plane-Node im Lab ausreichend
# und einfacher zu betreiben als das ha/install.yaml. Version gepinnt statt "stable"-Tag, damit
# ein erneuter Playbook-Lauf reproduzierbar dieselbe ArgoCD-Version installiert.
# --server-side statt normalem "apply": normales (Client-Side-)Apply haengt die komplette
# vorherige Konfiguration als last-applied-configuration-Annotation ans Objekt - bei ArgoCDs
# riesiger applicationsets.argoproj.io-CRD sprengt das den harten 262144-Byte-Annotationslimit
# der Kubernetes-API ("Too long"). Server-Side Apply schreibt diese Annotation gar nicht erst.
# --force-conflicts, damit ein erneuter Playbook-Lauf nicht an Field-Manager-Konflikten scheitert,
# falls ArgoCD selbst (anderer Field-Manager) inzwischen an denselben Feldern reconciled hat.
- name: ArgoCD-Manifest (gepinnte Version) anwenden
  command: >
    k3s kubectl apply -n argocd --server-side --force-conflicts
    -f https://raw.githubusercontent.com/argoproj/argo-cd/{{ argocd_version }}/manifests/install.yaml
  register: argocd_apply
  changed_when: "'unchanged' not in argocd_apply.stdout"

- name: Warten, bis argocd-server ausgerollt ist
  command: k3s kubectl -n argocd rollout status deploy/argocd-server --timeout=180s
  changed_when: false

- name: Initiales Admin-Passwort auslesen
  command: >
    k3s kubectl -n argocd get secret argocd-initial-admin-secret
    -o jsonpath={.data.password}
  register: argocd_admin_password_b64
  changed_when: false

- name: Initiales Admin-Passwort anzeigen
  debug:
    msg: "ArgoCD Admin-Login: user=admin password={{ argocd_admin_password_b64.stdout | b64decode }}"

# Die ApplicationSets wendet bewusst NICHT diese Rolle an, sondern gitops_rollout - erst nach
# gitops_secrets: ohne Repo-Credential kann ArgoCD das private Repo nicht lesen, und das gestufte
# Warten auf "alles gruen" liefe ins Leere.
