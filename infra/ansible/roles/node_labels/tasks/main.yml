---
# Region label per worker from the inventory (P4).
- name: Set the region label on every worker
  command: >
    k3s kubectl label node {{ item }}
    topology.ticketflow/region={{ hostvars[item].region }}
    --overwrite
  loop: "{{ groups['workers'] }}"
  changed_when: true

# Keep regular workloads off the control plane. k3s' own components tolerate this taint.
# NoSchedule evicts nothing: move existing pods once by hand.
- name: Taint the control plane against regular workloads
  command: >
    k3s kubectl taint node {{ inventory_hostname }}
    node-role.kubernetes.io/control-plane=:NoSchedule
    --overwrite
  changed_when: true
