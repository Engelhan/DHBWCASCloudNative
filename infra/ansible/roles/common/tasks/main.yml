---
- name: Update the package index
  apt:
    update_cache: true
    cache_valid_time: 3600

- name: Install base packages
  apt:
    name:
      - curl
      - ca-certificates
    state: present

# k3s uses the OS hostname as node name; node_labels relies on it matching inventory_hostname.
- name: Set the hostname to the Terraform resource name
  hostname:
    name: "{{ inventory_hostname }}"

- name: Add the hostname to /etc/hosts
  lineinfile:
    path: /etc/hosts
    regexp: '^127\.0\.1\.1'
    line: "127.0.1.1 {{ inventory_hostname }}"
    state: present

# Keep multipathd away from Longhorn's iSCSI devices (/dev/sd*), otherwise mounts fail with
# "already mounted or mount point busy". The root disk is vda.
- name: Gather services (is multipathd present?)
  service_facts:

- name: Create the directory for multipath drop-ins
  file:
    path: /etc/multipath/conf.d
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: "'multipathd.service' in ansible_facts.services"

- name: Exclude Longhorn devices from multipathd
  copy:
    dest: /etc/multipath/conf.d/longhorn.conf
    content: |
      blacklist {
          devnode "^sd[a-z0-9]+"
      }
    owner: root
    group: root
    mode: "0644"
  when: "'multipathd.service' in ansible_facts.services"
  notify: Restart multipathd
