---
# Legt Secrets an, die GitOps strukturell nicht selbst bereitstellen kann (ArgoCD ist
# git-getrieben, die Werte hier duerfen laut CLAUDE.md ## Infra layering explizit NICHT im
# Git-Repo landen): das ArgoCD-Repository-Credential fuers private GitHub-Repo selbst, und die
# RFC2136-TSIG-Secrets, die charts/cert-manager-config und charts/external-dns per
# secretKeyRef referenzieren (siehe gitops/README.md ## DNS/ACME). Das ist KEINE Wiederholung
# der revertierten Addon-Installation auf Branch ansible-bootstrap: diese Rolle installiert
# keine Helm-Charts/Operatoren (das bleibt vollstaendig GitOps-eigen), sondern nur
# Secret-Objekte - das uebliche "Secrets werden ausserhalb von GitOps bootstrapped"-Muster.
#
# Laeuft komplett lokal (delegate_to: localhost) gegen die frisch abgeholte kubeconfig - die
# Geheimnisse gehen dadurch nie per SSH auf die Control-Plane und landen nicht in deren
# Prozessliste.
# Die Repo-URL steht nicht mehr hier, sondern zentral in gitops/env/cluster.yaml - derselben
# Datei, aus der auch ArgoCD und alle Charts ihre Werte beziehen. Vorher war sie hier woertlich
# eingetragen und damit die eine Stelle, die ein Fork zuverlaessig uebersah: das Credential wurde
# dann fuer das ORIGINAL-Repo registriert, und saemtliche Applications blieben dauerhaft
# "Unknown", ohne dass die Fehlermeldung darauf hingewiesen haette.
- name: Zentrale Konfiguration (gitops/env/cluster.yaml) einlesen
  include_vars:
    file: "{{ playbook_dir }}/../../../gitops/env/cluster.yaml"
  delegate_to: localhost
  become: false

- name: Prüfen, ob der ArgoCD-SSH-Deploy-Key lokal vorhanden ist
  stat:
    path: "{{ playbook_dir }}/../argocd_deploy_key"
  delegate_to: localhost
  become: false
  register: gitops_secrets_deploy_key_file

# Repo ist privat (siehe gitops/README.md) - ohne dieses Credential kann ArgoCDs repo-server
# gitops/applicationset.yaml und alles darunter gar nicht erst klonen. Ueberspringt sich
# selbst, solange kein Deploy-Key lokal liegt (siehe infra/ansible/README.md ## GitOps-Secrets
# fuer die Erzeugung).
- name: ArgoCD-Repository-Credential (SSH-Deploy-Key) anlegen/aktualisieren
  when: gitops_secrets_deploy_key_file.stat.exists
  delegate_to: localhost
  become: false
  environment:
    KUBECONFIG: "{{ playbook_dir }}/../kubeconfig"
  no_log: true
  block:
    # --from-file statt --from-literal: der private Schluessel wird so aus der Datei gelesen,
    # ohne je selbst als CLI-Argument (und damit in der lokalen Prozessliste) aufzutauchen -
    # nur der Dateipfad ist ein Argument.
    - name: Repository-Secret anlegen/aktualisieren
      shell: |
        set -o pipefail
        kubectl create secret generic repo-ticketflow -n argocd \
          --from-literal=type=git \
          --from-literal=url="{{ ticketflow.repoURL }}" \
          --from-file=sshPrivateKey="{{ playbook_dir }}/../argocd_deploy_key" \
          --dry-run=client -o yaml | kubectl apply -f -
      args:
        executable: /bin/bash
      register: gitops_secrets_repo_apply
      changed_when: "'unchanged' not in gitops_secrets_repo_apply.stdout"

    # Erst dieses Label macht aus einem gewoehnlichen Secret ein von ArgoCD erkanntes
    # Repository-Credential - "kubectl create secret" kennt keine --labels-Option.
    - name: Repository-Secret als ArgoCD-Repository-Credential labeln
      command: >-
        kubectl label secret repo-ticketflow -n argocd
        argocd.argoproj.io/secret-type=repository --overwrite
      changed_when: true

- name: Prüfen, ob secrets.yml lokal vorhanden ist
  stat:
    path: "{{ playbook_dir }}/../secrets.yml"
  delegate_to: localhost
  become: false
  register: gitops_secrets_file

- name: secrets.yml einlesen
  include_vars:
    file: "{{ playbook_dir }}/../secrets.yml"
  when: gitops_secrets_file.stat.exists

# Solange secrets.yml fehlt oder noch den Platzhalter aus secrets.yml.example enthaelt
# (DNS-Zone noch nicht aktiviert), ueberspringt sich dieser Block selbst statt fehlzuschlagen -
# analog zum ApplicationSet-Stat-Check in argocd_bootstrap.
- name: RFC2136-TSIG-Secrets anlegen/aktualisieren
  when:
    - rfc2136_tsig_secret_value is defined
    - rfc2136_tsig_secret_value != "CHANGE_ME"
    - rfc2136_tsig_secret_value | length > 0
  delegate_to: localhost
  become: false
  environment:
    KUBECONFIG: "{{ playbook_dir }}/../kubeconfig"
  no_log: true
  block:
    - name: Namespace cert-manager sicherstellen
      command: kubectl create namespace cert-manager
      register: gitops_secrets_cm_ns
      failed_when: gitops_secrets_cm_ns.rc != 0 and 'AlreadyExists' not in gitops_secrets_cm_ns.stderr
      changed_when: gitops_secrets_cm_ns.rc == 0

    - name: Namespace external-dns sicherstellen
      command: kubectl create namespace external-dns
      register: gitops_secrets_edns_ns
      failed_when: gitops_secrets_edns_ns.rc != 0 and 'AlreadyExists' not in gitops_secrets_edns_ns.stderr
      changed_when: gitops_secrets_edns_ns.rc == 0

    # --dry-run=client -o yaml | apply statt create, damit der Task idempotent ist (ein
    # geaenderter Wert in secrets.yml wird bei einem erneuten Playbook-Lauf uebernommen, statt
    # dass "create" beim zweiten Mal mit AlreadyExists fehlschlaegt).
    - name: cert-manager-rfc2136-tsig-Secret anlegen/aktualisieren
      shell: |
        set -o pipefail
        kubectl create secret generic cert-manager-rfc2136-tsig \
          -n cert-manager --from-literal=secret="{{ rfc2136_tsig_secret_value }}" \
          --dry-run=client -o yaml | kubectl apply -f -
      args:
        executable: /bin/bash
      register: gitops_secrets_cm_apply
      changed_when: "'unchanged' not in gitops_secrets_cm_apply.stdout"

    - name: external-dns-rfc2136-tsig-Secret anlegen/aktualisieren
      shell: |
        set -o pipefail
        kubectl create secret generic external-dns-rfc2136-tsig \
          -n external-dns --from-literal=secret="{{ rfc2136_tsig_secret_value }}" \
          --dry-run=client -o yaml | kubectl apply -f -
      args:
        executable: /bin/bash
      register: gitops_secrets_edns_apply
      changed_when: "'unchanged' not in gitops_secrets_edns_apply.stdout"
