---
# Creates secrets that GitOps structurally cannot provide itself (ArgoCD is git-driven, and per
# CLAUDE.md ## Infra layering these values must explicitly NOT end up in the git repo): the ArgoCD
# repository credential for the private GitHub repo itself, and the RFC2136 TSIG secrets that
# charts/cert-manager-config and charts/external-dns reference via secretKeyRef (see
# gitops/README.md ## DNS/ACME). This is NOT a repeat of the reverted addon installation on the
# ansible-bootstrap branch: this role installs no Helm charts/operators (that stays entirely
# GitOps-owned), only Secret objects - the usual "secrets are bootstrapped outside of GitOps"
# pattern.
#
# Runs entirely locally (delegate_to: localhost) against the freshly fetched kubeconfig - the
# secrets therefore never travel to the control plane via SSH and never show up in its process
# list.
# The repo URL is no longer written here but centrally in gitops/env/cluster.yaml - the same file
# ArgoCD and all charts read their values from. It used to be a literal here and was therefore the
# one place a fork reliably missed: the credential was then registered for the ORIGINAL repo, and
# all Applications stayed "Unknown" forever without the error message pointing at the cause.
- name: Read the central configuration (gitops/env/cluster.yaml)
  include_vars:
    file: "{{ playbook_dir }}/../../../gitops/env/cluster.yaml"
  delegate_to: localhost
  become: false

- name: Check whether the ArgoCD SSH deploy key exists locally
  stat:
    path: "{{ playbook_dir }}/../argocd_deploy_key"
  delegate_to: localhost
  become: false
  register: gitops_secrets_deploy_key_file

# The repo is private (see gitops/README.md) - without this credential ArgoCD's repo-server cannot
# even clone gitops/applicationset.yaml and everything below it. Skips itself as long as no deploy
# key exists locally (see infra/ansible/README.md ## GitOps secrets for how to create it).
- name: Create/update the ArgoCD repository credential (SSH deploy key)
  when: gitops_secrets_deploy_key_file.stat.exists
  delegate_to: localhost
  become: false
  environment:
    KUBECONFIG: "{{ playbook_dir }}/../kubeconfig"
  no_log: true
  block:
    # --from-file instead of --from-literal: the private key is read from the file without ever
    # appearing as a CLI argument itself (and thereby in the local process list) - only the file
    # path is an argument.
    - name: Create/update the repository secret
      shell: |
        set -o pipefail
        kubectl create secret generic repo-ticketflow -n argocd \
          --from-literal=type=git \
          --from-literal=url="{{ ticketflow.repoURL }}" \
          --from-file=sshPrivateKey="{{ playbook_dir }}/../argocd_deploy_key" \
          --dry-run=client -o yaml | kubectl apply -f -
      args:
        executable: /bin/bash
      register: gitops_secrets_repo_apply
      changed_when: "'unchanged' not in gitops_secrets_repo_apply.stdout"

    # Only this label turns an ordinary secret into a repository credential recognized by ArgoCD -
    # "kubectl create secret" has no --labels option.
    - name: Label the repository secret as an ArgoCD repository credential
      command: >-
        kubectl label secret repo-ticketflow -n argocd
        argocd.argoproj.io/secret-type=repository --overwrite
      changed_when: true

- name: Check whether secrets.yml exists locally
  stat:
    path: "{{ playbook_dir }}/../secrets.yml"
  delegate_to: localhost
  become: false
  register: gitops_secrets_file

- name: Read secrets.yml
  include_vars:
    file: "{{ playbook_dir }}/../secrets.yml"
  when: gitops_secrets_file.stat.exists

# As long as secrets.yml is missing or still contains the placeholder from secrets.yml.example
# (DNS zone not activated yet), this block skips itself instead of failing - same as the
# ApplicationSet stat check in gitops_rollout.
- name: Create/update the RFC2136 TSIG secrets
  when:
    - rfc2136_tsig_secret_value is defined
    - rfc2136_tsig_secret_value != "CHANGE_ME"
    - rfc2136_tsig_secret_value | length > 0
  delegate_to: localhost
  become: false
  environment:
    KUBECONFIG: "{{ playbook_dir }}/../kubeconfig"
  no_log: true
  block:
    - name: Ensure the cert-manager namespace exists
      command: kubectl create namespace cert-manager
      register: gitops_secrets_cm_ns
      failed_when: gitops_secrets_cm_ns.rc != 0 and 'AlreadyExists' not in gitops_secrets_cm_ns.stderr
      changed_when: gitops_secrets_cm_ns.rc == 0

    - name: Ensure the external-dns namespace exists
      command: kubectl create namespace external-dns
      register: gitops_secrets_edns_ns
      failed_when: gitops_secrets_edns_ns.rc != 0 and 'AlreadyExists' not in gitops_secrets_edns_ns.stderr
      changed_when: gitops_secrets_edns_ns.rc == 0

    # --dry-run=client -o yaml | apply instead of create so that the task is idempotent (a changed
    # value in secrets.yml is picked up on a repeated playbook run, instead of "create" failing
    # with AlreadyExists the second time).
    - name: Create/update the cert-manager-rfc2136-tsig secret
      shell: |
        set -o pipefail
        kubectl create secret generic cert-manager-rfc2136-tsig \
          -n cert-manager --from-literal=secret="{{ rfc2136_tsig_secret_value }}" \
          --dry-run=client -o yaml | kubectl apply -f -
      args:
        executable: /bin/bash
      register: gitops_secrets_cm_apply
      changed_when: "'unchanged' not in gitops_secrets_cm_apply.stdout"

    - name: Create/update the external-dns-rfc2136-tsig secret
      shell: |
        set -o pipefail
        kubectl create secret generic external-dns-rfc2136-tsig \
          -n external-dns --from-literal=secret="{{ rfc2136_tsig_secret_value }}" \
          --dry-run=client -o yaml | kubectl apply -f -
      args:
        executable: /bin/bash
      register: gitops_secrets_edns_apply
      changed_when: "'unchanged' not in gitops_secrets_edns_apply.stdout"
