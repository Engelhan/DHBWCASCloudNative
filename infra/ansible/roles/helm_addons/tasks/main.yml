---
# Voraussetzung fuer cert_manager/external_dns/longhorn (system_upgrade nutzt
# rohe Manifeste statt Helm): helm-diff-Plugin + die benoetigten Helm-Repos.
# Laeuft nur auf der Control-Plane (dort liegt kubeconfig_root, siehe
# k3s_server ## Client-/Entwickler-Tooling, das den helm-Binary installiert).

- name: helm-diff-Plugin sicherstellen
  kubernetes.core.helm_plugin:
    plugin_path: https://github.com/databus23/helm-diff
    state: present

- name: Benoetigte Helm-Repositories sicherstellen
  kubernetes.core.helm_repository:
    name: "{{ item.name }}"
    repo_url: "{{ item.url }}"
    state: present
  loop: "{{ k3s_role_helm_repos }}"

- name: Longhorn-Helm-Repository sicherstellen
  kubernetes.core.helm_repository:
    name: longhorn
    repo_url: https://charts.longhorn.io
    state: present
  when: longhorn_enabled | bool
