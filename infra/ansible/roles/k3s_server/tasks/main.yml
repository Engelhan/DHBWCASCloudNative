---
- name: Prüfen, ob k3s bereits installiert ist
  stat:
    path: /usr/local/bin/k3s
  register: k3s_bin

# DHBWV6 ist IPv6-only: --node-ip/--tls-san auf die eigene Adresse, --cluster-cidr/--service-cidr
# als IPv6-Bloecke (siehe inventory/group_vars/all.yml), --flannel-ipv6-masq fuer Pod-Egress-NAT,
# da die Pod-/Service-CIDRs (ULA fd00::/8) selbst nicht global routbar sind. --disable=local-storage
# nur wenn Longhorn die alleinige Default-StorageClass sein soll (siehe roles/longhorn) - sonst
# bleiben lokales local-path UND Longhorn parallel nutzbar.
- name: k3s-Server installieren
  shell: |
    set -o pipefail
    curl -sfL https://get.k3s.io | \
    INSTALL_K3S_VERSION={{ k3s_version }} \
    sh -s - server \
      --node-ip {{ ansible_host }} \
      --tls-san {{ ansible_host }} \
      --cluster-cidr {{ k3s_cluster_cidr }} \
      --service-cidr {{ k3s_service_cidr }} \
      --flannel-ipv6-masq \
      --write-kubeconfig-mode 644 \
      {{ '--disable=local-storage' if (longhorn_enabled | bool and longhorn_default_storage_class | bool) else '' }}
  args:
    executable: /bin/bash
  when: not k3s_bin.stat.exists

- name: Warten, bis die kubeconfig-Datei existiert
  wait_for:
    path: /etc/rancher/k3s/k3s.yaml
    timeout: 180

- name: Warten, bis die k3s-API antwortet
  command: k3s kubectl get --raw=/readyz
  register: k3s_ready
  until: k3s_ready.rc == 0
  retries: 30
  delay: 5
  changed_when: false

- name: Node-Token auslesen
  slurp:
    src: /var/lib/rancher/k3s/server/node-token
  register: k3s_node_token_raw

- name: Node-Token als Fact bereitstellen (fuer den Agent-Join der Worker)
  set_fact:
    k3s_node_token: "{{ k3s_node_token_raw.content | b64decode | trim }}"

- name: kubeconfig lokal abholen
  fetch:
    src: /etc/rancher/k3s/k3s.yaml
    dest: "{{ playbook_dir }}/../kubeconfig"
    flat: true

# Die kubeconfig von k3s zeigt standardmaessig auf ein Loopback (fuer lokale Nutzung auf der
# Control-Plane selbst) - auf diesem IPv6-only-Host schreibt k3s dafuer "[::1]", nicht das aus
# IPv4-Setups gewohnte "127.0.0.1" (beide Formen werden hier abgedeckt, da sich das je nach
# k3s-/OS-Verhalten unterscheiden kann und ein nicht matchender Regex den replace-Task sonst
# stillschweigend zum No-Op macht). Fuer Zugriff von aussen auf die tatsaechliche IPv6-Adresse
# umbiegen - Klammer-Syntax, da sonst der Doppelpunkt vor dem Port mit den Adress-Doppelpunkten
# kollidiert.
- name: Server-URL in der lokal abgeholten kubeconfig auf die echte Adresse setzen
  delegate_to: localhost
  become: false
  replace:
    path: "{{ playbook_dir }}/../kubeconfig"
    regexp: 'https://(127\.0\.0\.1|\[::1\]):6443'
    replace: "https://[{{ ansible_host }}]:6443"

# -----------------------------------------------------------------------------
# Client-/Entwickler-Tooling (nur Control-Plane - Worker haben keine kubeconfig)
# -----------------------------------------------------------------------------
# python3-kubernetes ist zugleich Voraussetzung fuer die kubernetes.core-Module
# (helm/k8s/k8s_info), die die Addon-Rollen (helm_addons, cert_manager,
# external_dns, longhorn, system_upgrade) verwenden - siehe playbooks/site.yml.
- name: Client-/Entwickler-Tooling installieren
  when: bootstrap_install_client_tools | bool
  block:
    - name: python3-kubernetes installieren (fuer Ansible k8s/helm-Module)
      apt:
        name: python3-kubernetes
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Helm installieren
      shell: |
        set -o pipefail
        curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 \
          | DESIRED_VERSION={{ helm_version }} bash
      args:
        executable: /bin/bash
        creates: /usr/local/bin/helm

    - name: Skaffold installieren
      shell: |
        set -o pipefail
        curl -Lo skaffold https://storage.googleapis.com/skaffold/releases/{{ skaffold_version }}/skaffold-linux-amd64 && \
        install skaffold /usr/local/bin/ && \
        rm skaffold
      args:
        executable: /bin/bash
        creates: /usr/local/bin/skaffold

    - name: kubectl installieren
      shell: |
        set -o pipefail
        curl -LO "https://dl.k8s.io/release/{{ kubectl_version }}/bin/linux/amd64/kubectl" && \
        install -m 755 kubectl /usr/local/bin/kubectl && \
        rm kubectl
      args:
        executable: /bin/bash
        creates: /usr/local/bin/kubectl

    - name: "'k'-Alias fuer kubectl systemweit konfigurieren"
      copy:
        dest: /etc/profile.d/kubectl_alias.sh
        content: |
          alias k='/usr/local/bin/kubectl'
        owner: root
        group: root
        mode: "0755"

    - name: KUBECONFIG-Variable systemweit setzen
      copy:
        dest: /etc/profile.d/kubeconfig.sh
        content: |
          export KUBECONFIG={{ kubeconfig_root }}
        owner: root
        group: root
        mode: "0755"

    - name: Helm-Bash-Completion systemweit konfigurieren
      copy:
        dest: /etc/profile.d/helm_completion.sh
        content: |
          if [ -x /usr/local/bin/helm ]; then
            source <(/usr/local/bin/helm completion bash)
          fi
        owner: root
        group: root
        mode: "0755"

    - name: kubectl-Bash-Completion systemweit konfigurieren
      copy:
        dest: /etc/profile.d/kubectl_completion.sh
        content: |
          if [ -x /usr/local/bin/kubectl ]; then
            source <(/usr/local/bin/kubectl completion bash)
          fi
        owner: root
        group: root
        mode: "0755"

    - name: "Code-Completion fuer den 'k'-Alias systemweit konfigurieren"
      copy:
        dest: /etc/profile.d/kubectl_k_completion.sh
        content: |
          complete -F __start_kubectl k
        owner: root
        group: root
        mode: "0755"

# /etc/profile.d/*.sh wird nur von Login-Shells gelesen. Interaktive Nicht-
# Login-Shells (z.B. "sudo bash") lesen /etc/bash.bashrc - die profile.d-
# Snippets dort ebenfalls einbinden, damit k-Alias, KUBECONFIG und Completion
# auch dort verfuegbar sind.
- name: profile.d-Snippets auch in interaktiven Nicht-Login-Bash-Shells laden
  when: bootstrap_install_client_tools | bool
  blockinfile:
    path: /etc/bash.bashrc
    create: true
    owner: root
    group: root
    mode: "0644"
    marker: "# {mark} ANSIBLE MANAGED: profile.d fuer Nicht-Login-Shells laden"
    block: |
      if [ -d /etc/profile.d ]; then
        for _pd in /etc/profile.d/*.sh; do
          [ -r "$_pd" ] && . "$_pd"
        done
        unset _pd
      fi
