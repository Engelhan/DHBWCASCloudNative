---
- name: Prüfen, ob k3s bereits installiert ist
  stat:
    path: /usr/local/bin/k3s
  register: k3s_bin

# DHBWV6 ist dual-stack: --node-ip/--cluster-cidr/--service-cidr bekommen je einen
# IPv6-Wert (primaer, siehe inventory/group_vars/all.yml) UND einen IPv4-Wert (zusaetzlich,
# damit Pods IPv4-only-Ziele wie github.com erreichen koennen - siehe CLAUDE.md ##
# Infra layering). --flannel-ipv6-masq bleibt fuer IPv6-Pod-Egress noetig (ULA-Bereich
# fd00::/8 ist nicht global routbar); IPv4-Pod-Egress maskiert k3s/Flannel standardmaessig.
- name: k3s-Server installieren
  shell: |
    set -o pipefail
    curl -sfL https://get.k3s.io | \
    INSTALL_K3S_VERSION={{ k3s_version }} \
    sh -s - server \
      --node-ip {{ ansible_host }},{{ node_ip_v4 }} \
      --tls-san {{ ansible_host }} \
      --tls-san {{ node_ip_v4 }} \
      --cluster-cidr {{ k3s_cluster_cidr }},{{ k3s_cluster_cidr_v4 }} \
      --service-cidr {{ k3s_service_cidr }},{{ k3s_service_cidr_v4 }} \
      --flannel-ipv6-masq \
      --write-kubeconfig-mode 644
  args:
    executable: /bin/bash
  when: not k3s_bin.stat.exists

- name: Warten, bis die k3s-API antwortet
  command: k3s kubectl get --raw=/readyz
  register: k3s_ready
  until: k3s_ready.rc == 0
  retries: 30
  delay: 5
  changed_when: false

- name: Node-Token auslesen
  slurp:
    src: /var/lib/rancher/k3s/server/node-token
  register: k3s_node_token_raw

- name: Node-Token als Fact bereitstellen (fuer den Agent-Join der Worker)
  set_fact:
    k3s_node_token: "{{ k3s_node_token_raw.content | b64decode | trim }}"

- name: kubeconfig lokal abholen
  fetch:
    src: /etc/rancher/k3s/k3s.yaml
    dest: "{{ playbook_dir }}/../kubeconfig"
    flat: true

# Die kubeconfig von k3s zeigt standardmaessig auf ein Loopback (fuer lokale Nutzung auf der
# Control-Plane selbst) - da --node-ip IPv6 zuerst listet (IPv6 bleibt primaer, siehe oben),
# schreibt k3s dafuer "[::1]", nicht das aus IPv4-Setups gewohnte "127.0.0.1" (beide Formen
# werden hier abgedeckt, da sich das je nach k3s-/OS-Verhalten unterscheiden kann und ein nicht
# matchender Regex den replace-Task sonst stillschweigend zum No-Op macht). Fuer Zugriff von
# aussen auf die tatsaechliche IPv6-Adresse
# umbiegen - Klammer-Syntax, da sonst der Doppelpunkt vor dem Port mit den Adress-Doppelpunkten
# kollidiert.
- name: Server-URL in der lokal abgeholten kubeconfig auf die echte Adresse setzen
  delegate_to: localhost
  become: false
  replace:
    path: "{{ playbook_dir }}/../kubeconfig"
    regexp: 'https://(127\.0\.0\.1|\[::1\]):6443'
    replace: "https://[{{ ansible_host }}]:6443"
