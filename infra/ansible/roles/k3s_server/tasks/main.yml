---
- name: Check whether k3s is already installed
  stat:
    path: /usr/local/bin/k3s
  register: k3s_bin

# DHBWV6 is dual-stack: --node-ip/--cluster-cidr/--service-cidr each get an IPv6 value (primary,
# see inventory/group_vars/all.yml) AND an IPv4 value (additionally, so that pods can reach
# IPv4-only targets such as github.com - see CLAUDE.md ## Infra layering). --flannel-ipv6-masq is
# still needed for IPv6 pod egress (the ULA range fd00::/8 is not globally routable); k3s/Flannel
# masquerade IPv4 pod egress by default.
- name: Install the k3s server
  shell: |
    set -o pipefail
    curl -sfL https://get.k3s.io | \
    INSTALL_K3S_VERSION={{ k3s_version }} \
    sh -s - server \
      --node-ip {{ ansible_host }},{{ node_ip_v4 }} \
      --tls-san {{ ansible_host }} \
      --tls-san {{ node_ip_v4 }} \
      --cluster-cidr {{ k3s_cluster_cidr }},{{ k3s_cluster_cidr_v4 }} \
      --service-cidr {{ k3s_service_cidr }},{{ k3s_service_cidr_v4 }} \
      --flannel-ipv6-masq \
      --write-kubeconfig-mode 644
  args:
    executable: /bin/bash
  when: not k3s_bin.stat.exists

- name: Wait until the k3s API responds
  command: k3s kubectl get --raw=/readyz
  register: k3s_ready
  until: k3s_ready.rc == 0
  retries: 30
  delay: 5
  changed_when: false

- name: Read the node token
  slurp:
    src: /var/lib/rancher/k3s/server/node-token
  register: k3s_node_token_raw

- name: Provide the node token as a fact (for the workers' agent join)
  set_fact:
    k3s_node_token: "{{ k3s_node_token_raw.content | b64decode | trim }}"

- name: Fetch the kubeconfig locally
  fetch:
    src: /etc/rancher/k3s/k3s.yaml
    dest: "{{ playbook_dir }}/../kubeconfig"
    flat: true

# By default the k3s kubeconfig points at a loopback address (for local use on the control plane
# itself) - since --node-ip lists IPv6 first (IPv6 stays primary, see above), k3s writes "[::1]"
# rather than the "127.0.0.1" familiar from IPv4 setups (both forms are covered here, since this
# can differ depending on k3s/OS behavior and a non-matching regex would otherwise silently turn
# the replace task into a no-op). Rewrite it to the actual IPv6 address for access from outside -
# bracket syntax, because otherwise the colon before the port collides with the address colons.
- name: Point the server URL in the fetched kubeconfig at the real address
  delegate_to: localhost
  become: false
  replace:
    path: "{{ playbook_dir }}/../kubeconfig"
    regexp: 'https://(127\.0\.0\.1|\[::1\]):6443'
    replace: "https://[{{ ansible_host }}]:6443"
