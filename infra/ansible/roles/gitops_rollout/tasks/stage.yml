---
# One stage (gitops_stage): apply the ApplicationSet labeled ticketflow.io/stage=<stage> and wait
# until all of its Applications exist and are Synced and Healthy.

# Expected count taken directly from the file (elements of the list generator) - otherwise "all
# green" would already be true while the ApplicationSet controller has not created a single
# Application yet.
- name: "Stage {{ gitops_stage }}: determine the expected number of Applications"
  set_fact:
    gitops_stage_expected: >-
      {%- set ns = namespace(n=0) -%}
      {%- for doc in lookup('file', playbook_dir ~ '/../../../gitops/applicationset.yaml') | from_yaml_all -%}
      {%- if doc and doc.metadata.labels['ticketflow.io/stage'] | default('') == gitops_stage -%}
      {%- set ns.n = ns.n + (doc.spec.generators[0].matrix.generators[1].list.elements | length) -%}
      {%- endif -%}
      {%- endfor -%}
      {{ ns.n | int }}

- name: "Stage {{ gitops_stage }}: ApplicationSet present in the manifest"
  assert:
    that: gitops_stage_expected | int > 0
    fail_msg: "No ApplicationSet with ticketflow.io/stage={{ gitops_stage }} in gitops/applicationset.yaml"
    quiet: true

# -l selects exactly this stage's document from the file.
- name: "Stage {{ gitops_stage }}: apply the ApplicationSet"
  command: >
    k3s kubectl apply -f /tmp/ticketflow-applicationset.yaml
    -l ticketflow.io/stage={{ gitops_stage }}
  register: gitops_stage_apply
  changed_when: "'unchanged' not in gitops_stage_apply.stdout"

# One line per Application: "<name> <sync> <health>". The stage is only green once there are
# exactly as many lines as expected and every one reads "Synced Healthy". If the time runs out,
# the error message shows the last output - i.e. exactly which Application is not green yet.
- name: "Stage {{ gitops_stage }}: wait until all {{ gitops_stage_expected }} Applications are Synced and Healthy"
  command:
    argv:
      - k3s
      - kubectl
      - -n
      - argocd
      - get
      - applications.argoproj.io
      - -l
      - "ticketflow.io/stage={{ gitops_stage }}"
      - -o
      - "jsonpath={range .items[*]}{.metadata.name} {.status.sync.status} {.status.health.status}{'\\n'}{end}"
  register: gitops_stage_status
  until: >-
    gitops_stage_status.stdout_lines | length == gitops_stage_expected | int
    and gitops_stage_status.stdout_lines | select('search', ' Synced Healthy$') | list | length
    == gitops_stage_expected | int
  retries: "{{ gitops_rollout_retries }}"
  delay: "{{ gitops_rollout_delay }}"
  changed_when: false
