---
# Applies gitops/applicationsets/<stage>.yaml stage by stage. Skipped if the directory doesn't exist.
- name: Check whether the ApplicationSet manifests exist in the repo
  stat:
    path: "{{ playbook_dir }}/../../../gitops/applicationsets"
  delegate_to: localhost
  become: false
  register: applicationsets_dir

- name: Apply the stage and wait for "everything green"
  include_tasks: stage.yml
  loop: "{{ gitops_rollout_stages }}"
  loop_control:
    loop_var: gitops_stage
  when: applicationsets_dir.stat.exists
