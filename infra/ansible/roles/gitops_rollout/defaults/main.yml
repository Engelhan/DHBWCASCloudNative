---
# Order of the ApplicationSets from gitops/applicationset.yaml (label ticketflow.io/stage).
# Each stage is only applied once all Applications of the previous one are Synced AND Healthy.
gitops_rollout_stages:
  - platform
  - apps

# How long to wait for "everything green" per stage: 120 x 15s = 30 minutes. The first rollout of
# the platform (Longhorn, operators, OpenBao init) takes ~10-15 minutes on the lab VMs.
gitops_rollout_retries: 120
gitops_rollout_delay: 15
