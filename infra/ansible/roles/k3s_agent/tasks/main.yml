---
- name: Prüfen, ob k3s bereits installiert ist
  stat:
    path: /usr/local/bin/k3s
  register: k3s_bin

# --node-ip dual-stack (IPv6 primaer + IPv4), analog zu roles/k3s_server - siehe dortiger
# Kommentar/CLAUDE.md ## Infra layering fuer den Grund (Pods brauchen IPv4-Egress zu
# IPv4-only-Zielen wie github.com).
- name: k3s-Agent installieren und mit der Control-Plane verbinden
  shell: |
    set -o pipefail
    curl -sfL https://get.k3s.io | \
    INSTALL_K3S_VERSION={{ k3s_version }} \
    K3S_URL=https://[{{ hostvars[groups['control_plane'][0]].ansible_host }}]:6443 \
    K3S_TOKEN={{ hostvars[groups['control_plane'][0]].k3s_node_token }} \
    sh -s - agent \
      --node-ip {{ ansible_host }},{{ node_ip_v4 }}
  args:
    executable: /bin/bash
  when: not k3s_bin.stat.exists

- name: Warten, bis der Node auf der Control-Plane als Ready gemeldet wird
  # command als String wuerde von Ansible per shlex geparst, was die Anfuehrungszeichen um
  # "Ready" verschluckt (aus =="Ready") wird ==Ready) und den jsonpath-Ausdruck bricht -
  # deshalb argv (keine shlex-Verarbeitung, jedes Element geht 1:1 in den Prozess).
  command:
    argv:
      - k3s
      - kubectl
      - get
      - node
      - "{{ inventory_hostname }}"
      - -o
      - jsonpath={.status.conditions[?(@.type=="Ready")].status}
  delegate_to: "{{ groups['control_plane'][0] }}"
  register: node_ready
  until: node_ready.stdout == "True"
  retries: 30
  delay: 5
  changed_when: false
