---
- name: Check whether k3s is already installed
  stat:
    path: /usr/local/bin/k3s
  register: k3s_bin

# --node-ip dual-stack (IPv6 primary + IPv4), same as roles/k3s_server - see the comment there and
# CLAUDE.md ## Infra layering for the reason (pods need IPv4 egress to IPv4-only targets such as
# github.com).
- name: Install the k3s agent and join it to the control plane
  shell: |
    set -o pipefail
    curl -sfL https://get.k3s.io | \
    INSTALL_K3S_VERSION={{ k3s_version }} \
    K3S_URL=https://[{{ hostvars[groups['control_plane'][0]].ansible_host }}]:6443 \
    K3S_TOKEN={{ hostvars[groups['control_plane'][0]].k3s_node_token }} \
    sh -s - agent \
      --node-ip {{ ansible_host }},{{ node_ip_v4 }}
  args:
    executable: /bin/bash
  when: not k3s_bin.stat.exists

- name: Wait until the control plane reports the node as Ready
  # A command given as a string would be shlex-parsed by Ansible, which swallows the quotes around
  # "Ready" (=="Ready" becomes ==Ready) and breaks the jsonpath expression - hence argv (no shlex
  # processing, every element is passed to the process as-is).
  command:
    argv:
      - k3s
      - kubectl
      - get
      - node
      - "{{ inventory_hostname }}"
      - -o
      - jsonpath={.status.conditions[?(@.type=="Ready")].status}
  delegate_to: "{{ groups['control_plane'][0] }}"
  register: node_ready
  until: node_ready.stdout == "True"
  retries: 30
  delay: 5
  changed_when: false
