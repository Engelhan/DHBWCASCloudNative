---
# Only the ArgoCD/GitOps part, callable separately - e.g. to apply a changed
# gitops/applicationset.yaml or secrets.yml after the first "site.yml" run without touching k3s
# again. Nothing syncs the ApplicationSets themselves - a change to gitops/applicationset.yaml
# needs exactly this run.

- name: (Re-)bootstrap ArgoCD
  hosts: control_plane
  become: true
  roles:
    - argocd_bootstrap

- name: Create GitOps secrets (repo credential, RFC2136 TSIG for cert-manager/external-dns)
  hosts: control_plane
  become: true
  roles:
    - gitops_secrets

- name: Roll out the ApplicationSets in stages (platform green first, then the application)
  hosts: control_plane
  become: true
  roles:
    - gitops_rollout
