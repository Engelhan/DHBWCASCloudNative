---
# GitOps part only. Re-run after changing gitops/applicationset.yaml or secrets.yml.

- name: (Re-)bootstrap ArgoCD
  hosts: control_plane
  become: true
  roles:
    - argocd_bootstrap

- name: Create GitOps secrets (repo credential, RFC2136 TSIG for cert-manager/external-dns)
  hosts: control_plane
  become: true
  roles:
    - gitops_secrets

- name: Roll out the ApplicationSets in stages (platform green first, then the application)
  hosts: control_plane
  become: true
  roles:
    - gitops_rollout
