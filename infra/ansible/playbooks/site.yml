---
# Gesamtablauf: Basis-Konfiguration -> k3s-Server -> k3s-Agents -> Node-Labels -> ArgoCD ->
# GitOps-Secrets. Reihenfolge ist bewusst so gewaehlt, dass jede Rolle auf dem Ergebnis der
# vorherigen aufbaut (Agents brauchen den Node-Token des Servers, Labels brauchen registrierte
# Worker-Nodes, gitops_secrets braucht die von k3s_server lokal abgeholte kubeconfig usw.).

- name: Basis-Konfiguration auf allen Nodes
  hosts: k3s_cluster
  become: true
  roles:
    - common

- name: k3s-Server auf der Control-Plane installieren
  hosts: control_plane
  become: true
  roles:
    - k3s_server

- name: k3s-Agents auf den Workern installieren
  hosts: workers
  become: true
  roles:
    - k3s_agent

- name: Node-Labels fuer die simulierten Regionen setzen (P4)
  hosts: control_plane
  become: true
  roles:
    - node_labels

- name: ArgoCD bootstrappen
  hosts: control_plane
  become: true
  roles:
    - argocd_bootstrap

- name: GitOps-Secrets anlegen (RFC2136-TSIG fuer cert-manager/external-dns)
  hosts: control_plane
  become: true
  roles:
    - gitops_secrets
