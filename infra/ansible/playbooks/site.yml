---
# Full run: base configuration -> k3s server -> k3s agents -> node labels -> ArgoCD -> GitOps
# secrets -> staged GitOps rollout. The order is deliberate so that every role builds on the
# result of the previous one (agents need the server's node token, labels need registered worker
# nodes, gitops_secrets needs the kubeconfig fetched locally by k3s_server, gitops_rollout needs
# the repo credential from gitops_secrets, etc.).

- name: Base configuration on all nodes
  hosts: k3s_cluster
  become: true
  roles:
    - common

- name: Install the k3s server on the control plane
  hosts: control_plane
  become: true
  roles:
    - k3s_server

- name: Install the k3s agents on the workers
  hosts: workers
  become: true
  roles:
    - k3s_agent

- name: Set node labels for the simulated regions (P4) and taint the control plane
  hosts: control_plane
  become: true
  roles:
    - node_labels

- name: Bootstrap ArgoCD
  hosts: control_plane
  become: true
  roles:
    - argocd_bootstrap

- name: Create GitOps secrets (repo credential, RFC2136 TSIG for cert-manager/external-dns)
  hosts: control_plane
  become: true
  roles:
    - gitops_secrets

- name: Roll out the ApplicationSets in stages (platform green first, then the application)
  hosts: control_plane
  become: true
  roles:
    - gitops_rollout
