name: build-images

# Baut reproduzierbar Container-Images aus src/ (P1) und taggt sie mit dem Git-Short-SHA statt
# `:latest` (P3). Push nach ghcr.io (GitHub Container Registry) - laut Aufgabenstellung/
# CLAUDE.md ausdruecklich erlaubte externe Abhaengigkeit ("container registries/package
# sources"), Auth ueber den eingebauten GITHUB_TOKEN, kein zusaetzliches Secret noetig. Die
# Packages muessen einmalig nach dem ersten Push in den GitHub-Package-Settings auf "Public"
# gestellt werden (GITHUB_TOKEN kann das nicht selbst setzen) - sonst braucht der Cluster ein
# imagePullSecret zum Pullen, siehe CLAUDE.md ## Current implementation status
# (reservation-worker).

on:
  push:
    branches: [main]
    paths:
      - "src/**"

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service:
          - catalog-api
          - reservation-worker
          - notification-worker
          - frontend
    steps:
      - uses: actions/checkout@v5

      - name: Lowercase repository owner (ghcr.io requires lowercase image names)
        run: echo "OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.service }}
        run: |
          IMAGE="${REGISTRY}/${OWNER_LC}/ticketflow-${{ matrix.service }}:${GITHUB_SHA::8}"
          docker build -t "$IMAGE" src/${{ matrix.service }}
          docker push "$IMAGE"
