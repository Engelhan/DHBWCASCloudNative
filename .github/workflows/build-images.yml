name: build-images

# Builds the service images and pushes them to ghcr.io tagged with the short SHA (P3) and :latest.
# The packages must be set to public once after the first push.

on:
  push:
    branches: [main]
    paths:
      - "src/**"
  # Lets a fresh fork build images without touching src/.
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service:
          - catalog-api
          - reservation-worker
          - notification-worker
          - frontend
    steps:
      - uses: actions/checkout@v5

      - name: Lowercase repository owner (ghcr.io requires lowercase image names)
        run: echo "OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.service }}
        run: |
          BASE="${REGISTRY}/${OWNER_LC}/ticketflow-${{ matrix.service }}"
          SHA_TAG="${BASE}:${GITHUB_SHA::8}"
          LATEST_TAG="${BASE}:latest"
          docker build -t "$SHA_TAG" -t "$LATEST_TAG" src/${{ matrix.service }}
          docker push "$SHA_TAG"
          docker push "$LATEST_TAG"

  # Writes the new tag into gitops/env/cluster.yaml so ArgoCD rolls it out. Separate job so the four
  # parallel builds produce exactly one commit. No loop: the commit only touches gitops/.
  bump-image-tag:
    needs: build
    runs-on: ubuntu-latest
    # main only.
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - name: Set ticketflow.imageTag in gitops/env/cluster.yaml
        run: |
          set -euo pipefail
          SHA_TAG="${GITHUB_SHA::8}"
          # Replace only the imageTag line to keep the file's comments.
          sed -i -E "s|^(  imageTag: ).*|\1\"${SHA_TAG}\"|" gitops/env/cluster.yaml
          grep -q "imageTag: \"${SHA_TAG}\"" gitops/env/cluster.yaml

          if git diff --quiet -- gitops/env/cluster.yaml; then
            echo "imageTag is already ${SHA_TAG} - nothing to do."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gitops/env/cluster.yaml
          git commit -m "chore: bump image tag to ${SHA_TAG}"
          # Rebase in case main moved during the build.
          git pull --rebase origin main
          git push origin main
